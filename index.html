  <style>
    :root {
      --bg: #f6f1e7; --bg-card: #fffaf0; --ink: #1a0a14; --ink-soft: #4a2a3a;
      --berry: #e93ca3; --berry-deep: #b8217a; --acid: #d1db58; --line: #2a1018;
      --good: #1f8f4a; --rusty: #d97a1f; --learn: #c12c2c;
    }
    html, body { background: var(--bg); color: var(--ink); }
    body { font-family: 'Inter Tight', system-ui, sans-serif;
      background-image: radial-gradient(circle at 1px 1px, rgba(26,10,20,0.08) 1px, transparent 0);
      background-size: 22px 22px; }
    .display { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
    .display-italic { font-family: 'Fraunces', Georgia, serif; font-style: italic; }
    .wordmark { font-family: 'Fraunces', Georgia, serif; font-weight: 800;
      letter-spacing: -0.04em; font-variation-settings: "opsz" 144; }
    .ticker { letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; font-size: 0.72rem; }
    .card { background: var(--bg-card); border: 1.5px solid var(--line); box-shadow: 4px 4px 0 var(--line); }
    .card-flat { background: var(--bg-card); border: 1.5px solid var(--line); }
    .btn { border: 1.5px solid var(--line); box-shadow: 3px 3px 0 var(--line);
      transition: transform 80ms ease, box-shadow 80ms ease; }
    .btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--line); }
    .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--line); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .pill { border: 1.2px solid var(--line); }
    .input { background: #fffdf6; border: 1.5px solid var(--line);
      padding: 0.5rem 0.75rem; font-family: 'Inter Tight', sans-serif; width: 100%; }
    .input:focus { outline: none; box-shadow: 3px 3px 0 var(--berry); }
    .tab-active { background: var(--ink); color: var(--bg); }
    .berry-bg { background: var(--berry); color: #fff; }
    .acid-bg { background: var(--acid); color: var(--ink); }
    details > summary { cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    .tab-nav-wrap { position: relative; }
    .tab-nav-wrap::after {
      content: "";
      position: absolute; top: 0; right: 0; bottom: 0; width: 24px;
      background: linear-gradient(to right, transparent, var(--bg));
      pointer-events: none;
    }
    @media (min-width: 640px) {
      .tab-nav-wrap::after { display: none; }
    }
    @media (max-width: 640px) {
      .card { box-shadow: 3px 3px 0 var(--line); }
      .modal-bg { padding: 0.5rem; }
      body { background-size: 18px 18px; }
    }
    @media (min-width: 1280px) {
      body { background-size: 26px 26px; }
    }
    .modal-bg { position: fixed; inset: 0; background: rgba(26,10,20,0.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .blink { animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0.5; } }
  </style>

</head>

const SetupScreen = ({onCreated}) => {
  const [apiKey, setApiKey] = useState("");
  const [working, setWorking] = useState(false);
  const [err, setErr] = useState("");
  const create = async () => {
    const key = apiKey.trim();
    if (!key) { setErr("Paste your JSONBin API key first."); return; }
    setWorking(true); setErr("");
    try {
      const id = await jbCreateBin(key, buildSeedState());
      if (!id) throw new Error("JSONBin didn't return a bin ID.");
      onCreated(id);
    } catch (e) { setErr(e.message); } finally { setWorking(false); }
  };
  return h("div",{className:"max-w-2xl mx-auto px-4 py-8"},
    h("header",{className:"mb-6"},
      h("div",{className:"ticker text-[var(--berry)]"},"First-time setup"),
      h(Wordmark, {className:"h-12 sm:h-16 mt-1"})
    ),
    h("div",{className:"card p-5"},
      h("h2",{className:"display text-2xl mb-2"},"Connect your database"),
      h("ol",{className:"text-sm space-y-2 mb-5 pl-5 list-decimal"},
        h("li",null,"Open ", h("a",{className:"text-[var(--berry)] underline",href:"https://jsonbin.io/api-keys",target:"_blank",rel:"noopener"},"jsonbin.io/api-keys"), " in another tab."),
        h("li",null,"Copy your ", h("strong",null,"Master Key"), "."),
        h("li",null,"Paste it below and tap ", h("strong",null,"Create database"), ".")
      ),
      h("label",{className:"block text-sm"},
        h("div",{className:"ticker mb-1"},"JSONBin Master Key"),
        h("input",{className:"input font-mono text-xs",type:"password",value:apiKey,onChange:e=>setApiKey(e.target.value),placeholder:"$2a$10$...",autoComplete:"off",autoCapitalize:"off",autoCorrect:"off",spellCheck:"false"})
      ),
      err && h("div",{className:"mt-3 p-3 border border-[var(--berry)] bg-[var(--berry)]/10 text-sm"}, h("strong",null,"Couldn't set up:"), " ", err),
      h("div",{className:"mt-4"},
        h("button",{onClick:create,disabled:working,className:"btn berry-bg px-5 py-2.5 font-semibold"}, working?"Creating…":"Create database")
      )
    )
  );
};

const ShareScreen = ({binId, onContinue}) => {
  const [copied, setCopied] = useState(false);
  const url = window.location.origin + window.location.pathname + "?bin=" + binId;
  const copy = async () => {
    try { await navigator.clipboard.writeText(url); setCopied(true); setTimeout(()=>setCopied(false), 2000); }
    catch (e) {
      const ta = document.getElementById("share-url");
      if (ta) { ta.select(); document.execCommand("copy"); setCopied(true); setTimeout(()=>setCopied(false), 2000); }
    }
  };
  return h("div",{className:"max-w-2xl mx-auto px-4 py-8"},
    h("header",{className:"mb-6"},
      h("div",{className:"ticker text-[var(--berry)]"},"Done!"),
      h(Wordmark, {className:"h-12 sm:h-16 mt-1"})
    ),
    h("div",{className:"card p-5"},
      h("h2",{className:"display text-2xl mb-2"},"Share this URL with the band"),
      h("div",{className:"flex gap-2 items-stretch mt-3"},
        h("input",{id:"share-url",className:"input font-mono text-xs flex-1",readOnly:true,value:url}),

};

const processProfileImage = file => new Promise((resolve, reject) => {
  if (!file) return reject(new Error("No file selected"));
  if (!file.type || !file.type.startsWith("image/")) return reject(new Error("That's not an image file"));
  if (file.size > 10*1024*1024) return reject(new Error("Image too large (max 10MB)"));
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      try {
        const target = 200;
        const canvas = document.createElement("canvas");
        canvas.width = target; canvas.height = target;
        const ctx = canvas.getContext("2d");
        const size = Math.min(img.width, img.height);
        const sx = Math.floor((img.width - size) / 2);
        const sy = Math.floor((img.height - size) / 2);
        ctx.drawImage(img, sx, sy, size, size, 0, 0, target, target);
        resolve(canvas.toDataURL("image/jpeg", 0.7));
      } catch(e) { reject(new Error("Couldn't process image")); }
    };
    img.onerror = () => reject(new Error("Couldn't load image"));
    img.src = ev.target.result;
  };
  reader.onerror = () => reject(new Error("Couldn't read file"));
  reader.readAsDataURL(file);
});

// === ITERATION A.1: BackupsSection component ===
const BackupsSection = ({binId, state, onRestore}) => {
  const [refreshTick, setRefreshTick] = useState(0);
  const [feedback, setFeedback] = useState("");
  const [error, setError] = useState("");
  const [importing, setImporting] = useState(false);
  const backups = useMemo(() => loadBackups(binId), [binId, refreshTick]);
  const showFlash = (msg) => { setFeedback(msg); setError(""); setTimeout(()=>setFeedback(""), 3000); };
  const showError = (msg) => { setError(msg); setFeedback(""); };
  const onSnapshotNow = () => {
    setError(""); setFeedback("");
    if (!state) { showError("No data to snapshot yet."); return; }
    const entry = saveBackup(binId, state, {force: true});
    if (entry) { setRefreshTick(t => t+1); showFlash("Snapshot saved."); }
    else showError("Couldn't save snapshot. Browser storage may be full.");
  };
  const onDownloadCurrent = () => {
    if (!state) { showError("No data loaded."); return; }
    const fname = "sourberry-current-" + todayISO() + ".json";
    const ok = downloadJSON(fname, state);
    if (ok) showFlash("Download started."); else showError("Download failed.");
  };
  const onDownloadSnapshot = (entry) => {
    try {
      const obj = JSON.parse(entry.dataJson);
      const ts = new Date(entry.timestamp);
      const datePart = ts.getFullYear() + "-" + String(ts.getMonth()+1).padStart(2,"0") + "-" + String(ts.getDate()).padStart(2,"0") + "_" + String(ts.getHours()).padStart(2,"0") + String(ts.getMinutes()).padStart(2,"0");
      const fname = "sourberry-snapshot-" + datePart + ".json";
      const ok = downloadJSON(fname, obj);
      if (ok) showFlash("Download started."); else showError("Download failed.");
    } catch (e) { showError("Couldn't read this snapshot."); }
  };
  const onDelete = (entry) => {
    if (!confirm("Delete this snapshot from this device? (The other snapshots and the live database are unaffected.)")) return;
    deleteBackup(binId, entry.timestamp);
    setRefreshTick(t => t+1);
  };
  const performRestore = (parsedObj, sourceLabel) => {
    // Always force-snapshot the current state first, as a safety net.
    if (state) {
      try { saveBackup(binId, state, {force: true}); } catch (_) {}
    }
    try {
      migrate(parsedObj); // forward-only, idempotent
    } catch (e) {
      showError("Migration of " + sourceLabel + " failed: " + (e.message || "unknown error"));
      return;
    }
    onRestore(parsedObj);
    setRefreshTick(t => t+1);
    showFlash("Restored from " + sourceLabel + ". Saving to the live database…");
  };
  const onRestoreSnapshot = (entry) => {
    const when = fmtBackupTimestamp(entry.timestamp);
    const msg = "Restore band data from " + when + "?\n\n" +
      "This will REPLACE all current band data, including any changes other members have made since then. They'll see the change next time their app refreshes (within 30 seconds).\n\n" +
      "A safety snapshot of the current state will be saved first.";
    if (!confirm(msg)) return;
    let parsed;
    try { parsed = JSON.parse(entry.dataJson); }
    catch (e) { showError("Couldn't read this snapshot."); return; }
    performRestore(parsed, "snapshot of " + when);
  };
  const onImportFile = (file) => {
    setError(""); setFeedback("");
    if (!file) return;
    if (file.size > 25 * 1024 * 1024) { showError("File is too large (max 25MB)."); return; }
    setImporting(true);
    const reader = new FileReader();
    reader.onload = ev => {
      setImporting(false);
      let parsed;
      try { parsed = JSON.parse(ev.target.result); }
      catch (e) { showError("That file isn't valid JSON."); return; }
      const shapeErr = validateBackupShape(parsed);
      if (shapeErr) { showError("That file doesn't look like Sourberry data: " + shapeErr); return; }
      const sv = parsed.schemaVersion;
      const msg = "Restore band data from imported file?\n\n" +
        "Schema version: " + sv + "\n\n" +
        "This will REPLACE all current band data. The other members will see the change within 30 seconds.\n\n" +
        "A safety snapshot of the current state will be saved first.";
      if (!confirm(msg)) return;
      performRestore(parsed, "imported file");
    };
    reader.onerror = () => { setImporting(false); showError("Couldn't read that file."); };
    reader.readAsText(file);
  };
  const totalSize = backups.reduce((sum, b) => sum + (b.sizeBytes || 0), 0);
  return h("div",{className:"mt-5 pt-4 border-t border-[var(--line)]/15"},
    h("div",{className:"ticker text-[var(--berry)] mb-2"},"Backups"),
    h("p",{className:"text-xs text-[var(--ink-soft)] mb-3"},

const SyncPanel = ({sync, onClose}) => {
  const [retrying, setRetrying] = useState(false);
  const ago = sync.lastSyncedAt ? Math.round((Date.now() - sync.lastSyncedAt)/1000) : null;
  const isRateLimit = sync.errorStatus === 429;
  const is404 = sync.errorStatus === 404;
  const reset = () => {
    if (!confirm("This will clear the saved bin ID on this device. Continue?")) return;
    setStoredBinId(null);
    window.location.href = window.location.origin + window.location.pathname;
  };
  const retry = async () => { setRetrying(true); await sync.refresh(); setRetrying(false); };
  const reload = async () => { setRetrying(true); await sync.reloadFromServer(); setRetrying(false); };
  return h("div",{className:"modal-bg",onClick:onClose},
    h("div",{className:"card p-5 max-w-lg w-full",onClick:e=>e.stopPropagation()},
      h("div",{className:"flex items-center justify-between mb-3"},
        h("h3",{className:"display text-2xl"},"Sync status"),
        h("button",{onClick:onClose,className:"ticker text-[var(--ink-soft)]"},"Close ✕")
      ),
      h("div",{className:"space-y-3 text-sm"},
        h("div",null,
          h("div",{className:"ticker text-[var(--ink-soft)] mb-1"},"Status"),
          h("div",{className:"font-semibold"},
            sync.status==="ok"&&h("span",{className:"text-[var(--good)]"},"✓ Connected"),
            sync.status==="loading"&&h("span",null,"⟳ Loading…"),
            sync.status==="saving"&&h("span",null,"⟳ Saving…"),
            sync.status==="error"&&h("span",{className:"text-[var(--berry)]"},"✗ Sync error")
          )
        ),
        h("div",null,
          h("div",{className:"ticker text-[var(--ink-soft)] mb-1"},"Last successful sync"),
          h("div",null, ago!==null ? (ago + " seconds ago") : "Never this session")
        ),
        sync.status==="error" && h(React.Fragment,null,
          h("div",null,
            h("div",{className:"ticker text-[var(--ink-soft)] mb-1"},"What happened"),
            isRateLimit ? h("p",null,"You've hit JSONBin's rate limit. The free tier allows a limited number of requests per month. Upgrade JSONBin (~£3/month) or wait until next month.")
            : is404 ? h("p",null,"The database wasn't found. The bin may have been deleted or your URL is wrong.")
            : h("p",null,"The app couldn't reach JSONBin or the request failed. Could be a temporary network blip.")
          ),
          h("details",null,
            h("summary",{className:"ticker text-[var(--ink-soft)]"},"Technical details ▾"),
            h("pre",{className:"mt-2 p-2 bg-black/5 text-xs overflow-x-auto whitespace-pre-wrap break-all"}, sync.errorMsg)
          )
        ),
        h("div",{className:"pt-3 border-t border-[var(--line)]/20 flex flex-wrap gap-2"},
          h("button",{onClick:retry,disabled:retrying,className:"btn berry-bg px-3 py-1.5 text-sm font-semibold"}, retrying?"Trying…":"Retry now"),
          h("button",{onClick:reload,disabled:retrying,className:"btn bg-white px-3 py-1.5 text-sm"},"Force reload"),
          h("button",{onClick:reset,className:"btn bg-white px-3 py-1.5 text-sm text-[var(--berry)] ml-auto"},"Reset connection")
        )
      )
    )
  );
};
const SyncBadge = ({sync, onOpen}) => {
  const ago = sync.lastSyncedAt ? Math.round((Date.now() - sync.lastSyncedAt)/1000) : null;

const TypedScheduleView = ({type, state, member, mutate, locations}) => {
  const [editingId, setEditingId] = useState(null);
  const [creating, setCreating] = useState(false);
  const [showPast, setShowPast] = useState(false);
  const all = eventsList(state.events).filter(e => e.type === type);
  const todayStr = todayISO();
  const upcoming = all.filter(e => e.date >= todayStr);
  const past = all.filter(e => e.date < todayStr).reverse();
  const onSave = (ev) => {
    mutate(prev => {
      const id = ev.id || newId("ev");
      const events = Object.assign({}, prev.events);
      events[id] = Object.assign({createdAt: Date.now(), availability:{}}, events[id], ev);
      delete events[id].id;
      return Object.assign({}, prev, {events});
    });
    setCreating(false); setEditingId(null);
  };
  const onDelete = (ev) => {
    if (!confirm("Delete this " + ev.type + "?")) return;
    mutate(prev => {
      const events = Object.assign({}, prev.events);
      delete events[ev.id];
      return Object.assign({}, prev, {events});
    });
  };
  const onSetAvail = (id, mid, val) => {
    mutate(prev => {
      const e = Object.assign({}, prev.events[id]);
      e.availability = Object.assign({}, e.availability || {});
      if (val == null) delete e.availability[mid];
      else e.availability[mid] = val;
      return Object.assign({}, prev, {events: Object.assign({}, prev.events, {[id]: e})});
    });
  };
  const setlists = setlistsList(state.setlists);
  const noun = type==="gig" ? "gig" : "rehearsal";
  return h("section",{className:"space-y-3"},
    creating && h(EventForm,{initial: blankEvent(type), locations, onSave, onCancel:()=>setCreating(false), setlists, songs: state.songs}),
    !creating && h("button",{onClick:()=>setCreating(true),className:"btn berry-bg px-3 py-1.5 text-sm font-semibold"},"+ Add " + noun),
    upcoming.length > 0 && h("div",{className:"space-y-3"},
      upcoming.map(ev => editingId===ev.id
        ? h(EventForm,{key:ev.id,initial:Object.assign({id:ev.id},ev),locations,onSave,onCancel:()=>setEditingId(null),setlists,songs:state.songs})
        : h(EventCard,{key:ev.id, ev, member, onSetAvail, onEdit:()=>setEditingId(ev.id), onDelete, isPast:false, defaultOpen:false})
      )
    ),
    upcoming.length===0 && !creating && h("div",{className:"text-center py-8 text-[var(--ink-soft)] italic"},"No upcoming ", noun, "s scheduled."),
    past.length > 0 && h("details",{open:showPast,onToggle:e=>setShowPast(e.target.open)},
      h("summary",{className:"ticker text-[var(--ink-soft)] py-2 cursor-pointer"}, "Past " + noun + "s (" + past.length + ") " + (showPast?"▴":"▾")),

  const [searchErr, setSearchErr] = useState("");
  const set = (k,v) => setS(prev => Object.assign({}, prev, {[k]: v}));
  const search = async () => {
    const q = ((s.title||"") + " " + (s.artist||"")).trim();
    if (!q) { setSearchErr("Enter a title and/or artist first."); return; }
    setSearching(true); setSearchErr(""); setResults([]);
    try {
      const list = await itunesSearch(q, 5);
      if (list.length === 0) setSearchErr("No matches found.");
      setResults(list);
    } catch (e) { setSearchErr(e.message || "Search failed"); }
    finally { setSearching(false); }
  };

    setS(prev => Object.assign({}, prev, {

      artist: prev.artist || r.artist,

      coverArtUrl: prev.coverArtUrl || r.coverArtUrl,

    if (!s.lengthSec && r.lengthSec) setLengthStr(formatDuration(r.lengthSec));

    const out = Object.assign({}, s);

const SongsView = ({state, member, mutate}) => {
  const [editing, setEditing] = useState(null);
  const [creating, setCreating] = useState(false);
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("");
  const [showAdvanced, setShowAdvanced] = useState(false);
  const [bulkBusy, setBulkBusy] = useState(false);
  const [bulkResult, setBulkResult] = useState(null);
  const all = songsList(state.songs);
  const filtered = all.filter(s => songMatchesQuery(s, query) && (statusFilter==="" || s.status === statusFilter)).sort((a,b) => (a.title||"").localeCompare(b.title||""));
  const counts = {};
  SONG_STATUSES.forEach(st => counts[st.id] = all.filter(s => s.status === st.id).length);
  const onSave = (s) => {
    const id = (s.title || s.artist) ? songId(s.title, s.artist) : newId("s");
    mutate(prev => {
      const songs = Object.assign({}, prev.songs);
      const existing = songs[id] || {};
      songs[id] = Object.assign({}, existing, s, {createdAt: existing.createdAt || Date.now()});
      return Object.assign({}, prev, {songs});
    });
    setCreating(false); setEditing(null);
  };
  const bulkLookup = async () => {
    setBulkBusy(true); setBulkResult(null);
    let updated = 0, skipped = 0, errored = 0, processed = 0;
    const toProcess = all.filter(s => !s.lengthSec || !s.coverArtUrl);
    for (const s of toProcess) {
      try {
        const q = ((s.title||"") + " " + (s.artist||"")).trim();
        if (!q) { skipped++; continue; }
        const results = await itunesSearch(q, 5);
        const hit = results.find(r => confidenceMatch(s, r));
        if (!hit) { skipped++; processed++; continue; }
        mutate(prev => {
          const songs = Object.assign({}, prev.songs);
          const cur = Object.assign({}, songs[s.id]);
          if (!cur.album && hit.album) cur.album = hit.album;
          if (!cur.year && hit.year) cur.year = hit.year;
          if (!cur.lengthSec && hit.lengthSec) cur.lengthSec = hit.lengthSec;
          if (!cur.coverArtUrl && hit.coverArtUrl) cur.coverArtUrl = hit.coverArtUrl;
          if (!cur.iTunesUrl && hit.iTunesUrl) cur.iTunesUrl = hit.iTunesUrl;
          songs[s.id] = cur;
          return Object.assign({}, prev, {songs});
        });
        updated++; processed++;
      } catch (e) { errored++; processed++; }
      await new Promise(r => setTimeout(r, 200));
    }
    setBulkBusy(false);
    setBulkResult({updated, skipped, errored, total: toProcess.length});
  };
  return h("section",{className:"space-y-3"},
    h("div",{className:"flex flex-wrap gap-2 items-center"},
      h("input",{className:"input flex-1 min-w-[180px]",placeholder:"Search title or artist…",value:query,onChange:e=>setQuery(e.target.value)}),
      h("select",{className:"input w-auto",value:statusFilter,onChange:e=>setStatusFilter(e.target.value)},
        h("option",{value:""},"All (" + all.length + ")"),
        SONG_STATUSES.map(st => h("option",{key:st.id,value:st.id}, st.label, " (", counts[st.id], ")")))
    ),
    !creating && h("div",{className:"flex flex-wrap gap-2"},
      h("button",{onClick:()=>setCreating(true),className:"btn berry-bg px-3 py-1.5 text-sm font-semibold"},"+ Add song"),
      h("button",{onClick:()=>setShowAdvanced(o=>!o),className:"btn bg-white px-3 py-1.5 text-sm"}, showAdvanced?"Hide bulk tools":"Bulk tools…")
    ),
    showAdvanced && h("div",{className:"card p-3 text-sm space-y-2"},
      h("p",{className:"text-xs text-[var(--ink-soft)]"},"Looks up iTunes metadata for songs missing length or cover art. Only fills blanks — won't overwrite manual edits. Strict title match to avoid filling in covers/live versions."),
      h("button",{onClick:bulkLookup,disabled:bulkBusy,className:"btn bg-white px-3 py-1.5 text-xs"}, bulkBusy?"Working…":"Run bulk lookup"),
      bulkResult && h("div",{className:"text-xs"}, "Done. Updated ", bulkResult.updated, " · Skipped ", bulkResult.skipped, (bulkResult.errored>0?(" · Errors " + bulkResult.errored):""), " of ", bulkResult.total)
    ),
    creating && h(SongForm,{initial:blankSong(),onSave,onCancel:()=>setCreating(false)}),
    editing && h(SongForm,{initial:editing,onSave,onCancel:()=>setEditing(null)}),
    h("div",{className:"space-y-1.5"},
      filtered.length === 0
        ? h("p",{className:"text-center py-8 text-[var(--ink-soft)] italic"},"No songs match.")
        : filtered.map(s => h(SongCard,{key:s.id,s,member,mutate,profiles:state.memberProfiles}))
    )
  );
};

const isWeekend = (d) => { const dow = d.getDay(); return dow === 0 || dow === 6; };
const localISO = (d) => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const slotLabelForDate = (d) => isWeekend(d) ? "Afternoon" : "Evening";
const slotDescForDate = (d) => isWeekend(d) ? "afternoon (~2pm–6pm)" : "evening (~6pm–10pm)";
const defaultTimeForDate = (d) => isWeekend(d) ? {start:"14:00", end:"18:00"} : {start:"18:00", end:"21:00"};

const dayCellColor = (statuses) => {
  const yes = statuses.filter(s => s === "yes").length;
  const no = statuses.filter(s => s === "no").length;
  const maybe = statuses.filter(s => s === "maybe").length;
  if (no >= 2) return "bg-[var(--learn)]/20";
  if (yes === 4) return "bg-[var(--good)]/30";
  if (yes >= 2 && no === 0) return "bg-[var(--good)]/15";
  if (maybe + yes >= 2 && no === 0) return "bg-[var(--rusty)]/15";
  return "";
};

const PracticeView = ({state, member, mutate}) => {
  const [monthOffset, setMonthOffset] = useState(0);
  const [selectedDate, setSelectedDate] = useState(null);
  const today = new Date(); today.setHours(0,0,0,0);
  const baseMonth = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
  const monthLabel = baseMonth.toLocaleDateString(undefined, {month:"long", year:"numeric"});
  // Build 6-week grid starting from Monday of week containing 1st of month
  const firstOfMonth = new Date(baseMonth);
  const dayOfWeek = (firstOfMonth.getDay() + 6) % 7; // Mon=0
  const gridStart = new Date(firstOfMonth); gridStart.setDate(firstOfMonth.getDate() - dayOfWeek);
  const days = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
    days.push(d);
  }
  const setAvail = (iso, mid, val) => {
    mutate(prev => {
      const pa = Object.assign({}, prev.practiceAvail || {});
      const day = Object.assign({}, pa[iso] || {});
      if (val == null) delete day[mid];
      else day[mid] = val;
      if (Object.keys(day).length === 0) delete pa[iso];
      else pa[iso] = day;
      return Object.assign({}, prev, {practiceAvail: pa});
    });
  };
  const onPickDate = (iso) => setSelectedDate(iso === selectedDate ? null : iso);
  return h("section",{className:"space-y-3"},
    h("div",{className:"flex items-center justify-between"},
      h("button",{onClick:()=>setMonthOffset(o=>o-1),className:"btn bg-white px-3 py-1.5 text-sm"},"← Prev"),
      h("div",{className:"display text-xl font-semibold"}, monthLabel),
      h("button",{onClick:()=>setMonthOffset(o=>o+1),className:"btn bg-white px-3 py-1.5 text-sm"},"Next →")
    ),
    h("div",{className:"text-xs text-[var(--ink-soft)] text-center"},
      "Weekdays = evening slot (~6pm–10pm). Weekends = afternoon slot (~2pm–6pm). Tap a day to mark availability."
    ),
    h("div",{className:"grid grid-cols-7 gap-1 text-[10px] sm:text-xs"},
      ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => h("div",{key:d,className:"ticker text-center text-[var(--ink-soft)] py-1"}, d))
    ),
    h("div",{className:"grid grid-cols-7 gap-1"},
      days.map(d => {
        const iso = localISO(d);
        const inMonth = d.getMonth() === baseMonth.getMonth();
        const isToday = iso === todayISO();
        const statuses = MEMBERS.map(m => state.practiceAvail && state.practiceAvail[iso] && state.practiceAvail[iso][m.id]).filter(Boolean);
        const cls = dayCellColor(statuses);
        const isSelected = iso === selectedDate;
        return h("button",{
          key:iso,
          onClick:()=>onPickDate(iso),
          className:"min-h-[60px] p-1 text-left border " + (isSelected ? "border-[var(--berry)] border-2" : "border-[var(--line)]/30") + " " + cls + " " + (inMonth ? "bg-white" : "bg-gray-50/30 opacity-50") + (isToday ? " ring-2 ring-[var(--ink]" : "")
        },
          h("div",{className:"text-xs font-semibold " + (isToday?"text-[var(--berry)]":"")}, d.getDate()),
          h("div",{className:"flex flex-wrap gap-0.5 mt-1"},
            MEMBERS.map(m => {
              const v = state.practiceAvail && state.practiceAvail[iso] && state.practiceAvail[iso][m.id];
              if (!v) return null;
              const bg = v==="yes"?"var(--good)":v==="maybe"?"var(--rusty)":"var(--learn)";
              return h("span",{key:m.id,className:"text-[8px] text-white px-1 rounded",style:{background:bg},title: m.name + " " + v}, m.name[0]);
            })
          )
        );
      })
    ),
    selectedDate && h(DayDetailPanel,{iso:selectedDate, state, member, onSet:setAvail, mutate, onClose:()=>setSelectedDate(null)})
  );
};

const DayDetailPanel = ({iso, state, member, onSet, mutate, onClose}) => {

      events[id] = {date:iso, startTime:t.start, endTime:t.end, type:"rehearsal", venueType:"in-person-studio", location:"", bookingOwner:"", confirmed:false, status:"proposed", title:"", comments:"Proposed from availability calendar.", availability:{}, createdAt:Date.now()};
      return Object.assign({}, prev, {events});
    });
    alert("Rehearsal proposed for " + fmtDateLong(iso) + ". Confirm details on the Rehearsals tab.");
    onClose();
  };
  return h("div",{className:"card p-4 mt-3"},
    h("div",{className:"flex items-center justify-between mb-3"},
      h("div",null,
        h("div",{className:"display text-xl font-semibold"}, fmtDateLong(iso)),
        h("div",{className:"text-xs text-[var(--ink-soft)]"}, slot, " — ", slotDesc)
      ),
      h("button",{onClick:onClose,className:"ticker text-[var(--ink-soft)]"},"Close ✕")
    ),
    !member && h("p",{className:"text-xs text-[var(--ink-soft)] italic mb-3"},"Pick who you are above to mark your availability."),
    h("div",{className:"space-y-2"},
      MEMBERS.map(m => {
        const cur = dayAvail[m.id];
        const isMe = member && member.id === m.id;
        const opt = (val, label, bg) => h("button",{
          key:val,
          disabled: !isMe,
          onClick:()=> isMe ? onSet(iso, m.id, cur===val ? null : val) : null,
          className:"pill px-2.5 py-1 text-xs font-semibold " + (cur===val?"text-white":"bg-white"),
          style: cur===val ? {background: bg} : {}
        }, label);
        return h("div",{key:m.id,className:"flex items-center gap-2"},
          h("div",{className:"w-20 text-sm font-semibold"}, m.name),
          opt("yes","✓ Yes","var(--good)"),
          opt("maybe","? Maybe","var(--rusty)"),
          opt("no","✗ No","var(--learn)"),
          !isMe && h("span",{className:"text-xs text-[var(--ink-soft)] italic ml-auto"}, cur ? cur : "—")
        );
      })
    ),
    h("div",{className:"mt-4 pt-3 border-t border-[var(--line)]/20"},
      h("button",{onClick:proposeRehearsal,className:"btn berry-bg px-3 py-1.5 text-sm font-semibold"},"Propose rehearsal here"),
      h("p",{className:"text-xs text-[var(--ink-soft)] italic mt-2"},"Creates a draft rehearsal on this date — you can edit details on the Rehearsals tab.")
    )
  );
};

const OwnedEquipmentView = ({state, mutate}) => {
  const [editing, setEditing] = useState(null);
  const [creating, setCreating] = useState(false);
  const all = equipmentList(state.equipment);
  const onSave = (eq) => {
    mutate(prev => {
      const id = eq.id || newId("eq");
      const equipment = Object.assign({}, prev.equipment);
      equipment[id] = Object.assign({createdAt:Date.now()}, equipment[id], eq);
      delete equipment[id].id;
      return Object.assign({}, prev, {equipment});
    });
    setEditing(null); setCreating(false);
  };
  const onDelete = (id) => {
    if (!confirm("Delete this item?")) return;
    mutate(prev => { const equipment = Object.assign({}, prev.equipment); delete equipment[id]; return Object.assign({}, prev, {equipment}); });
  };
  const grouped = {};
  EQUIPMENT_CATEGORIES.forEach(c => grouped[c.id] = []);
  all.forEach(eq => { (grouped[eq.category] = grouped[eq.category] || []).push(eq); });
  return h("section",{className:"space-y-3"},
    creating && h(EquipmentForm,{initial:blankEquipment(),onSave,onCancel:()=>setCreating(false)}),
    !creating && h("button",{onClick:()=>setCreating(true),className:"btn berry-bg px-3 py-1.5 text-sm font-semibold"},"+ Add equipment"),
    EQUIPMENT_CATEGORIES.map(cat => {
      const items = grouped[cat.id];

      return h("div",{key:cat.id},
        h("h3",{className:"display text-lg font-semibold mb-2 mt-3"}, cat.label),
        h("div",{className:"space-y-1.5"},
          items.map(eq => editing===eq.id
            ? h(EquipmentForm,{key:eq.id,initial:Object.assign({id:eq.id},eq),onSave,onCancel:()=>setEditing(null)})
            : h(EquipmentCard,{key:eq.id,eq,onEdit:()=>setEditing(eq.id),onDelete:()=>onDelete(eq.id)})
          )
        )
      );
    }),
    all.length===0 && !creating && h("p",{className:"text-center py-8 text-[var(--ink-soft)] italic"},"No equipment listed yet.")

      h("span",{className:"ticker text-[10px] px-2 py-0.5 shrink-0 text-white",style:{background:priColor}}, w.priority),
      h("div",{className:"flex-1 min-w-0"},
        h("div",{className:"font-semibold truncate"}, w.name),
        h("div",{className:"text-xs text-[var(--ink-soft)] truncate"}, w.estCost ? (w.estCost + " · ") : "", w.status, w.proposer ? (" · by " + w.proposer) : "")
      )
    ),
    open && h("div",{className:"mt-2 pt-2 border-t border-[var(--line)]/15 space-y-1.5 text-sm"},
      w.url && h("div",null, h("a",{href:w.url,target:"_blank",rel:"noopener",className:"text-[var(--berry)] underline truncate inline-block max-w-full"}, w.url)),
      w.notes && h("p",{className:"whitespace-pre-wrap"}, w.notes),
      h("div",{className:"flex gap-2"},
        h("button",{onClick:onEdit,className:"btn bg-white px-3 py-1 text-xs"},"Edit"),
        h("button",{onClick:onDelete,className:"btn bg-white px-3 py-1 text-xs text-[var(--berry)]"},"Delete"))
    )
  );
};

const WishlistView = ({state, mutate}) => {
  const [editing, setEditing] = useState(null);
  const [creating, setCreating] = useState(false);
  const all = Object.entries(state.wishlist || {}).map(([id, w]) => Object.assign({id}, w));
  const onSave = (w) => {
    mutate(prev => {
      const id = w.id || newId("w");
      const wishlist = Object.assign({}, prev.wishlist);
      wishlist[id] = Object.assign({createdAt:Date.now()}, wishlist[id], w);
      delete wishlist[id].id;
      return Object.assign({}, prev, {wishlist});
    });
    setCreating(false); setEditing(null);
  };
  const onDelete = (id) => {
    if (!confirm("Delete this wishlist item?")) return;
    mutate(prev => { const wishlist = Object.assign({}, prev.wishlist); delete wishlist[id]; return Object.assign({}, prev, {wishlist}); });
  };
  const priorityRank = {high:0, medium:1, low:2};
  const sorted = all.slice().sort((a,b) => (priorityRank[a.priority]||1) - (priorityRank[b.priority]||1));
  return h("section",{className:"space-y-3"},
    creating && h(WishItemForm,{initial:blankWishItem(),onSave,onCancel:()=>setCreating(false)}),
    !creating && h("button",{onClick:()=>setCreating(true),className:"btn berry-bg px-3 py-1.5 text-sm font-semibold"},"+ Add to wishlist"),
    h("div",{className:"space-y-1.5"},
      sorted.map(w => editing===w.id
        ? h(WishItemForm,{key:w.id,initial:Object.assign({id:w.id},w),onSave,onCancel:()=>setEditing(null)})
        : h(WishItemCard,{key:w.id,w,onEdit:()=>setEditing(w.id),onDelete:()=>onDelete(w.id)}))
    ),
    all.length === 0 && !creating && h("p",{className:"text-center py-8 text-[var(--ink-soft)] italic"},"Wishlist is empty.")
  );
};

const EquipmentView = ({state, mutate}) => {
  const [tab, setTab] = useState("owned");
  return h("section",{className:"space-y-3"},
    h("div",{className:"flex gap-1.5"},
      h("button",{onClick:()=>setTab("owned"),className:"pill px-3 py-1.5 text-sm font-semibold " + (tab==="owned"?"berry-bg":"bg-white")},"Owned"),
      h("button",{onClick:()=>setTab("wishlist"),className:"pill px-3 py-1.5 text-sm font-semibold " + (tab==="wishlist"?"berry-bg":"bg-white")},"Wishlist")
    ),
    tab==="owned" ? h(OwnedEquipmentView,{state, mutate}) : h(WishlistView,{state, mutate})
  );
};
const App = () => {
  const [member, setMember] = useMemberIdentity();
  const [binId, setBinId] = useState(() => getBinIdFromURL() || getStoredBinId());
  const [showSetup, setShowSetup] = useState(!binId);
  const [showShare, setShowShare] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [showSync, setShowSync] = useState(false);
  const [tab, setTab] = useState("gigs");

  // If URL has ?bin=, save it for next visit. If URL doesn't have one but we have stored, redirect with it.
  useEffect(() => {
    const fromUrl = getBinIdFromURL();
    if (fromUrl) {
      setStoredBinId(fromUrl);
      setBinId(fromUrl);
    } else if (binId) {
      // Don't redirect - let the user see the URL when they hit Share. But still keep working with stored.
    }
  }, []);

  const onCreated = (id) => {
    setStoredBinId(id);
    setBinId(id);
    setShowSetup(false);
    setShowShare(true);
    // also push the URL into the address bar so it's bookmarkable
    try {
      const newUrl = window.location.origin + window.location.pathname + "?bin=" + id;
      window.history.replaceState({}, "", newUrl);
    } catch(_) {}
  };

  const sync = useSyncedState(binId);
  const state = sync.state;

  if (showSetup) return h(SetupScreen, {onCreated});
  if (showShare) return h(ShareScreen, {binId, onContinue: ()=>setShowShare(false)});
  if (!binId) return h(SetupScreen, {onCreated});

  if (!state) {
    return h("div",{className:"max-w-3xl mx-auto px-4 py-8 text-center"},
      h(Wordmark,{className:"h-12 mx-auto mb-4"}),
      h("p",{className:"text-[var(--ink-soft)]"}, sync.status === "error" ? "Couldn't load. " : "Loading…"),
      sync.status === "error" && h("button",{onClick:()=>setShowSync(true),className:"btn berry-bg px-4 py-2 mt-4"},"Open sync details"),
      showSync && h(SyncPanel,{sync, onClose:()=>setShowSync(false)})
    );
  }

  const locations = uniqueLocations(state.events);
  const TABS = [
    {id:"gigs", label:"Gigs"},
    {id:"rehearsals", label:"Rehearsals"},
    {id:"planner", label:"Planner"},
    {id:"songs", label:"Songs"},
    {id:"setlists", label:"Setlists"},
    {id:"kit", label:"Kit"}
  ];

  return h("div",{className:"min-h-screen pb-24"},
    h("header",{className:"max-w-5xl mx-auto px-3 sm:px-4 pt-3 sm:pt-4 pb-2"},
      h("div",{className:"flex items-start justify-between gap-2"},
        h("div",{className:"flex-1 min-w-0"},
          h(Wordmark,{className:"h-9 sm:h-12"}),
          h("div",{className:"ticker text-[var(--ink-soft)] mt-0.5 text-[10px] sm:text-xs"},"Band ops")
        ),
        h("div",{className:"flex items-center gap-2 sm:gap-3 shrink-0"},
          h(SyncBadge,{sync, onOpen:()=>setShowSync(true)}),
          h("button",{onClick:()=>setShowSettings(true),className:"btn bg-white px-2 py-1 text-xs sm:text-sm",title:"Settings"},"⚙"),
        )
      ),
      h("div",{className:"mt-3 flex flex-wrap items-center justify-between gap-2"},
        h(MemberPicker,{value:member,onChange:setMember,profiles:state.memberProfiles}),
        h("button",{onClick:()=>setShowShare(true),className:"btn bg-white px-2 py-1 text-xs"},"Share")
      )
    ),
    h("nav",{className:"max-w-5xl mx-auto px-3 sm:px-4 mt-3 tab-nav-wrap"},
      h("div",{className:"flex gap-1 overflow-x-auto pb-1"},
        TABS.map(t => h("button",{key:t.id, onClick:()=>setTab(t.id), className:"px-3 py-1.5 text-sm font-semibold whitespace-nowrap pill " + (tab===t.id?"tab-active":"bg-white")}, t.label))
      )
    ),
    h("main",{className:"max-w-5xl mx-auto px-3 sm:px-4 mt-3"},
      tab==="gigs" && h(TypedScheduleView,{type:"gig", state, member, mutate:sync.mutate, locations}),
      tab==="rehearsals" && h(TypedScheduleView,{type:"rehearsal", state, member, mutate:sync.mutate, locations}),
      tab==="planner" && h(PracticeView,{state, member, mutate:sync.mutate}),
      tab==="songs" && h(SongsView,{state, member, mutate:sync.mutate}),
      tab==="setlists" && h(SetlistsView,{state, mutate:sync.mutate}),
      tab==="kit" && h(EquipmentView,{state, mutate:sync.mutate})
    ),
    showSettings && h(SettingsModal,{
      memberProfiles: state.memberProfiles,
      onClose: ()=>setShowSettings(false),
      mutate: sync.mutate,
      binId: binId,
      state: state,
      onRestore: (newState) => sync.mutate(()=>newState)
    }),
    showShare && h("div",{className:"modal-bg",onClick:()=>setShowShare(false)},
      h("div",{className:"card p-5 max-w-lg w-full",onClick:e=>e.stopPropagation()},
        h(ShareScreen,{binId, onContinue:()=>setShowShare(false)})
      )
    ),
    showSync && h(SyncPanel,{sync, onClose:()=>setShowSync(false)})
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(h(App, null));
  </script>

</body>
</html>
