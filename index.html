<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sourberry — London Function Band</title>
  <meta name="description" content="Sourberry are a London-based function and covers band available for weddings, parties and corporate events." />
  <meta property="og:title" content="Sourberry" />
  <meta property="og:description" content="London function band for hire. Weddings, parties, corporate events." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sourberry.co.uk" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    :root {
      --bg:#f6f1e7; --bg-card:#fffaf0;
      --ink:#1a0a14; --ink-soft:#4a2a3a;
      --berry:#e93ca3; --berry-deep:#b8217a;
      --acid:#d1db58; --line:#2a1018;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Inter Tight',system-ui,sans-serif;background:var(--bg);color:var(--ink);
      background-image:radial-gradient(circle at 1px 1px,rgba(26,10,20,0.07) 1px,transparent 0);
      background-size:22px 22px}
    .display{font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto}
    .display-i{font-family:'Fraunces',Georgia,serif;font-style:italic}
    .ticker{letter-spacing:0.18em;text-transform:uppercase;font-weight:600;font-size:0.72rem}
    .card{background:var(--bg-card);border:1.5px solid var(--line);box-shadow:4px 4px 0 var(--line)}
    .btn{border:1.5px solid var(--line);box-shadow:3px 3px 0 var(--line);
      transition:transform 80ms ease,box-shadow 80ms ease;cursor:pointer;
      font-family:'Inter Tight',sans-serif;display:inline-block;text-decoration:none}
    .btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
    .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
    .pill{border:1.2px solid var(--line)}
    /* Logo: mix-blend-mode:multiply makes the white JPEG background vanish on cream */
    .logo-img{mix-blend-mode:multiply}
    /* Nav */
    .site-nav{position:sticky;top:0;z-index:40;background:var(--bg);
      border-bottom:2px solid var(--line)}
    /* Acid hero bar */
    .acid-bar{background:var(--acid);border-bottom:2px solid var(--line)}
    /* Song rows */
    .song-row{border-bottom:1px solid rgba(42,16,24,0.12)}
    .song-row:last-child{border-bottom:none}
    /* Animations */
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .fu{animation:fadeUp 0.55s ease both}
    .fu-1{animation-delay:0.06s}.fu-2{animation-delay:0.14s}.fu-3{animation-delay:0.22s}
    @media(max-width:640px){body{background-size:18px 18px}.card{box-shadow:3px 3px 0 var(--line)}}
  </style>
</head>
<body>
<div id="root"></div>
<script>
const _R=React,h=_R.createElement,{useState,useEffect,useMemo}=_R;

const SUPABASE_URL="https://xyukmguafhddpasmjjyy.supabase.co";
const SUPABASE_KEY="sb_publishable_wDjYrqirJiulohJC8I26UQ_ZxwMoJcw";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const NAV_LINKS=[
  {label:"Songs",href:"songs.html"},
  {label:"Gigs",href:"gigs.html"},
];

/* ── Shared Nav ── */
const Nav=({active=""})=>
  h("nav",{className:"site-nav"},
    h("div",{className:"max-w-4xl mx-auto px-4 sm:px-6 flex items-center justify-between h-14 gap-4"},
      h("a",{href:"index.html","aria-label":"Sourberry home"},
        h("img",{src:"images/logo.png",alt:"Sourberry",className:"logo-img h-8 sm:h-9 w-auto"})
      ),
      h("div",{className:"flex items-center gap-1 sm:gap-2"},
        NAV_LINKS.map(({label,href})=>
          h("a",{key:label,href,
            className:"ticker text-[10px] sm:text-xs px-2.5 py-1.5 pill hover:bg-[var(--acid)] "+(active===label?"bg-[var(--acid)]":"")},
            label)
        ),
        h("a",{href:"book.html",
          className:"ticker text-[10px] sm:text-xs px-2.5 py-1.5 btn text-white font-semibold",
          style:{background:"var(--berry)"}},
          "Book us")
      )
    )
  );

/* ── Shared Footer ── */
const Footer=({email=""})=>
  h("footer",{className:"border-t-2 border-[var(--line)] py-8 px-4 sm:px-6 mt-8"},
    h("div",{className:"max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-3 text-sm text-[var(--ink-soft)]"},
      h("img",{src:"images/logo.png",alt:"Sourberry",className:"logo-img h-7 w-auto"}),
      email&&h("a",{href:"mailto:"+email,className:"hover:text-[var(--berry)]"},email),
      h("span",null,"© "+new Date().getFullYear()),
      h("a",{href:"/crap/",
        className:"ticker text-[9px] text-[var(--ink-soft)]/40 hover:text-[var(--ink-soft)] transition-colors",
        title:"Collaborative Rehearsal & Administration Platform"},
        "C.R.A.P.")
    )
  );

/* ── Home ── */
const App=()=>{
  const [settings,setSettings]=useState(null);
  const [gigs,setGigs]=useState([]);
  const [songs,setSongs]=useState([]);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    Promise.all([
      sb.from("public_settings").select("*").single(),
      sb.from("public_gigs").select("*"),
      sb.from("public_repertoire").select("*")
    ]).then(([s,g,r])=>{
      if(s.data)setSettings(s.data);
      if(g.data)setGigs(g.data);
      if(r.data)setSongs(r.data);
      setLoading(false);
    });
  },[]);

  const today=new Date().toISOString().slice(0,10);
  const nextGig=useMemo(()=>
    gigs.filter(g=>g.status==="confirmed"&&g.event_date>=today)
        .sort((a,b)=>a.event_date.localeCompare(b.event_date))[0],
    [gigs,today]
  );

  const tagline=(settings&&settings.tagline)||"London's function band for hire.";
  const region=(settings&&settings.region)||"";
  const email=(settings&&settings.booking_email)||"";

  const previewSongs=useMemo(()=>songs.slice(0,6),[songs]);

  const formatDate=iso=>{
    if(!iso)return"";
    return new Date(iso+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"long",year:"numeric"});
  };

  return h("div",null,
    h(Nav,{active:""}),

    /* ── Hero ── */
    h("section",{className:"py-14 sm:py-24 px-4 sm:px-6 border-b-2 border-[var(--line)]"},
      h("div",{className:"max-w-4xl mx-auto"},
        h("div",{className:"fu mb-6 sm:mb-8"},
          h("img",{src:"images/logo.png",alt:"Sourberry",
            className:"logo-img w-full max-w-xs sm:max-w-sm md:max-w-md"})
        ),
        h("p",{className:"display-i text-2xl sm:text-3xl text-[var(--ink-soft)] mb-2 fu fu-1"},tagline),
        region&&h("p",{className:"ticker text-[var(--ink-soft)] mb-8 fu fu-1"},region),
        h("div",{className:"flex flex-wrap gap-3 fu fu-2"},
          h("a",{href:"book.html",
            className:"btn text-white font-semibold px-6 py-3 text-base",
            style:{background:"var(--berry)"}},
            "Book us"),
          h("a",{href:"songs.html",
            className:"btn bg-white font-semibold px-6 py-3 text-base"},
            "What we play →")
        )
      )
    ),

    /* ── Next gig strip ── */
    !loading&&nextGig&&h("div",{className:"acid-bar py-4 px-4 sm:px-6"},
      h("div",{className:"max-w-4xl mx-auto flex items-center justify-between flex-wrap gap-3"},
        h("div",null,
          h("div",{className:"ticker text-[10px] text-[var(--ink)]/60 mb-0.5"},"Next gig"),
          h("div",{className:"font-semibold"},
            nextGig.title||nextGig.location||"Private event",
            nextGig.location&&nextGig.title&&h("span",{className:"text-[var(--ink)]/60 font-normal"},
              " · "+nextGig.location)
          ),
          h("div",{className:"ticker text-[10px] text-[var(--ink)]/70 mt-0.5"},
            formatDate(nextGig.event_date),
            nextGig.start_time&&" · "+nextGig.start_time.slice(0,5))
        ),
        h("a",{href:"gigs.html",
          className:"btn bg-white text-sm font-semibold px-4 py-2 shrink-0"},
          "All gigs →")
      )
    ),

    /* ── Intro ── */
    h("section",{className:"py-14 sm:py-20 px-4 sm:px-6 border-b-2 border-[var(--line)]"},
      h("div",{className:"max-w-4xl mx-auto grid sm:grid-cols-2 gap-8 sm:gap-16 items-start"},
        h("div",null,
          h("h2",{className:"display text-3xl sm:text-4xl font-bold mb-4"},"A covers band that keeps the floor moving."),
          h("p",{className:"text-[var(--ink-soft)] leading-relaxed mb-4"},
            "Sourberry are a four-piece function band available for weddings, birthday parties, "+
            "corporate events and anything in between. We play a constantly updated set of "+
            "contemporary and classic covers, chosen to keep every crowd on their feet."
          ),
          h("p",{className:"text-[var(--ink-soft)] leading-relaxed"},
            "We bring everything — PA, instruments, lighting — and can provide a DJ playlist "+
            "between live sets. Book directly through us and skip the agency fees."
          )
        ),
        h("div",{className:"space-y-3"},
          [
            ["✓","All equipment provided","PA, instruments, lighting — we bring it all"],
            ["✓","Custom songs","We'll learn 3–5 specific tracks for your event"],
            ["✓","DJ sets available","Between live sets, through our own PA"],
            ["✓","Venues up to 200","Larger venues by arrangement"],
          ].map(([icon,title,desc])=>
            h("div",{key:title,className:"card p-4"},
              h("div",{className:"font-semibold mb-0.5"},icon+" "+title),
              h("div",{className:"text-sm text-[var(--ink-soft)]"},desc)
            )
          )
        )
      )
    ),

    /* ── Song teaser ── */
    h("section",{className:"py-14 sm:py-20 px-4 sm:px-6 border-b-2 border-[var(--line)]"},
      h("div",{className:"max-w-4xl mx-auto"},
        h("div",{className:"flex items-baseline justify-between mb-6 flex-wrap gap-2"},
          h("h2",{className:"display text-3xl sm:text-4xl font-bold"},"From our set"),
          h("a",{href:"songs.html",className:"ticker text-[10px] text-[var(--berry)] hover:underline"},
            "Full list →")
        ),
        loading
          ?h("p",{className:"text-[var(--ink-soft)] italic"},"Loading…")
          :h("div",{className:"card"},
              h("div",{className:"grid sm:grid-cols-2"},
                previewSongs.map(s=>
                  h("div",{key:s.id,className:"song-row flex items-baseline gap-3 px-4 py-3"},
                    h("span",{className:"font-semibold flex-1 truncate"},s.title),
                    h("span",{className:"text-sm text-[var(--ink-soft)] shrink-0 truncate max-w-[40%]"},s.artist)
                  )
                )
              ),
              songs.length>6&&h("a",{href:"songs.html",
                className:"block text-center ticker text-[10px] py-3 border-t border-[var(--line)]/20 hover:bg-[var(--acid)] text-[var(--berry)]"},
                "See all "+songs.length+" songs →")
          )
      )
    ),

    /* ── Book CTA ── */
    h("section",{className:"py-14 sm:py-20 px-4 sm:px-6"},
      h("div",{className:"max-w-4xl mx-auto text-center"},
        h("h2",{className:"display text-3xl sm:text-4xl font-bold mb-3"},"Ready to book?"),
        h("p",{className:"text-[var(--ink-soft)] mb-6 max-w-lg mx-auto"},
          "Tell us about your event and we'll get back to you within a few days."),
        h("a",{href:"book.html",
          className:"btn text-white font-semibold px-8 py-4 text-lg",
          style:{background:"var(--berry)"}},
          "Get in touch →")
      )
    ),

    h(Footer,{email})
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
</script>
</body>
</html>
