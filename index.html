<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sourberry — diagnostic</title>
  <style>
    body { font-family: sans-serif; padding: 40px; background: #f6f1e7; color: #1a0a14; }
    .ok { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
    pre { background: #fff; padding: 12px; border: 1px solid #ccc; font-size: 12px; overflow-wrap: break-word; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Sourberry diagnostic</h1>
  <p id="cdn-sb">Supabase CDN: <span>checking...</span></p>
  <p id="cdn-react">React CDN: <span>checking...</span></p>
  <p id="cdn-reactdom">ReactDOM CDN: <span>checking...</span></p>
  <hr/>
  <p id="sb-test">Supabase public_settings query: <span>checking...</span></p>
  <pre id="sb-result">waiting...</pre>
  <p id="sb-rep">public_repertoire query: <span>checking...</span></p>
  <pre id="rep-result">waiting...</pre>

  <script crossorigin src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script>
    function set(id, ok, msg) {
      var el = document.querySelector('#' + id + ' span');
      el.textContent = msg;
      el.style.color = ok ? 'green' : 'red';
      el.style.fontWeight = 'bold';
    }
    window.addEventListener('load', function() {
      set('cdn-sb',       !!window.supabase,  window.supabase  ? 'OK' : 'FAILED');
      set('cdn-react',    !!window.React,     window.React     ? 'OK' : 'FAILED');
      set('cdn-reactdom', !!window.ReactDOM,  window.ReactDOM  ? 'OK' : 'FAILED');
      if (!window.supabase) { set('sb-test', false, 'skipped'); return; }
      var sb = window.supabase.createClient(
        "https://xyukmguafhddpasmjjyy.supabase.co",
        "sb_publishable_wDjYrqirJiulohJC8I26UQ_ZxwMoJcw"
      );
      sb.from("public_settings").select("*").single().then(function(r) {
        if (r.error) {
          set('sb-test', false, 'ERROR: ' + r.error.message);
          document.getElementById('sb-result').textContent = JSON.stringify(r.error, null, 2);
        } else {
          set('sb-test', true, 'OK');
          document.getElementById('sb-result').textContent = JSON.stringify(r.data, null, 2);
        }
      }).catch(function(e) { set('sb-test', false, 'EXCEPTION: ' + e.message); });
      sb.from("public_repertoire").select("*").then(function(r) {
        if (r.error) {
          set('sb-rep', false, 'ERROR: ' + r.error.message);
          document.getElementById('rep-result').textContent = JSON.stringify(r.error, null, 2);
        } else {
          set('sb-rep', true, 'OK — ' + r.data.length + ' songs');
          document.getElementById('rep-result').textContent = JSON.stringify(r.data.slice(0,2), null, 2);
        }
      }).catch(function(e) { set('sb-rep', false, 'EXCEPTION: ' + e.message); });
    });
  </script>

</body>
</html>
