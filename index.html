<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sourberry test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
  var h = React.createElement;
  var App = function() {
    return h("div", {className:"p-10 font-sans"},
      h("h1", {className:"text-2xl font-bold"}, "Tailwind test"),
      h("p", {className:"text-gray-600 mt-2"}, "If this is styled, Tailwind is working.")
    );
  };
  ReactDOM.createRoot(document.getElementById("root")).render(h(App, null));
</script>
</body>
</html>
