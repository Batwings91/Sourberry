<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sourberry</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,500&family=Inter+Tight:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg: #f6f1e7; --bg-card: #fffaf0; --ink: #1a0a14; --ink-soft: #4a2a3a;
      --berry: #b81f5c; --berry-deep: #7a0a35; --acid: #d6f04a; --line: #2a1018;
    }
    html, body { background: var(--bg); color: var(--ink); }
    body {
      font-family: 'Inter Tight', system-ui, sans-serif;
      background-image: radial-gradient(circle at 1px 1px, rgba(26,10,20,0.08) 1px, transparent 0);
      background-size: 22px 22px;
    }
    .display { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
    .display-italic { font-family: 'Fraunces', Georgia, serif; font-style: italic; }
    .wordmark {
      font-family: 'Fraunces', Georgia, serif; font-weight: 800;
      letter-spacing: -0.04em; font-variation-settings: "opsz" 144;
    }
    .ticker { letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; font-size: 0.72rem; }
    .card { background: var(--bg-card); border: 1.5px solid var(--line); box-shadow: 4px 4px 0 var(--line); }
    .btn {
      border: 1.5px solid var(--line); box-shadow: 3px 3px 0 var(--line);
      transition: transform 80ms ease, box-shadow 80ms ease;
    }
    .btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--line); }
    .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--line); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .pill { border: 1.2px solid var(--line); }
    .input {
      background: #fffdf6; border: 1.5px solid var(--line);
      padding: 0.5rem 0.75rem; font-family: 'Inter Tight', sans-serif; width: 100%;
    }
    .input:focus { outline: none; box-shadow: 3px 3px 0 var(--berry); }
    .tab-active { background: var(--ink); color: var(--bg); }
    .berry-bg { background: var(--berry); color: #fff; }
    .acid-bg { background: var(--acid); color: var(--ink); }
    details > summary { cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    @media (max-width: 640px) { .card { box-shadow: 3px 3px 0 var(--line); } }
    .spin { animation: sp 1s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>

</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
  const { useState, useEffect, useRef, useCallback } = React;

  // ---- Band line-up
  const MEMBERS = [
    { id: "veena", name: "Veena", color: "#b81f5c" },
    { id: "james", name: "James", color: "#1f6fb8" },
    { id: "mike",  name: "Mike",  color: "#1f8f4a" },
    { id: "omar",  name: "Omar",  color: "#d97a1f" },
  ];

  // ---- Seed data from the spreadsheet
  const SEED_EVENTS = [
    { date: "2025-10-09", startTime: "18:00", endTime: "21:00", type: "rehearsal", location: "Earlsfield",  bookingOwner: "",      bookedAndPaid: false, status: "confirmed", title: "", comments: "Could do remote instead from 7pm? JRO could do remote but not live." },
    { date: "2025-10-21", startTime: "18:00", endTime: "21:00", type: "rehearsal", location: "Earlsfield",  bookingOwner: "mike",  bookedAndPaid: true,  status: "confirmed", title: "", comments: "Booked 6-10pm." },
    { date: "2025-11-04", startTime: "18:00", endTime: "21:00", type: "rehearsal", location: "Earlsfield",  bookingOwner: "veena", bookedAndPaid: true,  status: "confirmed", title: "", comments: "Booked." },
    { date: "2025-11-05", startTime: "21:00", endTime: "23:00", type: "rehearsal", location: "Remote",      bookingOwner: "",      bookedAndPaid: false, status: "proposed",  title: "Backup remote practice", comments: "Backup remote practice if needed." },
    { date: "2025-11-07", startTime: "18:00", endTime: "21:00", type: "gig",       location: "Jolly Gardeners, Earlsfield", bookingOwner: "veena", bookedAndPaid: true, status: "confirmed", title: "50th Birthday Gig", comments: "90 min rehearsal 6-7:30pm, then 50th Birthday gig at the Jolly Gardeners." },
    { date: "2025-11-08", startTime: "15:00", endTime: "18:00", type: "rehearsal", location: "Earlsfield",  bookingOwner: "",      bookedAndPaid: false, status: "proposed",  title: "", comments: "4-7pm or 3-6pm please. Out that evening." },
    { date: "2025-11-13", startTime: "18:00", endTime: "21:00", type: "rehearsal", location: "",            bookingOwner: "",      bookedAndPaid: false, status: "proposed",  title: "", comments: "JRO: have a work thing in diary but can slip out if we need this slot. MG: I can no longer make this date (in Berlin)." },
    { date: "2025-11-14", startTime: "18:00", endTime: "21:00", type: "rehearsal", location: "",            bookingOwner: "",      bookedAndPaid: false, status: "proposed",  title: "", comments: "" },
    { date: "2025-11-15", startTime: "15:00", endTime: "21:00", type: "rehearsal", location: "Earlsfield",  bookingOwner: "",      bookedAndPaid: false, status: "proposed",  title: "Long sesh", comments: "Can do the full long sesh if needed (V)." },
    { date: "2025-11-20", startTime: "18:00", endTime: "21:00", type: "rehearsal", location: "Earlsfield",  bookingOwner: "",      bookedAndPaid: false, status: "proposed",  title: "Dress rehearsal", comments: "Night before dress rehearsal. In the office so will arrive after 6." },
    { date: "2025-11-21", startTime: "21:00", endTime: "22:30", type: "gig",       location: "",            bookingOwner: "",      bookedAndPaid: false, status: "confirmed", title: "PTA Gig", comments: "" },
  ];

  const buildSeedState = () => {
    const events = {};
    SEED_EVENTS.forEach((ev, i) => {
      const id = `seed_${i}_${Math.random().toString(36).slice(2,7)}`;
      events[id] = { ...ev, availability: {}, createdAt: Date.now() + i };
    });
    return { schemaVersion: 1, events };
  };

  // ---- JSONBin helpers
  const JB_BASE = "https://api.jsonbin.io/v3/b";

  const jbCreateBin = async (apiKey, initialData) => {
    const res = await fetch(JB_BASE, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": apiKey,
        "X-Bin-Private": "false",
        "X-Bin-Name": "sourberry-band-ops",
      },
      body: JSON.stringify(initialData),
    });
    if (!res.ok) {
      const t = await res.text();
      throw new Error(`Couldn't create database (HTTP ${res.status}): ${t}`);
    }
    const json = await res.json();
    return json.metadata?.id;
  };

  const jbReadBin = async (binId) => {
    const res = await fetch(`${JB_BASE}/${binId}/latest`, {
      headers: { "X-Bin-Meta": "false" },
    });
    if (!res.ok) {
      const t = await res.text();
      throw new Error(`Couldn't read database (HTTP ${res.status}): ${t}`);
    }
    return await res.json();
  };

  const jbUpdateBin = async (binId, data) => {
    const res = await fetch(`${JB_BASE}/${binId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
    if (!res.ok) {
      const t = await res.text();
      throw new Error(`Couldn't save (HTTP ${res.status}): ${t}`);
    }
    return await res.json();
  };

  // ---- Helpers
  const fmtDate = (iso) => {
    if (!iso) return "";
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  };
  const todayISO = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  };
  const isPast = (iso) => iso < todayISO();
  const sortByDateAsc = (a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime);

  const eventsList = (events) =>
    Object.entries(events || {}).map(([id, ev]) => ({ id, ...ev })).sort(sortByDateAsc);

  const newId = () => `e_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`;

  // ---- Identity (per device)
  const useMemberIdentity = () => {
    const [memberId, setMemberIdState] = useState(() => localStorage.getItem("sourberry.memberId") || null);
    const setMemberId = (id) => {
      setMemberIdState(id);
      if (id) localStorage.setItem("sourberry.memberId", id);
    };
    return [MEMBERS.find(m => m.id === memberId) || null, setMemberId];
  };

  // ---- Bin ID resolution: URL param wins, else localStorage
  const getBinIdFromURL = () => {
    const params = new URLSearchParams(window.location.search);
    return params.get("bin");
  };
  const getStoredBinId = () => localStorage.getItem("sourberry.binId");
  const setStoredBinId = (id) => {
    if (id) localStorage.setItem("sourberry.binId", id);
    else localStorage.removeItem("sourberry.binId");
  };

  // ---- Sync state hook
  // - Loads from JSONBin on mount, polls every POLL_MS
  // - Pauses polling while window is hidden
  // - Writes are queued and debounced; the latest state always wins
  const POLL_MS = 8000;

  const useSyncedState = (binId) => {
    const [state, setState] = useState(null);  // { schemaVersion, events }
    const [status, setStatus] = useState("loading"); // loading | ok | error | saving
    const [errorMsg, setErrorMsg] = useState("");
    const [lastSyncedAt, setLastSyncedAt] = useState(null);

    const stateRef = useRef(state);
    stateRef.current = state;
    const writeTimerRef = useRef(null);
    const writeInFlightRef = useRef(false);
    const pendingWriteRef = useRef(false);

    // Actually push to JSONBin
    const flushWrite = useCallback(async () => {
      if (!binId || writeInFlightRef.current) return;
      writeInFlightRef.current = true;
      pendingWriteRef.current = false;
      setStatus("saving");
      try {
        await jbUpdateBin(binId, stateRef.current);
        setStatus("ok");
        setErrorMsg("");
        setLastSyncedAt(Date.now());
      } catch (e) {
        setStatus("error");
        setErrorMsg(e.message);
      } finally {
        writeInFlightRef.current = false;
        if (pendingWriteRef.current) {
          // Another write came in while we were saving — flush it
          setTimeout(flushWrite, 100);
        }
      }
    }, [binId]);

    // Schedule a write (debounced)
    const scheduleWrite = useCallback(() => {
      if (writeTimerRef.current) clearTimeout(writeTimerRef.current);
      if (writeInFlightRef.current) {
        pendingWriteRef.current = true;
        return;
      }
      writeTimerRef.current = setTimeout(flushWrite, 600);
    }, [flushWrite]);

    // Public mutator: pass a function (prev) => next
    const mutate = useCallback((updater) => {
      setState(prev => {
        const next = updater(prev || { schemaVersion: 1, events: {} });
        stateRef.current = next;
        return next;
      });
      scheduleWrite();
    }, [scheduleWrite]);

    // Initial load + polling
    useEffect(() => {
      if (!binId) return;
      let cancelled = false;
      let pollTimer = null;

      const fetchOnce = async () => {
        if (writeInFlightRef.current) return; // don't clobber while saving
        try {
          const data = await jbReadBin(binId);
          if (cancelled) return;
          // Don't overwrite if we have an unsaved local mutation queued
          if (pendingWriteRef.current || writeTimerRef.current) return;
          setState(data);
          stateRef.current = data;
          setStatus("ok");
          setErrorMsg("");
          setLastSyncedAt(Date.now());
        } catch (e) {
          if (cancelled) return;
          setStatus("error");
          setErrorMsg(e.message);
        }
      };

      fetchOnce();
      const tick = () => {
        if (document.visibilityState === "visible") fetchOnce();
        pollTimer = setTimeout(tick, POLL_MS);
      };
      pollTimer = setTimeout(tick, POLL_MS);

      const onVisibility = () => {
        if (document.visibilityState === "visible") fetchOnce();
      };
      document.addEventListener("visibilitychange", onVisibility);

      return () => {
        cancelled = true;
        if (pollTimer) clearTimeout(pollTimer);
        document.removeEventListener("visibilitychange", onVisibility);
      };
    }, [binId]);

    return { state, status, errorMsg, lastSyncedAt, mutate };
  };

  // =========================================================================
  // SETUP SCREEN
  // =========================================================================
  const SetupScreen = ({ onCreated }) => {
    const [apiKey, setApiKey] = useState("");
    const [working, setWorking] = useState(false);
    const [err, setErr] = useState("");

    const create = async () => {
      const key = apiKey.trim();
      if (!key) { setErr("Paste your JSONBin API key first."); return; }
      setWorking(true);
      setErr("");
      try {
        const seed = buildSeedState();
        const id = await jbCreateBin(key, seed);
        if (!id) throw new Error("JSONBin didn't return a bin ID. Check your key has 'Create' permission.");
        onCreated(id);
      } catch (e) {
        setErr(e.message);
      } finally {
        setWorking(false);
      }
    };

    return (
      <div className="max-w-2xl mx-auto px-4 py-8">
        <header className="mb-6">
          <div className="ticker text-[var(--berry)]">First-time setup</div>
          <h1 className="wordmark text-5xl sm:text-6xl leading-none mt-1">
            Sour<span className="display-italic font-medium" style={{color:"var(--berry)"}}>berry</span>
          </h1>
        </header>

        <div className="card p-5">
          <h2 className="display text-2xl mb-2">Connect your database</h2>
          <p className="text-sm text-[var(--ink-soft)] mb-4">
            One-time setup, takes about 30 seconds. After this you'll get a URL to share with the band.
          </p>

          <ol className="text-sm space-y-2 mb-5 pl-5 list-decimal">
            <li>Open <a className="text-[var(--berry)] underline" href="https://jsonbin.io/api-keys" target="_blank" rel="noopener">jsonbin.io/api-keys</a> in another tab.</li>
            <li>Copy your <strong>Master Key</strong> (the long string starting with <code className="bg-black/5 px-1 rounded">$2a$</code> or similar).</li>
            <li>Paste it below and tap <strong>Create database</strong>.</li>
          </ol>

          <label className="block text-sm">
            <div className="ticker mb-1">JSONBin Master Key</div>
            <input
              className="input font-mono text-xs"
              type="password"
              value={apiKey}
              onChange={e => setApiKey(e.target.value)}
              placeholder="$2a$10$..."
              autoComplete="off"
              autoCapitalize="off"
              autoCorrect="off"
              spellCheck="false"
            />
          </label>

          {err && (
            <div className="mt-3 p-3 border border-[var(--berry)] bg-[var(--berry)]/10 text-sm">
              <strong>Couldn't set up:</strong> {err}
            </div>
          )}

          <div className="mt-4 flex items-center gap-3 flex-wrap">
            <button onClick={create} disabled={working} className="btn berry-bg px-5 py-2.5 font-semibold">
              {working ? "Creating…" : "Create database"}
            </button>
            <span className="text-xs text-[var(--ink-soft)]">
              Your key stays on this device. The band don't need it.
            </span>
          </div>
        </div>

        <details className="mt-4 card p-4 text-sm">
          <summary className="ticker text-[var(--ink-soft)] hover:text-[var(--berry)]">How does this work? ▾</summary>
          <div className="mt-2 space-y-2 text-[var(--ink-soft)]">
            <p>Your API key is used <em>once</em> to create a public bin in your JSONBin account. After that, the bin lives at a URL like <code className="text-xs bg-black/5 px-1">?bin=XXXX</code>. Anyone with that URL can read and write — no key needed.</p>
            <p>This means anyone with the URL can edit. For 4 friends and an obscure URL it's fine. Don't post the URL publicly.</p>
            <p>Your key is stored only on this device (localStorage), and only used as a backup if you ever need to reset.</p>
          </div>
        </details>
      </div>
    );
  };

  // =========================================================================
  // SHARE SCREEN — shown right after setup
  // =========================================================================
  const ShareScreen = ({ binId, onContinue }) => {
    const [copied, setCopied] = useState(false);
    const url = `${window.location.origin}${window.location.pathname}?bin=${binId}`;
    const copy = async () => {
      try {
        await navigator.clipboard.writeText(url);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      } catch (e) {
        // Fallback: select the text
        const ta = document.getElementById("share-url");
        if (ta) { ta.select(); document.execCommand("copy"); setCopied(true); setTimeout(() => setCopied(false), 2000); }
      }
    };
    return (
      <div className="max-w-2xl mx-auto px-4 py-8">
        <header className="mb-6">
          <div className="ticker text-[var(--berry)]">Done!</div>
          <h1 className="wordmark text-5xl sm:text-6xl leading-none mt-1">
            Sour<span className="display-italic font-medium" style={{color:"var(--berry)"}}>berry</span>
          </h1>
        </header>

        <div className="card p-5">
          <h2 className="display text-2xl mb-2">Share this URL with the band</h2>
          <p className="text-sm text-[var(--ink-soft)] mb-4">
            Send this link to Veena, James, Mike and Omar. Each person opens it once on each device they want to use.
          </p>

          <div className="flex gap-2 items-stretch">
            <input id="share-url" className="input font-mono text-xs flex-1" readOnly value={url} />
            <button onClick={copy} className="btn berry-bg px-4 font-semibold whitespace-nowrap">
              {copied ? "Copied ✓" : "Copy"}
            </button>
          </div>

          <div className="mt-5 p-3 bg-[var(--acid)]/30 border border-[var(--line)] text-sm">
            <strong>Tip:</strong> bookmark this URL on your iPad's home screen so you don't lose it. Open the link once, then in Safari tap the share icon → "Add to Home Screen".
          </div>

          <button onClick={onContinue} className="btn bg-white px-5 py-2.5 mt-5 font-semibold">
            Open the app →
          </button>
        </div>
      </div>
    );
  };

  // =========================================================================
  // MAIN APP UI
  // =========================================================================

  const TypeBadge = ({ type, status }) => {
    const isGig = type === "gig";
    const cancelled = status === "cancelled";
    return (
      <span className={"ticker px-2 py-0.5 " + (cancelled ? "bg-gray-200 text-gray-500" : isGig ? "berry-bg" : "acid-bg")}>
        {cancelled ? "Cancelled" : isGig ? "Gig" : "Rehearsal"}
      </span>
    );
  };

  const StatusDot = ({ status }) => {
    const map = { yes: "#1f8f4a", no: "#c12c2c", maybe: "#d97a1f" };
    if (!map[status]) return <span className="inline-block w-3 h-3 rounded-full border border-[var(--line)] bg-white" />;
    return <span className="inline-block w-3 h-3 rounded-full border border-[var(--line)]" style={{ background: map[status] }} />;
  };

  const AvailabilityRow = ({ ev }) => (
    <div className="flex items-center gap-3 text-xs">
      {MEMBERS.map(m => (
        <div key={m.id} className="flex items-center gap-1">
          <StatusDot status={ev.availability?.[m.id]} />
          <span className="font-medium">{m.name[0]}</span>
        </div>
      ))}
    </div>
  );

  const AvailabilityButtons = ({ ev, member, onSet }) => {
    if (!member) return <p className="text-xs text-[var(--ink-soft)] italic">Pick who you are above to mark availability.</p>;
    const cur = ev.availability?.[member.id];
    const opt = (val, label, bg) => (
      <button
        key={val}
        onClick={() => onSet(ev.id, member.id, cur === val ? null : val)}
        className={"pill px-3 py-1.5 text-xs font-semibold transition-colors " + (cur === val ? "text-white" : "bg-white hover:bg-[var(--acid)]")}
        style={cur === val ? { background: bg } : {}}
      >
        {label}
      </button>
    );
    return (
      <div className="flex gap-1.5">
        {opt("yes",   "✓ Yes",   "#1f8f4a")}
        {opt("maybe", "? Maybe", "#d97a1f")}
        {opt("no",    "✗ No",    "#c12c2c")}
      </div>
    );
  };

  const blankEvent = () => ({
    date: todayISO(), startTime: "18:00", endTime: "21:00",
    type: "rehearsal", location: "", bookingOwner: "", bookedAndPaid: false,
    status: "proposed", title: "", comments: "",
  });

  const EventForm = ({ initial, onSave, onCancel, onDelete }) => {
    const [f, setF] = useState(initial || blankEvent());
    const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
    return (
      <div className="card p-5 mb-4">
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <label className="text-sm">
            <div className="ticker mb-1">Type</div>
            <select className="input" value={f.type} onChange={e => set("type", e.target.value)}>
              <option value="rehearsal">Rehearsal</option>
              <option value="gig">Gig</option>
            </select>
          </label>
          <label className="text-sm">
            <div className="ticker mb-1">Status</div>
            <select className="input" value={f.status} onChange={e => set("status", e.target.value)}>
              <option value="proposed">Proposed</option>
              <option value="confirmed">Confirmed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </label>
          <label className="text-sm md:col-span-2">
            <div className="ticker mb-1">Title (optional)</div>
            <input className="input" value={f.title} onChange={e => set("title", e.target.value)} placeholder="e.g. PTA Gig, Dress rehearsal" />
          </label>
          <label className="text-sm">
            <div className="ticker mb-1">Date</div>
            <input className="input" type="date" value={f.date} onChange={e => set("date", e.target.value)} />
          </label>
          <label className="text-sm">
            <div className="ticker mb-1">Location</div>
            <input className="input" value={f.location} onChange={e => set("location", e.target.value)} placeholder="e.g. Earlsfield" />
          </label>
          <label className="text-sm">
            <div className="ticker mb-1">Start time</div>
            <input className="input" type="time" value={f.startTime} onChange={e => set("startTime", e.target.value)} />
          </label>
          <label className="text-sm">
            <div className="ticker mb-1">End time</div>
            <input className="input" type="time" value={f.endTime} onChange={e => set("endTime", e.target.value)} />
          </label>
          <label className="text-sm">
            <div className="ticker mb-1">Booking owner</div>
            <select className="input" value={f.bookingOwner} onChange={e => set("bookingOwner", e.target.value)}>
              <option value="">— none —</option>
              {MEMBERS.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
            </select>
          </label>
          <label className="text-sm flex items-center gap-2 md:mt-6">
            <input type="checkbox" checked={!!f.bookedAndPaid} onChange={e => set("bookedAndPaid", e.target.checked)} className="w-4 h-4" />
            <span>Booked & paid</span>
          </label>
          <label className="text-sm md:col-span-2">
            <div className="ticker mb-1">Comments</div>
            <textarea className="input" rows="2" value={f.comments} onChange={e => set("comments", e.target.value)} />
          </label>
        </div>
        <div className="flex flex-wrap gap-2 mt-4">
          <button onClick={() => onSave(f)} className="btn berry-bg px-4 py-2 font-semibold">Save</button>
          <button onClick={onCancel} className="btn bg-white px-4 py-2">Cancel</button>
          {onDelete && (
            <button onClick={() => { if (confirm("Delete this event?")) onDelete(); }} className="btn bg-white px-4 py-2 ml-auto text-[var(--berry)]">Delete</button>
          )}
        </div>
      </div>
    );
  };

  const EventCard = ({ ev, member, onEdit, onSetAvailability }) => {
    const owner = MEMBERS.find(m => m.id === ev.bookingOwner);
    const yesCount = MEMBERS.filter(m => ev.availability?.[m.id] === "yes").length;
    return (
      <div className="card p-4 sm:p-5">
        <div className="flex items-start gap-4">
          <div className="shrink-0 text-center min-w-[68px]">
            <div className="ticker text-[var(--berry)]">{fmtDate(ev.date).split(",")[0]}</div>
            <div className="display text-3xl leading-none mt-1">{new Date(ev.date+"T00:00:00").getDate()}</div>
            <div className="ticker mt-1">{new Date(ev.date+"T00:00:00").toLocaleDateString(undefined, { month: "short" })}</div>
          </div>
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2 flex-wrap">
              <TypeBadge type={ev.type} status={ev.status} />
              {ev.status === "proposed" && <span className="ticker bg-yellow-100 px-2 py-0.5">Proposed</span>}
              {ev.bookedAndPaid && <span className="ticker bg-green-100 px-2 py-0.5">Booked & paid</span>}
            </div>
            {ev.title && <div className="display text-xl mt-1.5 leading-tight">{ev.title}</div>}
            <div className="text-sm mt-1 text-[var(--ink-soft)]">
              {ev.startTime}–{ev.endTime}{ev.location ? ` · ${ev.location}` : ""}
              {owner ? ` · booking: ${owner.name}` : ""}
            </div>
            {ev.comments && (
              <details className="mt-2 text-sm">
                <summary className="ticker text-[var(--ink-soft)] hover:text-[var(--berry)]">Notes ▾</summary>
                <p className="mt-1.5 italic text-[var(--ink-soft)]">{ev.comments}</p>
              </details>
            )}
            <div className="mt-3 flex flex-wrap items-center gap-x-4 gap-y-2">
              <AvailabilityRow ev={ev} />
              <span className="text-xs text-[var(--ink-soft)]">{yesCount}/{MEMBERS.length} can make it</span>
            </div>
            <div className="mt-3 flex flex-wrap items-center gap-2">
              <AvailabilityButtons ev={ev} member={member} onSet={onSetAvailability} />
              <button onClick={onEdit} className="ticker ml-auto text-[var(--ink-soft)] hover:text-[var(--berry)]">Edit ▸</button>
            </div>
          </div>
        </div>
      </div>
    );
  };

  const ScheduleView = ({ events, member, mutate }) => {
    const [editingId, setEditingId] = useState(null);
    const [adding, setAdding] = useState(false);
    const [showPast, setShowPast] = useState(false);

    const all = eventsList(events);
    const upcoming = all.filter(e => !isPast(e.date));
    const past = all.filter(e => isPast(e.date)).reverse();
    const list = showPast ? past : upcoming;

    const setAvailability = (eventId, memberId, value) => {
      mutate(prev => {
        const events = { ...(prev.events || {}) };
        const ev = { ...(events[eventId] || {}) };
        const av = { ...(ev.availability || {}) };
        if (value === null) delete av[memberId];
        else av[memberId] = value;
        ev.availability = av;
        events[eventId] = ev;
        return { ...prev, events };
      });
    };
    const updateEvent = (eventId, data) => {
      mutate(prev => {
        const events = { ...(prev.events || {}) };
        events[eventId] = { ...events[eventId], ...data };
        return { ...prev, events };
      });
    };
    const createEvent = (data) => {
      mutate(prev => {
        const events = { ...(prev.events || {}) };
        events[newId()] = { ...data, availability: {}, createdAt: Date.now() };
        return { ...prev, events };
      });
    };
    const deleteEvent = (eventId) => {
      mutate(prev => {
        const events = { ...(prev.events || {}) };
        delete events[eventId];
        return { ...prev, events };
      });
    };

    return (
      <div>
        <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
          <div className="flex gap-2">
            <button onClick={() => setShowPast(false)} className={"pill px-3 py-1 text-sm " + (!showPast ? "berry-bg text-white" : "bg-white")}>
              Upcoming ({upcoming.length})
            </button>
            <button onClick={() => setShowPast(true)} className={"pill px-3 py-1 text-sm " + (showPast ? "berry-bg text-white" : "bg-white")}>
              Past ({past.length})
            </button>
          </div>
          <button onClick={() => { setAdding(true); setEditingId(null); }} className="btn berry-bg px-4 py-2 text-sm font-semibold">+ Add event</button>
        </div>

        {adding && (
          <EventForm
            onSave={(f) => { createEvent(f); setAdding(false); }}
            onCancel={() => setAdding(false)}
          />
        )}

        {list.length === 0 && !adding && (
          <div className="card p-6 text-center">
            <p className="display text-xl">{showPast ? "No past events." : "Nothing in the diary yet."}</p>
            {!showPast && <p className="text-sm mt-2 text-[var(--ink-soft)]">Tap "+ Add event" to propose a date.</p>}
          </div>
        )}

        <div className="space-y-3">
          {list.map(ev => (
            editingId === ev.id ? (
              <EventForm
                key={ev.id}
                initial={ev}
                onSave={(f) => { updateEvent(ev.id, f); setEditingId(null); }}
                onCancel={() => setEditingId(null)}
                onDelete={() => { deleteEvent(ev.id); setEditingId(null); }}
              />
            ) : (
              <EventCard
                key={ev.id}
                ev={ev}
                member={member}
                onEdit={() => { setEditingId(ev.id); setAdding(false); }}
                onSetAvailability={setAvailability}
              />
            )
          ))}
        </div>
      </div>
    );
  };

  const AvailabilityView = ({ events, member, mutate }) => {
    const upcoming = eventsList(events).filter(e => !isPast(e.date));
    const setAvailability = (eventId, memberId, value) => {
      mutate(prev => {
        const events = { ...(prev.events || {}) };
        const ev = { ...(events[eventId] || {}) };
        const av = { ...(ev.availability || {}) };
        if (!value) delete av[memberId];
        else av[memberId] = value;
        ev.availability = av;
        events[eventId] = ev;
        return { ...prev, events };
      });
    };
    if (upcoming.length === 0) {
      return <div className="card p-6 text-center"><p className="display text-xl">No upcoming dates yet.</p><p className="text-sm mt-1 text-[var(--ink-soft)]">Add some on the Schedule tab.</p></div>;
    }
    return (
      <div>
        <div className="card p-4 mb-4">
          <div className="ticker text-[var(--berry)]">Quick mark</div>
          <p className="display text-2xl leading-tight mt-1">Tell the band when you're free.</p>
          <p className="text-sm text-[var(--ink-soft)] mt-1">Mark your availability across all upcoming dates. Updates save for the whole band.</p>
        </div>

        <div className="card overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-[var(--ink)] text-[var(--bg)]">
              <tr>
                <th className="text-left px-3 py-2 ticker">Date</th>
                <th className="text-left px-3 py-2 ticker">When</th>
                {MEMBERS.map(m => (
                  <th key={m.id} className="px-3 py-2 ticker text-center">{m.name}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {upcoming.map(ev => (
                <tr key={ev.id} className="border-t border-[var(--line)]/20">
                  <td className="px-3 py-2.5 align-top">
                    <div className="font-semibold">{fmtDate(ev.date)}</div>
                    <div className="text-xs text-[var(--ink-soft)] mt-0.5"><TypeBadge type={ev.type} status={ev.status} /> {ev.title}</div>
                  </td>
                  <td className="px-3 py-2.5 text-xs text-[var(--ink-soft)] align-top">
                    <div>{ev.startTime}–{ev.endTime}</div>
                    {ev.location && <div>{ev.location}</div>}
                  </td>
                  {MEMBERS.map(m => {
                    const isMe = member?.id === m.id;
                    const cur = ev.availability?.[m.id];
                    return (
                      <td key={m.id} className="px-2 py-2.5 text-center align-top">
                        {isMe ? (
                          <select
                            value={cur || ""}
                            onChange={e => setAvailability(ev.id, m.id, e.target.value || null)}
                            className="input text-xs py-1 px-1 text-center"
                            style={{ minWidth: 70 }}
                          >
                            <option value="">—</option>
                            <option value="yes">Yes</option>
                            <option value="maybe">Maybe</option>
                            <option value="no">No</option>
                          </select>
                        ) : (
                          <div className="flex items-center justify-center gap-1">
                            <StatusDot status={cur} />
                            <span className="text-xs">{cur ? cur[0].toUpperCase() : "—"}</span>
                          </div>
                        )}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <p className="text-xs text-[var(--ink-soft)] mt-3 italic">Other members' columns show their answer. To change yours, switch who you are at the top of the page.</p>
      </div>
    );
  };

  const SyncBadge = ({ status, errorMsg, lastSyncedAt }) => {
    const ago = lastSyncedAt ? Math.round((Date.now() - lastSyncedAt) / 1000) : null;
    if (status === "saving") return <span className="ticker text-[var(--ink-soft)]">Saving…</span>;
    if (status === "loading") return <span className="ticker text-[var(--ink-soft)]">Loading…</span>;
    if (status === "error") return <span className="ticker text-[var(--berry)]" title={errorMsg}>Sync error</span>;
    return <span className="ticker text-[var(--ink-soft)]">{ago !== null ? `synced ${ago}s ago` : "synced"}</span>;
  };

  const MemberPicker = ({ value, onChange }) => (
    <div className="flex items-center gap-2">
      <span className="ticker text-[var(--ink-soft)]">I am</span>
      <div className="flex gap-1.5 flex-wrap">
        {MEMBERS.map(m => (
          <button key={m.id}
            onClick={() => onChange(m.id)}
            className={"pill px-3 py-1 text-sm font-semibold " + (value?.id === m.id ? "berry-bg" : "bg-white hover:bg-[var(--acid)]")}>
            {m.name}
          </button>
        ))}
      </div>
    </div>
  );

  // =========================================================================
  // ROOT
  // =========================================================================
  const App = () => {
    const urlBin = getBinIdFromURL();
    const storedBin = getStoredBinId();
    const [binId, setBinId] = useState(urlBin || storedBin || null);
    const [showShare, setShowShare] = useState(false);
    const [member, setMemberId] = useMemberIdentity();
    const [tab, setTab] = useState("schedule");

    // Persist bin id from URL into localStorage so it's remembered next visit
    useEffect(() => {
      if (urlBin && urlBin !== storedBin) setStoredBinId(urlBin);
    }, [urlBin, storedBin]);

    const sync = useSyncedState(binId);

    // No bin yet → setup screen
    if (!binId) {
      return <SetupScreen onCreated={(id) => {
        setStoredBinId(id);
        // Push bin id into URL so a refresh keeps it
        const url = new URL(window.location.href);
        url.searchParams.set("bin", id);
        window.history.replaceState({}, "", url.toString());
        setBinId(id);
        setShowShare(true);
      }} />;
    }

    // Just finished setup → share screen
    if (showShare) {
      return <ShareScreen binId={binId} onContinue={() => setShowShare(false)} />;
    }

    // Loading initial data
    if (!sync.state) {
      return (
        <div className="max-w-3xl mx-auto px-4 py-12 text-center">
          <h1 className="wordmark text-5xl mb-3">Sour<span className="display-italic font-medium" style={{color:"var(--berry)"}}>berry</span></h1>
          {sync.status === "error" ? (
            <div className="card p-5 text-left">
              <div className="ticker text-[var(--berry)]">Couldn't load</div>
              <p className="display text-xl mt-1">Something's wrong with the database.</p>
              <p className="text-sm mt-2 text-[var(--ink-soft)]">{sync.errorMsg}</p>
              <p className="text-sm mt-3">Check the URL has <code className="bg-black/5 px-1">?bin=…</code> and the bin ID is correct. If you set this up, try opening the original setup link again.</p>
              <button onClick={() => { setStoredBinId(null); setBinId(null); }} className="btn bg-white px-4 py-2 mt-4">
                Reset and start over
              </button>
            </div>
          ) : (
            <p className="display-italic text-lg text-[var(--ink-soft)]">Loading the band's data…</p>
          )}
        </div>
      );
    }

    const events = sync.state.events || {};

    return (
      <div className="max-w-5xl mx-auto px-4 sm:px-6 py-6">
        <header className="mb-6">
          <div className="flex items-end justify-between gap-4 flex-wrap">
            <div>
              <div className="ticker text-[var(--berry)]">Band ops · est. for fun</div>
              <h1 className="wordmark text-6xl sm:text-7xl leading-none mt-1">
                Sour<span className="display-italic font-medium" style={{color:"var(--berry)"}}>berry</span>
              </h1>
            </div>
            <MemberPicker value={member} onChange={setMemberId} />
          </div>

          <nav className="mt-6 flex items-center border-y-2 border-[var(--line)]">
            {[{ id: "schedule", label: "Schedule" }, { id: "availability", label: "Availability" }].map(t => (
              <button
                key={t.id}
                onClick={() => setTab(t.id)}
                className={"px-5 py-2.5 ticker " + (tab === t.id ? "tab-active" : "hover:bg-[var(--acid)]")}
              >
                {t.label}
              </button>
            ))}
            <div className="ml-auto pr-2">
              <SyncBadge status={sync.status} errorMsg={sync.errorMsg} lastSyncedAt={sync.lastSyncedAt} />
            </div>
          </nav>
        </header>

        {tab === "schedule"
          ? <ScheduleView events={events} member={member} mutate={sync.mutate} />
          : <AvailabilityView events={events} member={member} mutate={sync.mutate} />
        }

        <footer className="mt-12 pt-6 border-t border-[var(--line)]/30 text-xs text-[var(--ink-soft)] flex justify-between flex-wrap gap-2">
          <span>Sourberry · keep the cover band tight</span>
          <span className="display-italic">made with bitter love</span>
        </footer>
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

</body>
</html>
