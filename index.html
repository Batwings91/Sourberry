    :root {
      --bg: #f6f1e7; --bg-card: #fffaf0; --ink: #1a0a14; --ink-soft: #4a2a3a;
      --berry: #b81f5c; --berry-deep: #7a0a35; --acid: #d6f04a; --line: #2a1018;
      --good: #1f8f4a; --rusty: #d97a1f; --learn: #c12c2c;
    }
    html, body { background: var(--bg); color: var(--ink); }
    body { font-family: 'Inter Tight', system-ui, sans-serif;
      background-image: radial-gradient(circle at 1px 1px, rgba(26,10,20,0.08) 1px, transparent 0);
      background-size: 22px 22px; }
    .display { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
    .display-italic { font-family: 'Fraunces', Georgia, serif; font-style: italic; }
    .wordmark { font-family: 'Fraunces', Georgia, serif; font-weight: 800;
      letter-spacing: -0.04em; font-variation-settings: "opsz" 144; }
    .ticker { letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; font-size: 0.72rem; }
    .card { background: var(--bg-card); border: 1.5px solid var(--line); box-shadow: 4px 4px 0 var(--line); }
    .card-flat { background: var(--bg-card); border: 1.5px solid var(--line); }
    .btn { border: 1.5px solid var(--line); box-shadow: 3px 3px 0 var(--line);
      transition: transform 80ms ease, box-shadow 80ms ease; }
    .btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--line); }
    .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--line); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .pill { border: 1.2px solid var(--line); }
    .input { background: #fffdf6; border: 1.5px solid var(--line);
      padding: 0.5rem 0.75rem; font-family: 'Inter Tight', sans-serif; width: 100%; }
    .input:focus { outline: none; box-shadow: 3px 3px 0 var(--berry); }
    .tab-active { background: var(--ink); color: var(--bg); }
    .berry-bg { background: var(--berry); color: #fff; }
    .acid-bg { background: var(--acid); color: var(--ink); }
    details > summary { cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    @media (max-width: 640px) { .card { box-shadow: 3px 3px 0 var(--line); } }
    .modal-bg { position: fixed; inset: 0; background: rgba(26,10,20,0.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .blink { animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0.5; } }
  </style>

        ["Proud Mary", "Tina Turner"],

        ["Summer of '69", "Bryan Adams"],

  ];

  const buildEventsSeed = () => {
    const events = {};
    SEED_EVENTS.forEach((ev, i) => {
      const id = `seed_${i}_${Math.random().toString(36).slice(2,7)}`;
      events[id] = { ...ev, availability: {}, createdAt: Date.now() + i };
    });
    return events;
  };
  const buildSongsSeed = () => {
    const songs = {};
    SEED_SONGS.forEach(([title, artist, status, jamtrax, proposer, lessonUrl, comments], i) => {
      const id = songId(title, artist);
      songs[id] = {
        title, artist, status,
        jamtrax: !!jamtrax, proposer: proposer || "",
        lessonUrl: lessonUrl || "", comments: comments || "",
        votes: {}, practice: {},
        createdAt: Date.now() + i,
      };
    });
    return songs;
  };
  const buildSetlistsSeed = () => {
    const setlists = {};
    SEED_SETLISTS.forEach((sl, i) => {
      const id = `seed_sl_${i}_${Math.random().toString(36).slice(2,7)}`;
      setlists[id] = {
        name: sl.name,

  const buildSeedState = () => ({
    schemaVersion: 4,
    events: buildEventsSeed(),
    songs: buildSongsSeed(),
    setlists: buildSetlistsSeed(),
    polls: {},
  });

  // ---- Migration
  const migrate = (data) => {
    let migrated = false;
    const sv = data.schemaVersion || 1;

    // v1 → v2: add songs
    if (sv < 2 || !data.songs) {
      data.songs = data.songs || buildSongsSeed();
      data.schemaVersion = 2;
      migrated = true;
    }
    // v2 → v3: re-map song statuses, add practice, add setlists, add venueType
    if (data.schemaVersion < 3) {
      Object.keys(data.songs || {}).forEach(id => {
        const s = data.songs[id];

        else if (s.status === "candidate") s.status = "suggested";
        delete s.learnt;
        s.practice = s.practice || {};

      });
      Object.keys(data.events || {}).forEach(id => {
        const e = data.events[id];
        if (!e.venueType) e.venueType = (e.location && /remote|jam/i.test(e.location)) ? "virtual" : "in-person";

      data.setlists = data.setlists || {};
      data.schemaVersion = 3;
      migrated = true;

    // v3 → v4: rename venue types, seed setlists if empty, add polls
    if (data.schemaVersion < 4) {
      Object.keys(data.events || {}).forEach(id => {
        const e = data.events[id];
        if (e.venueType === "in-person") e.venueType = "in-person-studio";

      migrated = true;

  // ---- JSONBin
  const JB_BASE = "https://api.jsonbin.io/v3/b";

    if (!res.ok) {
      const t = await res.text();

    }
    return (await res.json()).metadata?.id;
  };
  const jbReadBin = async (binId) => {
    const res = await fetch(`${JB_BASE}/${binId}/latest`, { headers: { "X-Bin-Meta": "false" } });
    if (!res.ok) {
      const t = await res.text();
      const err = new Error(`HTTP ${res.status}: ${t}`); err.status = res.status; throw err;
    }
    return await res.json();
  };
  const jbUpdateBin = async (binId, data) => {
    const res = await fetch(`${JB_BASE}/${binId}`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data),

    if (!res.ok) {
      const t = await res.text();
      const err = new Error(`HTTP ${res.status}: ${t}`); err.status = res.status; throw err;

  // ---- Helpers
  const fmtDate = (iso) => {
    if (!iso) return "";
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  };
  const fmtDateLong = (iso) => {
    if (!iso) return "";
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  };
  const todayISO = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  };
  const isPast = (iso) => iso < todayISO();
  const sortByDateAsc = (a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime);
  const eventsList = (events) => Object.entries(events || {}).map(([id, ev]) => ({ id, ...ev })).sort(sortByDateAsc);
  const songsList = (songs) => Object.entries(songs || {}).map(([id, s]) => ({ id, ...s }));
  const setlistsList = (sls) => Object.entries(sls || {}).map(([id, s]) => ({ id, ...s }));
  const pollsList = (polls) => Object.entries(polls || {}).map(([id, p]) => ({ id, ...p }));
  const newId = (p="x") => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`;

  // ---- Fuzzy search: normalise (strip non-alphanum), split query by whitespace, every token must appear as substring
  const normalize = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  const matchesQuery = (text, query) => {
    if (!query) return true;
    const t = normalize(text);
    const tokens = normalize(query).split(" ").filter(Boolean);
    return tokens.every(tk => t.includes(tk));
  };
  const songMatchesQuery = (s, query) => {
    if (!query) return true;
    return matchesQuery(`${s.title || ""} ${s.artist || ""} ${s.proposer || ""}`, query);
  };

  const isNew = (createdAt) => {

  // ---- Identity
  const useMemberIdentity = () => {
    const [memberId, setMemberIdState] = useState(() => localStorage.getItem("sourberry.memberId") || null);

  const getBinIdFromURL = () => new URLSearchParams(window.location.search).get("bin");
  const getStoredBinId = () => localStorage.getItem("sourberry.binId");

  };

  // ---- Sync (slowed to 30s; shows error details; manual refresh)
  const POLL_MS = 30000;

  const useSyncedState = (binId) => {
    const [state, setState] = useState(null);
    const [status, setStatus] = useState("loading");
    const [errorMsg, setErrorMsg] = useState("");
    const [errorStatus, setErrorStatus] = useState(null);
    const [lastSyncedAt, setLastSyncedAt] = useState(null);
    const stateRef = useRef(state); stateRef.current = state;
    const writeTimerRef = useRef(null);
    const writeInFlightRef = useRef(false);
    const pendingWriteRef = useRef(false);

    const flushWrite = useCallback(async () => {
      if (!binId || writeInFlightRef.current) return;
      writeInFlightRef.current = true;
      pendingWriteRef.current = false;
      setStatus("saving");
      try {
        await jbUpdateBin(binId, stateRef.current);
        setStatus("ok"); setErrorMsg(""); setErrorStatus(null); setLastSyncedAt(Date.now());
      } catch (e) {
        setStatus("error"); setErrorMsg(e.message); setErrorStatus(e.status || null);
      } finally {
        writeInFlightRef.current = false;
        if (pendingWriteRef.current) setTimeout(flushWrite, 100);
      }
    }, [binId]);

    const scheduleWrite = useCallback(() => {
      if (writeTimerRef.current) clearTimeout(writeTimerRef.current);
      if (writeInFlightRef.current) { pendingWriteRef.current = true; return; }
      writeTimerRef.current = setTimeout(flushWrite, 600);
    }, [flushWrite]);

    const mutate = useCallback((updater) => {
      setState(prev => {
        const next = updater(prev || { schemaVersion: 4, events: {}, songs: {}, setlists: {}, polls: {} });
        stateRef.current = next;
        return next;
      });
      scheduleWrite();
    }, [scheduleWrite]);

    const fetchOnce = useCallback(async () => {
      if (writeInFlightRef.current) return;
      try {
        let data = await jbReadBin(binId);
        if (pendingWriteRef.current || writeTimerRef.current) return;
        const didMigrate = migrate(data);
        setState(data); stateRef.current = data;
        setStatus("ok"); setErrorMsg(""); setErrorStatus(null); setLastSyncedAt(Date.now());
        if (didMigrate) scheduleWrite();
      } catch (e) {
        setStatus("error"); setErrorMsg(e.message); setErrorStatus(e.status || null);
      }
    }, [binId, scheduleWrite]);

    const reloadFromServer = useCallback(async () => {
      // Discard pending writes and re-fetch authoritatively
      if (writeTimerRef.current) { clearTimeout(writeTimerRef.current); writeTimerRef.current = null; }
      pendingWriteRef.current = false;
      setStatus("loading");
      await fetchOnce();
    }, [fetchOnce]);

    useEffect(() => {
      if (!binId) return;
      let cancelled = false;
      let pollTimer = null;
      const tick = () => {
        if (!cancelled && document.visibilityState === "visible") fetchOnce();
        pollTimer = setTimeout(tick, POLL_MS);
      };
      fetchOnce();
      pollTimer = setTimeout(tick, POLL_MS);
      const onVis = () => { if (document.visibilityState === "visible") fetchOnce(); };
      document.addEventListener("visibilitychange", onVis);
      return () => {
        cancelled = true;
        if (pollTimer) clearTimeout(pollTimer);
        document.removeEventListener("visibilitychange", onVis);
      };
    }, [binId, fetchOnce]);

    return { state, status, errorMsg, errorStatus, lastSyncedAt, mutate, refresh: fetchOnce, reloadFromServer };
  };

  // =========================================================================

            <input className="input font-mono text-xs" type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="$2a$10$..." autoComplete="off" autoCapitalize="off" autoCorrect="off" spellCheck="false" />
          </label>
          {err && <div className="mt-3 p-3 border border-[var(--berry)] bg-[var(--berry)]/10 text-sm"><strong>Couldn't set up:</strong> {err}</div>}
          <div className="mt-4 flex items-center gap-3 flex-wrap">

          </div>
        </div>
      </div>

  };

  const ShareScreen = ({ binId, onContinue }) => {
    const [copied, setCopied] = useState(false);

    const copy = async () => {

      <div className="max-w-2xl mx-auto px-4 py-8">
        <header className="mb-6"><div className="ticker text-[var(--berry)]">Done!</div>

            <input id="share-url" className="input font-mono text-xs flex-1" readOnly value={url} />

  };

  // =========================================================================
  // SHARED UI

  const TypeBadge = ({ type, status }) => {

            {m.name}

            <div>

  if (!val) delete slotVotes[memberId]; else slotVotes[memberId] = val;
  votes[slotId] = slotVotes;
  onUpdate({ votes });
};

const decidedSlot = poll.decidedSlotId ? sortedSlots.find(s => s.id === poll.decidedSlotId) : null;
const decidedEvent = poll.createdEventId && events?.[poll.createdEventId];

return (
  <div>
    <button onClick={onBack} className="ticker text-[var(--berry)] mb-3">← Back to polls</button>

    <div className="card p-4 mb-4">
      <div className="flex items-center gap-2 flex-wrap">
        <TypeBadge type={poll.eventType} status="confirmed" />
        {poll.eventType === "rehearsal" && <VenueBadge venueType={poll.venueType} />}
        {poll.status === "decided" && <span className="ticker bg-green-100 px-2 py-0.5">Decided ✓</span>}
      </div>
      <h2 className="display text-3xl leading-tight mt-2">{poll.name}</h2>
      {poll.description && <p className="text-sm text-[var(--ink-soft)] mt-2 italic">{poll.description}</p>}
      {poll.location && <p className="text-sm text-[var(--ink-soft)] mt-1">Location: {poll.location}</p>}

      {decidedSlot && (
        <div className="mt-3 p-3 bg-[var(--acid)]/30 border border-[var(--line)] text-sm">
          <strong>Picked:</strong> {fmtDateLong(decidedSlot.date)}, {decidedSlot.startTime}–{decidedSlot.endTime}
          {decidedEvent && <> · added to your <strong>Schedule</strong></>}
        </div>
      )}

      <div className="mt-3 flex gap-2 flex-wrap">
        {poll.status === "open" && (
          <button onClick={() => setAddingSlot(true)} className="btn berry-bg px-4 py-2 text-sm font-semibold">+ Add slot</button>
        )}
        {poll.status === "decided" && (
          <button onClick={() => onUpdate({ status: "open", decidedSlotId: null })} className="btn bg-white px-4 py-2 text-sm">Re-open poll</button>
        )}
        <button onClick={() => { if (confirm(`Delete poll "${poll.name}"? This won't delete any scheduled event.`)) onDelete(); }} className="btn bg-white px-4 py-2 text-sm text-[var(--berry)] ml-auto">Delete</button>
      </div>
    </div>

    {addingSlot && (
      <div className="card p-4 mb-4">
        <h3 className="display text-lg mb-3">Add a candidate slot</h3>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
          <label className="text-sm"><div className="ticker mb-1">Date</div>
            <input className="input" type="date" value={slot.date} onChange={e => setSlot(s => ({ ...s, date: e.target.value }))} /></label>
          <label className="text-sm"><div className="ticker mb-1">Start</div>
            <input className="input" type="time" value={slot.startTime} onChange={e => setSlot(s => ({ ...s, startTime: e.target.value }))} /></label>
          <label className="text-sm"><div className="ticker mb-1">End</div>
            <input className="input" type="time" value={slot.endTime} onChange={e => setSlot(s => ({ ...s, endTime: e.target.value }))} /></label>
        </div>
        <div className="flex gap-2 mt-3">
          <button onClick={addSlot} className="btn berry-bg px-4 py-2 text-sm font-semibold">Add slot</button>
          <button onClick={() => setAddingSlot(false)} className="btn bg-white px-4 py-2 text-sm">Cancel</button>
        </div>
      </div>
    )}

    {sortedSlots.length === 0 ? (
      <div className="card-flat p-6 text-center">
        <p className="display text-xl">No candidate slots yet.</p>
        <p className="text-sm text-[var(--ink-soft)] mt-2">Add 3–5 dates to give the band options.</p>
      </div>
    ) : (
      <div className="space-y-2.5">
        {sortedSlots.map(s => {
          const slotVotes = poll.votes?.[s.id] || {};
          const yesCount = MEMBERS.filter(m => slotVotes[m.id] === "yes").length;
          const noCount  = MEMBERS.filter(m => slotVotes[m.id] === "no").length;
          const allYes = yesCount === MEMBERS.length;
          const myVote = member ? slotVotes[member.id] : null;
          const isDecided = poll.decidedSlotId === s.id;
          return (
            <div key={s.id} className={"card-flat p-3 sm:p-4 " + (isDecided ? "ring-2 ring-[var(--berry)]" : allYes ? "ring-2 ring-[var(--good)]" : "")}>
              <div className="flex items-start gap-4">
                <div className="shrink-0 text-center min-w-[68px]">
                  <div className="ticker text-[var(--berry)]">{fmtDate(s.date).split(",")[0]}</div>
                  <div className="display text-3xl leading-none mt-1">{new Date(s.date+"T00:00:00").getDate()}</div>
                  <div className="ticker mt-1">{new Date(s.date+"T00:00:00").toLocaleDateString(undefined, { month: "short" })}</div>
                </div>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-semibold">{s.startTime}–{s.endTime}</div>
                  <div className="flex items-center gap-2 flex-wrap mt-2">
                    {MEMBERS.map(m => {
                      const v = slotVotes[m.id];
                      const isMe = member?.id === m.id;
                      return (
                        <button
                          key={m.id}
                          onClick={isMe && poll.status === "open" ? () => {
                            const nextV = v === "yes" ? "maybe" : v === "maybe" ? "no" : v === "no" ? null : "yes";
                            setVote(s.id, m.id, nextV);
                          } : undefined}
                          disabled={!isMe || poll.status !== "open"}
                          className="inline-flex items-center justify-center text-xs font-semibold rounded-full border border-[var(--line)] gap-1 px-2"
                          style={{
                            height: 28,
                            background: v === "yes" ? "var(--good)" : v === "no" ? "var(--learn)" : v === "maybe" ? "var(--rusty)" : "transparent",
                            color: v ? "#fff" : "var(--ink-soft)",
                            cursor: isMe && poll.status === "open" ? "pointer" : "default",
                          }}
                          title={isMe ? "Tap to cycle: Yes → Maybe → No → —" : (v || "no vote")}
                        >
                          <span>{m.name[0]}</span>
                          <span className="text-[10px]">{v === "yes" ? "✓" : v === "no" ? "✗" : v === "maybe" ? "?" : "·"}</span>
                        </button>
                      );
                    })}
                    <span className="text-xs text-[var(--ink-soft)] ml-1">
                      {yesCount} yes{noCount ? ` · ${noCount} no` : ""}
                    </span>
                  </div>
                  <div className="mt-3 flex gap-2 flex-wrap">
                    {poll.status === "open" && (
                      <>
                        {allYes && (
                          <button onClick={() => onSchedule(s)} className="btn berry-bg px-3 py-1.5 text-xs font-semibold">All in! Schedule this →</button>
                        )}
                        {!allYes && yesCount >= 3 && (
                          <button onClick={() => onSchedule(s)} className="btn bg-white px-3 py-1.5 text-xs font-semibold">Schedule anyway →</button>
                        )}
                        <button onClick={() => removeSlot(s.id)} className="ticker text-[var(--ink-soft)] hover:text-[var(--berry)] ml-auto">Remove</button>
                      </>
                    )}
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    )}

    {poll.status === "open" && member && sortedSlots.length > 0 && (
      <p className="text-xs text-[var(--ink-soft)] italic mt-3">Tap your initial on each slot to cycle: Yes → Maybe → No → —</p>
    )}
  </div>
);
