const SetlistDetail = ({setlist, songs, events, member, mutate, settings, onBack, onUpdate, onDelete, onDuplicate, onStartGigMode}) => {
  const [editingName, setEditingName] = useState(false);
  const [name, setName] = useState(setlist.name);
  const [editingSetIdx, setEditingSetIdx] = useState(null);
  const [editingSetName, setEditingSetName] = useState("");
  const [picker, setPicker] = useState(null); // null | {kind:"set", index:n} | {kind:"soundcheck"}
  const [viewMode, setViewMode] = useState("detailed");
  const sets = setlist.sets || [];
  const soundcheckId = setlist.soundcheckSongId || null;
  const gigOptions = eventsList(events).filter(e => e.type === "gig");
  const totals = setlistTotals(setlist, songs);
  const totalSongs = setlistSongCount(setlist);
  // Iteration: per-set durations for breakdown.
  const setDurations = sets.map(set => {
    const ids = set.songIds || [];
    return ids.reduce((acc, sid) => {
      const s = songs && songs[sid];
      if (s && s.lengthSec) { acc.total += s.lengthSec; } else { acc.missing += 1; }
      return acc;
    }, {total: 0, missing: 0});
  });
  const setBreakdownLabel = (sets.length > 1)
    ? sets.map((s, i) => {
        const sd = setDurations[i];
        const lbl = sd.total > 0 ? formatDuration(sd.total) + (sd.missing > 0 ? "+" : "") : "—";
        return (s.name || ("Set " + (i+1))) + ": " + lbl;
      }).join("  ·  ")
    : null;
  const totalsLabel = (() => {
    const setLabel = sets.length + " set" + (sets.length===1?"":"s");
    if (totalSongs === 0) return "Empty · " + setLabel;
    const songLabel = totalSongs + " song" + (totalSongs===1?"":"s");
    if (totals.total === 0) return songLabel + " in " + setLabel + " · no durations yet";
    const dur = formatDuration(totals.total) + (totals.missing > 0 ? "+" : "");
    const missingLabel = totals.missing > 0 ? (" · " + totals.missing + " missing length") : "";
    return "Total " + dur + " · " + songLabel + " in " + setLabel + missingLabel;
  })();

  // Mutations on sets
  const updateSet = (setIdx, data) => onUpdate({sets: sets.map((s,i) => i===setIdx ? Object.assign({}, s, data) : s)});
  const renameSet = (setIdx, newName) => updateSet(setIdx, {name: newName.trim() || ("Set " + (setIdx+1))});
  const addSet = () => {
    const usedNumbers = sets.map(s => {
      const m = (s.name || "").match(/^Set\s+(\d+)$/i);
      return m ? parseInt(m[1],10) : 0;
    });
    const nextNum = Math.max(0, ...usedNumbers, sets.length) + 1;
    onUpdate({sets: sets.concat([{name: "Set " + nextNum, songIds: []}])});
  };
  const deleteSet = (setIdx) => {
    const set = sets[setIdx];
    const songCount = (set.songIds || []).length;
    if (songCount > 0 && !confirm("Delete \"" + (set.name||"set") + "\" with " + songCount + " song" + (songCount===1?"":"s") + "?")) return;
    if (songCount === 0 && !confirm("Delete \"" + (set.name||"set") + "\"?")) return;
    let newSets = sets.slice();
    newSets.splice(setIdx, 1);
    if (newSets.length === 0) newSets = [{name:"Set 1", songIds:[]}];
    onUpdate({sets: newSets});
  };
  const moveSongInSet = (setIdx, songIdx, dir) => {
    const set = sets[setIdx];
    const arr = (set.songIds || []).slice();
    const ni = songIdx + dir;
    if (ni < 0 || ni >= arr.length) return;
    const tmp = arr[songIdx]; arr[songIdx] = arr[ni]; arr[ni] = tmp;
    updateSet(setIdx, {songIds: arr});
  };
  const removeSongFromSet = (setIdx, songIdx) => {
    const arr = (sets[setIdx].songIds || []).slice();
    arr.splice(songIdx, 1);
    updateSet(setIdx, {songIds: arr});
  };
  // Move a song from one set to another (appends to the destination, no duplicates).
  const moveSongToSet = (fromSetIdx, songIdx, toSetIdx) => {
    if (fromSetIdx === toSetIdx) return;
    const fromArr = (sets[fromSetIdx].songIds || []).slice();
    const [sid] = fromArr.splice(songIdx, 1);
    if (!sid) return;
    const toArr = (sets[toSetIdx].songIds || []).slice();
    if (toArr.includes(sid)) {
      // Already there — just remove from origin so the move still feels right.
      onUpdate({sets: sets.map((s, i) => i === fromSetIdx ? Object.assign({}, s, {songIds: fromArr}) : s)});
      return;
    }
    toArr.push(sid);
    onUpdate({sets: sets.map((s, i) => {
      if (i === fromSetIdx) return Object.assign({}, s, {songIds: fromArr});
      if (i === toSetIdx) return Object.assign({}, s, {songIds: toArr});
      return s;
    })});
  };
  const addSongToSet = (setIdx, songId) => {
    const cur = sets[setIdx].songIds || [];
    if (cur.includes(songId)) return;
    updateSet(setIdx, {songIds: cur.concat([songId])});
  };
  const setSoundcheck = id => onUpdate({soundcheckSongId: id});
  const clearSoundcheck = () => onUpdate({soundcheckSongId: null});

  // Picker handlers
  const handlePick = (songId) => {
    if (!picker) return;
    if (picker.kind === "soundcheck") setSoundcheck(songId);
    else if (picker.kind === "set") addSongToSet(picker.index, songId);
    setPicker(null);
  };
  const pickerExcludeIds = picker
    ? (picker.kind === "soundcheck" ? (soundcheckId ? [soundcheckId] : []) : setlistAllSongIds(setlist))
    : [];

  const [editingSongId, setEditingSongId] = useState(null);
  const lastRehearsedMap = useMemo(() => buildLastRehearsedMap(events), [events]);
  const updateSongData = useCallback((id, data) => mutate(prev => Object.assign({}, prev, {songs: Object.assign({}, prev.songs||{}, {[id]: Object.assign({}, (prev.songs && prev.songs[id])||{}, data)})})), [mutate]);
  const setSongStatusInline = (id, status) => updateSongData(id, {status});

    const sg = Object.assign({}, prev.songs||{});
    const s = Object.assign({}, sg[id]||{});
    const v = Object.assign({}, s.votes||{});
    if (!val) delete v[mid]; else v[mid] = val;
    s.votes = v; sg[id] = s;
    return Object.assign({}, prev, {songs: sg});
  });
  const setPracticeInline = (id, mid, val) => mutate(prev => {
    const sg = Object.assign({}, prev.songs||{});
    const s = Object.assign({}, sg[id]||{});
    const p = Object.assign({}, s.practice||{});
    if (!val) delete p[mid]; else p[mid] = val;
    s.practice = p; sg[id] = s;
    return Object.assign({}, prev, {songs: sg});
  });
  const promoteSongInline = (id) => updateSongData(id, {status:"shortlist", votes:{}});
  const deleteSongInline = (id) => {
    if (!confirm("Delete this song from the library? It will be removed from this setlist and any others.")) return;

const SetlistsView = ({setlists, songs, events, member, mutate, settings, onStartGigMode}) => {

  const all = setlistsList(setlists).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  const createSetlist = name => {
    const id = newId("sl");
    mutate(prev => Object.assign({}, prev, {setlists: Object.assign({}, prev.setlists||{}, {[id]: {name, sets:[{name:"Set 1",songIds:[]}], soundcheckSongId:null, gigEventId:null, notes:"", createdAt: Date.now()}})}));
    setOpenId(id); setCreating(false); setNewName("");
  };
  const updateSetlist = (id, data) => mutate(prev => Object.assign({}, prev, {setlists: Object.assign({}, prev.setlists||{}, {[id]: Object.assign({}, (prev.setlists && prev.setlists[id])||{}, data)})}));
  const deleteSetlist = id => { mutate(prev => { const sl = Object.assign({}, prev.setlists||{}); delete sl[id]; return Object.assign({}, prev, {setlists: sl}); }); setOpenId(null); };
  const duplicateSetlist = id => {
    const src = setlists && setlists[id];
    if (!src) return;
    const newSlId = newId("sl");
    const clonedSets = (src.sets || []).map(s => ({name: s.name, songIds: (s.songIds || []).slice()}));

    mutate(prev => Object.assign({}, prev, {setlists: Object.assign({}, prev.setlists||{}, {[newSlId]: {name: (src.name || "Setlist") + " (copy)", sets: clonedSets, soundcheckSongId: src.soundcheckSongId || null, gigEventId: null, notes: src.notes || "", createdAt: Date.now()}})}));
    setOpenId(newSlId);
  };
  if (openId && setlists && setlists[openId]) {
    return h(SetlistDetail,{setlist: Object.assign({id:openId}, setlists[openId]), songs:songs, events:events, member:member, mutate:mutate, settings:settings, onBack:()=>setOpenId(null), onUpdate: data => updateSetlist(openId, data), onDelete: () => deleteSetlist(openId), onDuplicate: () => duplicateSetlist(openId), onStartGigMode: onStartGigMode ? () => onStartGigMode(openId) : null});
  }
  return h("div",null,
    h("div",{className:"flex items-center justify-between mb-4 flex-wrap gap-2"},
      h("p",{className:"text-sm text-[var(--ink-soft)]"},"Build a named setlist from your library, optionally pinned to a gig."),

    ),
    creating && h("div",{className:"card p-4 mb-4"},
      h("label",{className:"text-sm block"}, h("div",{className:"ticker mb-1"},"Name"), h("input",{autoFocus:true,className:"input",value:newName,onChange:e=>setNewName(e.target.value),placeholder:"e.g. Dec 2026 — provisional"})),

        h("button",{onClick:()=> newName.trim() && createSetlist(newName.trim()),className:"btn berry-bg px-4 py-2 font-semibold",disabled:!newName.trim()},"Create"),
        h("button",{onClick:()=>{ setCreating(false); setNewName(""); },className:"btn bg-white px-4 py-2"},"Cancel")
      )
    ),
    all.length===0 && !creating && h("div",{className:"card p-6 text-center"}, h("p",{className:"display text-xl"},"No setlists yet.")),
    h("div",{className:"space-y-3"},
      all.map(sl => {
        const songCount = setlistSongCount(sl);
        const slLen = setlistTotals(sl, songs);
        const setCount = (sl.sets || []).length;
        const lenLabel = slLen.total > 0 ? (formatDuration(slLen.total) + (slLen.missing > 0 ? "+" : "")) : "";
        const gig = sl.gigEventId && events && events[sl.gigEventId];
        return h("button",{key:sl.id,onClick:()=>setOpenId(sl.id),className:"card-flat p-4 w-full text-left hover:bg-[var(--acid)]/20 transition"},
          h("div",{className:"flex items-center justify-between gap-3 flex-wrap"},
            h("div",{className:"flex-1 min-w-0"},
              h("div",{className:"display text-xl leading-tight"}, sl.name),
              h("div",{className:"text-sm text-[var(--ink-soft)] mt-1"}, songCount + " song" + (songCount===1?"":"s") + " in " + setCount + " set" + (setCount===1?"":"s") + (lenLabel ? (" · " + lenLabel) : "") + (gig ? (" · pinned to " + (gig.title||"gig") + " on " + fmtDate(gig.date)) : ""))
            ),
            h("span",{className:"ticker text-[var(--berry)]"},"Open ▸")
          )
        );
      })
    )
  );
};

const isWeekend = date => { const d = date.getDay(); return d === 0 || d === 6; };
const slotLabelForDate = date => isWeekend(date) ? "Day" : "Eve";
const slotDescForDate = date => isWeekend(date) ? "Daytime" : "Evening (after 6pm)";
const defaultTimeForDate = date => isWeekend(date) ? {startTime:"15:00",endTime:"18:00"} : {startTime:"18:00",endTime:"21:00"};
const localISO = date => {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return y + "-" + m + "-" + d;
};
const dayCellColor = (yesCount, totalMembers) => {
  if (yesCount === totalMembers && totalMembers > 0) return {bg:"rgba(31,143,74,0.35)",border:"var(--good)"};
  if (yesCount === totalMembers - 1 && totalMembers > 1) return {bg:"rgba(31,143,74,0.15)",border:"rgba(31,143,74,0.5)"};
  if (yesCount >= 2) return {bg:"rgba(214,240,74,0.35)",border:"rgba(26,10,20,0.2)"};
  if (yesCount >= 1) return {bg:"transparent",border:"rgba(26,10,20,0.2)"};
  return {bg:"transparent",border:"rgba(26,10,20,0.15)"};
};

// v8: month-by-month calendar, compact intro
const PracticeView = ({practiceAvail, events, member, mutate, onGoToSchedule}) => {
  const [monthOffset, setMonthOffset] = useState(0); // 0 = current month
  const [openDate, setOpenDate] = useState(null);
  const [showBulk, setShowBulk] = useState(false);
  const [isCompact, setIsCompact] = useState(() => typeof window !== "undefined" && window.innerWidth < 640);
  useEffect(() => {
    const onResize = () => setIsCompact(window.innerWidth < 640);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  // Anchor: 1st of displayed month
  const displayedMonth = useMemo(() => {
    const d = new Date();
    d.setHours(0,0,0,0);
    d.setDate(1);
    d.setMonth(d.getMonth() + monthOffset);
    return d;
  }, [monthOffset]);

  // Find Monday of week containing the 1st (week starts Mon)
  const calendarStart = useMemo(() => {
    const d = new Date(displayedMonth);
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d;
  }, [displayedMonth]);

  // Build 6 weeks × 7 days grid, mark in/out of current month
  const weeks = useMemo(() => {
    const result = [];
    const monthIdx = displayedMonth.getMonth();
    for (let w = 0; w < 6; w++) {
      const week = [];
      for (let d = 0; d < 7; d++) {
        const date = new Date(calendarStart);
        date.setDate(calendarStart.getDate() + w*7 + d);
        week.push({date, iso: localISO(date), inCurrentMonth: date.getMonth() === monthIdx});
      }
      result.push(week);
    }
    return result;
  }, [calendarStart, displayedMonth]);

  // Only the days in the current month are subject to bulk operations / clearing
  const inMonthDates = useMemo(() => weeks.flat().filter(c => c.inCurrentMonth), [weeks]);

  const setMyAvail = (iso, val) => {
    if (!member) return;
    mutate(prev => {
      const pa = Object.assign({}, prev.practiceAvail||{});
      const day = Object.assign({}, pa[iso]||{});
      if (!val) delete day[member.id]; else day[member.id] = val;
      if (Object.keys(day).length === 0) delete pa[iso]; else pa[iso] = day;
      return Object.assign({}, prev, {practiceAvail: pa});
    });
  };

  const bulkApply = (predicate, val) => {
    if (!member) return;
    mutate(prev => {
      const pa = Object.assign({}, prev.practiceAvail||{});
      inMonthDates.forEach(({date, iso}) => {
        if (predicate(date)) {
          const day = Object.assign({}, pa[iso]||{});
          if (!val) delete day[member.id]; else day[member.id] = val;
          if (Object.keys(day).length === 0) delete pa[iso]; else pa[iso] = day;
        }
      });
      return Object.assign({}, prev, {practiceAvail: pa});
    });
  };

  const clearAllMyMarks = () => {
    if (!member) return;
    if (!confirm("Clear all your availability marks for " + monthLabel + "?")) return;
    bulkApply(() => true, null);
  };

  const bookRehearsalOn = iso => {
    const date = new Date(iso + "T00:00:00");
    const t = defaultTimeForDate(date);
    const eId = newId("e");
    const sourceAvail = (practiceAvail && practiceAvail[iso]) || {};
    mutate(prev => {
      const events = Object.assign({}, prev.events||{});
      events[eId] = {date: iso, startTime: t.startTime, endTime: t.endTime, type:"rehearsal", venueType:"in-person-studio", location:"", bookingOwner:"", confirmed:false, status:"proposed", title:"", comments:"", availability: Object.assign({}, sourceAvail), createdAt: Date.now()};
      return Object.assign({}, prev, {events});
    });
    setOpenDate(null);
    if (onGoToSchedule) onGoToSchedule();
  };

  const monthLabel = displayedMonth.toLocaleDateString(undefined, {month:"long", year:"numeric"});
  const todayIsoStr = todayISO();

  return h("div",null,
    // v8: compact one-line intro (no big "When can we all jam?" headline)
    h("p",{className:"text-sm text-[var(--ink-soft)] mb-3"},"Mark days you're free. Days where everyone's green = book a rehearsal."),

    // Month navigation
    h("div",{className:"flex items-center justify-between mb-3 flex-wrap gap-2"},
      h("div",{className:"flex gap-2 items-center"},
        h("button",{onClick:()=>setMonthOffset(o=>o-1),className:"pill px-3 py-1.5 text-sm bg-white"},"‹ Previous Month"),
        h("button",{onClick:()=>setMonthOffset(0),className:"pill px-3 py-1.5 text-sm bg-white"},"Today"),
        h("button",{onClick:()=>setMonthOffset(o=>o+1),className:"pill px-3 py-1.5 text-sm bg-white"},"Next Month ›")
      ),
      h("span",{className:"display text-lg sm:text-xl"}, monthLabel)
    ),

    member && h("details",{className:"card-flat p-3 mb-3", open: showBulk, onToggle: e => setShowBulk(e.target.open)},
      h("summary",{className:"ticker text-[var(--ink-soft)] hover:text-[var(--berry)] flex items-center justify-between"},
        h("span",null,"Bulk mark my availability ▾"),
        h("span",{className:"text-xs italic"},"(" + member.name + ")")
      ),
      h("div",{className:"mt-3"},
        h("p",{className:"text-xs text-[var(--ink-soft)] mb-2"},"Apply to all days in " + monthLabel + ". Doesn't affect other people's marks."),
        h("div",{className:"overflow-x-auto"},
          h("table",{className:"text-xs"},
            h("thead",null,
              h("tr",null,
                h("th",{className:"text-left pr-3 py-1 ticker"}),
                h("th",{className:"px-1 py-1 ticker"},"✓ Yes"),
                h("th",{className:"px-1 py-1 ticker"},"? Maybe"),
                h("th",{className:"px-1 py-1 ticker"},"✗ No"),
                h("th",{className:"px-1 py-1 ticker"},"— Clear")
              )
            ),
            h("tbody",null,
              [
                {label:"All weekday evenings", pred: d => !isWeekend(d)},
                {label:"All Saturdays", pred: d => d.getDay() === 6},
                {label:"All Sundays", pred: d => d.getDay() === 0}
              ].map(row => h("tr",{key:row.label},
                h("td",{className:"pr-3 py-1 font-semibold"}, row.label),
                [
                  {v:"yes", bg:"var(--good)"},
                  {v:"maybe", bg:"var(--rusty)"},
                  {v:"no", bg:"var(--learn)"},
                  {v:null, bg:""}

                  h("button",{onClick:()=>bulkApply(row.pred, cell.v),className:"pill px-2 py-1 text-xs font-semibold bg-white hover:bg-[var(--acid)]",style: cell.bg && cell.v ? {background: cell.bg, color:"#fff"} : {}},"Apply")

const OwnedEquipmentView = ({equipment, member, mutate}) => {
  const [editingId, setEditingId] = useState(null);
  const [adding, setAdding] = useState(false);
  const [groupBy, setGroupBy] = useState("category");
  const all = equipmentList(equipment);
  const holders = Array.from(new Set(all.map(e => e.heldBy).filter(Boolean))).sort();
  const update = (id, data) => { mutate(prev => Object.assign({}, prev, {equipment: Object.assign({}, prev.equipment||{}, {[id]: Object.assign({}, (prev.equipment && prev.equipment[id])||{}, data)})})); setEditingId(null); };
  const create = data => { mutate(prev => Object.assign({}, prev, {equipment: Object.assign({}, prev.equipment||{}, {[newId("eq")]: Object.assign({}, data, {createdAt: Date.now()})})})); setAdding(false); };
  const remove = id => { mutate(prev => { const eq = Object.assign({}, prev.equipment||{}); delete eq[id]; return Object.assign({}, prev, {equipment: eq}); }); setEditingId(null); };
  const assignHolder = (id, name) => mutate(prev => Object.assign({}, prev, {equipment: Object.assign({}, prev.equipment||{}, {[id]: Object.assign({}, (prev.equipment && prev.equipment[id])||{}, {heldBy: name})})}));

  let groups = [];
  if (groupBy === "category") {
    groups = EQUIPMENT_CATEGORIES.map(c => ({key:c.id, label:c.label, items: all.filter(e => e.category === c.id).sort((a,b)=>a.name.localeCompare(b.name))})).filter(g => g.items.length>0);
  } else if (groupBy === "holder") {
    const map = {};
    all.forEach(e => { const ht = e.heldBy || "Unassigned"; if (!map[ht]) map[ht]=[]; map[ht].push(e); });
    groups = Object.keys(map).sort().map(ht => ({key:ht, label:ht, items: map[ht].sort((a,b)=>a.name.localeCompare(b.name))}));
  } else if (groupBy === "status") {
    groups = EQUIPMENT_STATUSES.map(s => ({key:s.id, label:s.label, items: all.filter(e => e.status === s.id).sort((a,b)=>a.name.localeCompare(b.name))})).filter(g => g.items.length>0);
  }
  const total = all.length;
  const issues = all.filter(e => e.status === "missing" || e.status === "broken").length;

  return h("div",null,
    h("div",{className:"card p-4 mb-4"},
      h("div",{className:"ticker text-[var(--berry)]"},"Kit list"),
      h("p",{className:"display text-2xl leading-tight mt-1"},"Who has what."),
      h("p",{className:"text-sm text-[var(--ink-soft)] mt-1"}, total + " item" + (total===1?"":"s") + " tracked" + (issues>0 ? (" · " + issues + " need attention") : "") + (member ? "" : " · pick who you are above to mark items as yours"))
    ),
    h("div",{className:"flex items-center justify-between mb-3 gap-2 flex-wrap"},
      h("div",{className:"flex gap-1.5 items-center overflow-x-auto pb-1"},
        h("span",{className:"ticker text-[var(--ink-soft)] shrink-0"},"Group by"),
        [{id:"category",label:"Category"},{id:"holder",label:"Who has it"},{id:"status",label:"Status"}].map(g => h("button",{key:g.id,onClick:()=>setGroupBy(g.id),className:"pill px-2.5 py-1 text-xs font-semibold whitespace-nowrap shrink-0 " + (groupBy===g.id?"berry-bg text-white":"bg-white")}, g.label))
      ),
      h("button",{onClick:()=>{setAdding(true); setEditingId(null);},className:"btn berry-bg px-3 py-2 text-sm font-semibold whitespace-nowrap shrink-0"},"+ Add item")
    ),
    adding && h(EquipmentForm,{onSave:create,onCancel:()=>setAdding(false),holderSuggestions:holders}),
    groups.length===0 && !adding && h("div",{className:"card p-6 text-center"}, h("p",{className:"display text-xl"},"No equipment tracked yet.")),
    h("div",{className:"space-y-6"},
      groups.map(g => h("section",{key:g.key},
        h("h2",{className:"display text-2xl mb-3"}, g.label, " ", h("span",{className:"text-[var(--ink-soft)] text-base"},"(" + g.items.length + ")")),
        h("div",{className:"space-y-2.5"},
          g.items.map(item => editingId===item.id
            ? h(EquipmentForm,{key:item.id,initial:item,onSave: f=>update(item.id, f),onCancel:()=>setEditingId(null),onDelete:()=>remove(item.id),holderSuggestions:holders})
            : h(EquipmentCard,{key:item.id,item:item,member:member,onEdit:()=>{setEditingId(item.id); setAdding(false);},onAssign:assignHolder})
          )
        )
      ))
    )
  );
};

const WishlistView = ({wishlist, member, memberProfiles, mutate}) => {
  const [editingId, setEditingId] = useState(null);
  const [adding, setAdding] = useState(false);
  const [statusFilter, setStatusFilter] = useState("active");
  const all = Object.entries(wishlist || {}).map(e => Object.assign({id:e[0]}, e[1]));
  let list = all;
  if (statusFilter === "active") list = all.filter(x => x.status !== "bought" && x.status !== "rejected");
  else if (statusFilter !== "all") list = all.filter(x => x.status === statusFilter);
  list.sort((a, b) => {
    const yA = MEMBERS.filter(m => a.votes && a.votes[m.id]==="yes").length;
    const yB = MEMBERS.filter(m => b.votes && b.votes[m.id]==="yes").length;
    if (yA !== yB) return yB - yA;
    return (a.name||"").localeCompare(b.name||"");
  });
  const update = (id, data) => mutate(prev => Object.assign({}, prev, {wishlist: Object.assign({}, prev.wishlist||{}, {[id]: Object.assign({}, (prev.wishlist && prev.wishlist[id])||{}, data)})}));
  const setStatus = (id, status) => update(id, {status});
  const create = data => { mutate(prev => Object.assign({}, prev, {wishlist: Object.assign({}, prev.wishlist||{}, {[newId("w")]: Object.assign({}, data, {votes:{}, createdAt: Date.now()})})})); setAdding(false); };
  const remove = id => { mutate(prev => { const w = Object.assign({}, prev.wishlist||{}); delete w[id]; return Object.assign({}, prev, {wishlist: w}); }); setEditingId(null); };
  const vote = (id, mid, val) => mutate(prev => {
    const w = Object.assign({}, prev.wishlist||{});
    const item = Object.assign({}, w[id]||{});
    const v = Object.assign({}, item.votes||{});

    return Object.assign({}, prev, {wishlist: w});

  return h("div",null,

      h("div",{className:"ticker text-[var(--berry)]"},"Wishlist"),
      h("p",{className:"display text-2xl leading-tight mt-1"},"What we want to buy."),
      h("p",{className:"text-sm text-[var(--ink-soft)] mt-1"},"Anyone can add an item. Each member votes ✓ Want it / ✗ No. Sorted by yes-vote count.")
    ),
    h("div",{className:"flex items-center justify-between mb-3 gap-2"},
      h("div",{className:"flex gap-1.5 items-center overflow-x-auto pb-1 -mx-1 px-1",style:{scrollbarWidth:"thin"}},
        h("button",{onClick:()=>setStatusFilter("active"),className:"pill px-2.5 py-1 text-xs font-semibold whitespace-nowrap shrink-0 " + (statusFilter==="active"?"berry-bg text-white":"bg-white")},"Active (" + all.filter(x => x.status !== "bought" && x.status !== "rejected").length + ")"),
        h("button",{onClick:()=>setStatusFilter("all"),className:"pill px-2.5 py-1 text-xs font-semibold whitespace-nowrap shrink-0 " + (statusFilter==="all"?"berry-bg text-white":"bg-white")},"All (" + all.length + ")"),
        WISHLIST_STATUSES.map(s => h("button",{key:s.id,onClick:()=>setStatusFilter(s.id),className:"pill px-2.5 py-1 text-xs font-semibold whitespace-nowrap shrink-0 " + (statusFilter===s.id?"berry-bg text-white":"bg-white")}, s.label + " (" + all.filter(x => x.status === s.id).length + ")"))
      ),
      h("button",{onClick:()=>{setAdding(true); setEditingId(null);},className:"btn berry-bg px-3 py-2 text-sm font-semibold whitespace-nowrap shrink-0"},"+ Add")
    ),
    adding && h(WishItemForm,{onSave:create,onCancel:()=>setAdding(false)}),
    list.length===0 && !adding && h("div",{className:"card p-6 text-center"},
      h("p",{className:"display text-xl"}, statusFilter==="active" ? "No active wishlist items." : "Nothing here."),
      h("p",{className:"text-sm text-[var(--ink-soft)] mt-2"},"Tap \"+ Add\" to suggest something.")
    ),
    h("div",{className:"space-y-2.5"},
      list.map(item => editingId===item.id
        ? h(WishItemForm,{key:item.id,initial:item,onSave: f=>{ update(item.id, f); setEditingId(null); },onCancel:()=>setEditingId(null),onDelete:()=>remove(item.id)})
        : h(WishItemCard,{key:item.id,item:item,member:member,memberProfiles:memberProfiles,onEdit:()=>{setEditingId(item.id); setAdding(false);},onVote:vote,onSetStatus:setStatus})
      )
    )
  );
};

// === ITERATION: FEEDBACK BOARD ===
// Lightweight kanban-style feedback for the band: comments, bug reports, feature requests.
// Lives at state.feedback as an object keyed by id. Status (backlog / in_progress / done),
// priority (high / medium / low), and a numeric `rank` per status (lower = top of column).
// Anyone can add, edit own items, or change status/priority/rank — trust-based.
const FEEDBACK_TYPES = [
  {id:"comment", label:"Comment", icon:"💬"},
  {id:"bug", label:"Bug", icon:"🐛"},
  {id:"feature", label:"Feature", icon:"✨"}
];
const FEEDBACK_PRIORITIES = [
  {id:"high", label:"High", colorBg:"#fee2e2", colorText:"#7f1d1d"},
  {id:"medium", label:"Medium", colorBg:"#fef3c7", colorText:"#78350f"},
  {id:"low", label:"Low", colorBg:"#e5e7eb", colorText:"#374151"}
];
const FEEDBACK_STATUSES = [
  {id:"backlog", label:"Backlog", helper:"Logged, not picked up yet."},
  {id:"in_progress", label:"In Progress", helper:"Someone's working on it."},
  {id:"done", label:"Done", helper:"Shipped or resolved."}
];
const feedbackTypeMeta = (id) => FEEDBACK_TYPES.find(t => t.id === id) || FEEDBACK_TYPES[0];
const feedbackPriorityMeta = (id) => FEEDBACK_PRIORITIES.find(p => p.id === id) || FEEDBACK_PRIORITIES[1];
const feedbackStatusMeta = (id) => FEEDBACK_STATUSES.find(s => s.id === id) || FEEDBACK_STATUSES[0];
const fmtFeedbackDate = (ts) => {
  if (!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, {day:"numeric", month:"short"}) + " " + d.toLocaleTimeString(undefined, {hour:"2-digit", minute:"2-digit"});
};
const newFeedbackId = () => "fb_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7);
const FeedbackView = ({feedback, member, memberProfiles, mutate}) => {
  const [adding, setAdding] = useState(false);
  const [draftType, setDraftType] = useState("feature");
  const [draftPriority, setDraftPriority] = useState("medium");
  const [draftBody, setDraftBody] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editingBody, setEditingBody] = useState("");
  const [filterType, setFilterType] = useState("all");
  const [filterAuthor, setFilterAuthor] = useState("all");

  const items = useMemo(() => {
    const arr = Object.keys(feedback || {}).map(id => Object.assign({id}, feedback[id]));
    return arr;
  }, [feedback]);

  // Group by status, then sort each by rank ascending (fallback createdAt asc).
  const byStatus = useMemo(() => {
    const groups = {backlog: [], in_progress: [], done: []};
    items.forEach(it => {
      const s = it.status || "backlog";
      (groups[s] || groups.backlog).push(it);
    });
    Object.keys(groups).forEach(k => {
      groups[k].sort((a, b) => {
        const ar = (typeof a.rank === "number") ? a.rank : Number.MAX_SAFE_INTEGER;
        const br = (typeof b.rank === "number") ? b.rank : Number.MAX_SAFE_INTEGER;
        if (ar !== br) return ar - br;
        return (a.createdAt || 0) - (b.createdAt || 0);
      });
    });
    return groups;
  }, [items]);

  // Apply filters AFTER ordering so positions stay stable.
  const passesFilter = (it) => {
    if (filterType !== "all" && (it.type || "feature") !== filterType) return false;
    if (filterAuthor !== "all" && it.fromMemberId !== filterAuthor) return false;
    return true;
  };

  const updateFeedback = (id, patch) => {
    mutate(prev => {
      const fb = Object.assign({}, prev.feedback || {});
      if (!fb[id]) return prev;
      fb[id] = Object.assign({}, fb[id], patch);
      return Object.assign({}, prev, {feedback: fb});
    });
  };
  const addItem = () => {
    if (!draftBody.trim()) return;
    const id = newFeedbackId();
    const fromMemberId = (member && member.id) || null;
    const now = Date.now();
    mutate(prev => {
      const fb = Object.assign({}, prev.feedback || {});
      // New items go to the top of Backlog: rank = (min rank in backlog) - 1, fallback 0.
      const backlog = Object.keys(fb).map(k => fb[k]).filter(x => (x.status || "backlog") === "backlog");
      const minRank = backlog.length === 0 ? 0 : Math.min.apply(null, backlog.map(x => (typeof x.rank === "number") ? x.rank : 0));
      fb[id] = {
        id: id,
        type: draftType,
        priority: draftPriority,
        status: "backlog",
        body: draftBody.trim(),
        fromMemberId: fromMemberId,
        createdAt: now,
        rank: minRank - 1
      };
      return Object.assign({}, prev, {feedback: fb});
    });
    setDraftBody("");
    setDraftType("feature");
    setDraftPriority("medium");
    setAdding(false);
  };
  const deleteItem = (id) => {
    if (!confirm("Delete this feedback item?")) return;
    mutate(prev => {
      const fb = Object.assign({}, prev.feedback || {});
      delete fb[id];
      return Object.assign({}, prev, {feedback: fb});
    });
  };
  const move = (id, dir) => {
    // Reorder within the item's current status group.
    const item = items.find(x => x.id === id);
    if (!item) return;
    const status = item.status || "backlog";
    const list = byStatus[status].slice();
    const idx = list.findIndex(x => x.id === id);
    if (idx < 0) return;
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= list.length) return;
    // Swap and renumber ranks 0..N for stability.
    list.splice(idx, 1);
    list.splice(newIdx, 0, item);
    mutate(prev => {
      const fb = Object.assign({}, prev.feedback || {});
      list.forEach((it, i) => {
        if (fb[it.id]) fb[it.id] = Object.assign({}, fb[it.id], {rank: i});
      });
      return Object.assign({}, prev, {feedback: fb});
    });
  };
  const setStatus = (id, newStatus) => {
    // When moving to a new status, place at end of new status (highest rank in that column + 1).
    mutate(prev => {
      const fb = Object.assign({}, prev.feedback || {});
      if (!fb[id]) return prev;
      const inTarget = Object.keys(fb).map(k => fb[k]).filter(x => (x.status || "backlog") === newStatus && k !== id);
      const maxRank = inTarget.length === 0 ? -1 : Math.max.apply(null, inTarget.map(x => (typeof x.rank === "number") ? x.rank : 0));
      fb[id] = Object.assign({}, fb[id], {status: newStatus, rank: maxRank + 1});
      return Object.assign({}, prev, {feedback: fb});
    });
  };
  const startEdit = (item) => { setEditingId(item.id); setEditingBody(item.body || ""); };
  const saveEdit = () => {
    if (!editingId) return;
    if (!editingBody.trim()) return;
    updateFeedback(editingId, {body: editingBody.trim()});
    setEditingId(null);
    setEditingBody("");
  };
  const cancelEdit = () => { setEditingId(null); setEditingBody(""); };

  const renderCard = (item, idx, total) => {
    const tm = feedbackTypeMeta(item.type);
    const pm = feedbackPriorityMeta(item.priority);
    const author = MEMBERS.find(m => m.id === item.fromMemberId);
    const authorName = author ? author.name : (item.fromMemberId || "(unknown)");
    const authorPhoto = (memberProfiles && item.fromMemberId && memberProfiles[item.fromMemberId] && memberProfiles[item.fromMemberId].photoUrl) || "";
    const isAuthor = member && item.fromMemberId === member.id;
    const isEditing = editingId === item.id;
    return h("div",{key:item.id, className:"card-flat p-2.5 mb-2"},
      h("div",{className:"flex items-start gap-2"},
        h("div",{className:"flex-1 min-w-0"},
          h("div",{className:"flex items-center gap-1.5 flex-wrap text-xs mb-1"},
            h("span",{title:tm.label}, tm.icon),
            h("span",{className:"ticker px-1.5 py-0.5 text-[10px]", style:{background:pm.colorBg, color:pm.colorText}}, pm.label)
          ),
          isEditing
            ? h("textarea",{className:"input text-sm",rows:"3",value:editingBody,onChange:e=>setEditingBody(e.target.value)})
            : h("div",{className:"text-sm whitespace-pre-wrap break-words"}, item.body || ""),
          h("div",{className:"text-[10px] text-[var(--ink-soft)] mt-1.5 flex items-center gap-1.5 flex-wrap"},
            authorPhoto && h("img",{src:authorPhoto,alt:"",className:"rounded-full",style:{width:14,height:14,objectFit:"cover"}}),
            h("span",null, authorName),
            h("span",null,"·"),
            h("span",null, fmtFeedbackDate(item.createdAt))
          )
        ),
        h("div",{className:"flex flex-col gap-1 shrink-0"},
          h("button",{onClick:()=>move(item.id, -1),disabled:idx===0,className:"pill px-2 py-0.5 text-xs bg-white disabled:opacity-30",title:"Move up"},"↑"),
          h("button",{onClick:()=>move(item.id, 1),disabled:idx===total-1,className:"pill px-2 py-0.5 text-xs bg-white disabled:opacity-30",title:"Move down"},"↓")
        )
      ),
      h("div",{className:"mt-2 pt-2 border-t border-[var(--line)]/15 flex items-center gap-2 flex-wrap"},
        h("select",{
          value: item.priority || "medium",
          onChange: e => updateFeedback(item.id, {priority: e.target.value}),
          className:"input text-xs py-0.5 px-1",
          style:{maxWidth:"100px"},
          title:"Priority"
        },
          FEEDBACK_PRIORITIES.map(p => h("option",{key:p.id, value:p.id}, p.label))
        ),
        h("select",{
          value: item.status || "backlog",
          onChange: e => setStatus(item.id, e.target.value),
          className:"input text-xs py-0.5 px-1",
          style:{maxWidth:"120px"},
          title:"Status"
        },
          FEEDBACK_STATUSES.map(s => h("option",{key:s.id, value:s.id}, s.label))
        ),
        isEditing
          ? h(React.Fragment,null,
              h("button",{onClick:saveEdit,className:"ticker text-[var(--berry)] hover:underline text-xs"},"Save"),
              h("button",{onClick:cancelEdit,className:"ticker text-[var(--ink-soft)] hover:underline text-xs"},"Cancel")
            )
          : h(React.Fragment,null,
              isAuthor && h("button",{onClick:()=>startEdit(item),className:"ticker text-[var(--ink-soft)] hover:text-[var(--berry)] text-xs ml-auto"},"Edit"),
              isAuthor && h("button",{onClick:()=>deleteItem(item.id),className:"ticker text-[var(--ink-soft)] hover:text-[var(--berry)] text-xs"},"Delete")
            )
      )
    );
  };

  return h("div",null,
    // Header / add
    h("div",{className:"flex items-baseline justify-between gap-2 flex-wrap mb-3"},
      h("p",{className:"text-sm text-[var(--ink-soft)] italic"},"Comments, bugs, feature requests. Anyone can log, anyone can re-rank or move between columns."),
      !adding && member && h("button",{onClick:()=>setAdding(true),className:"btn berry-bg px-3 py-1.5 text-sm font-semibold"},"+ New feedback"),
      !member && h("p",{className:"text-xs italic text-[var(--ink-soft)]"},"Pick who you are at the top to add feedback.")
    ),
    // New item form
    adding && h("div",{className:"card p-3 mb-3"},
      h("div",{className:"flex flex-wrap gap-2 mb-2"},
        h("div",null,
          h("div",{className:"ticker text-[var(--ink-soft)] text-[10px] mb-1"},"Type"),
          h("div",{className:"flex gap-1"},
            FEEDBACK_TYPES.map(t => h("button",{key:t.id, onClick:()=>setDraftType(t.id), className:"pill px-2 py-1 text-xs " + (draftType===t.id?"berry-bg text-white":"bg-white")}, t.icon + " " + t.label))
          )
        ),
        h("div",null,
          h("div",{className:"ticker text-[var(--ink-soft)] text-[10px] mb-1"},"Priority"),
          h("div",{className:"flex gap-1"},
            FEEDBACK_PRIORITIES.map(p => h("button",{key:p.id, onClick:()=>setDraftPriority(p.id), className:"pill px-2 py-1 text-xs font-semibold " + (draftPriority===p.id?"text-white":""), style: draftPriority===p.id ? {background:p.colorText} : {background:p.colorBg, color:p.colorText}}, p.label))
          )
        )
      ),
      h("textarea",{className:"input text-sm",rows:"3",value:draftBody,onChange:e=>setDraftBody(e.target.value),placeholder:"What's on your mind? E.g. \"Reorder buttons in setlist detail are too small on iPad\""}),
      h("div",{className:"mt-2 flex gap-2 justify-end"},
        h("button",{onClick:()=>{setAdding(false); setDraftBody("");},className:"btn bg-white px-3 py-1.5 text-sm"},"Cancel"),
        h("button",{onClick:addItem, disabled: !draftBody.trim(), className:"btn berry-bg px-4 py-1.5 text-sm font-semibold disabled:opacity-50"},"Log it")
      )
    ),
    // Filters

    ),

    items.length === 0
      ? h("div",{className:"card p-6 text-center text-[var(--ink-soft)] italic"},"No feedback yet. Hit \"+ New feedback\" to log the first comment, bug, or feature request.")
      : h("div",{className:"grid grid-cols-1 md:grid-cols-3 gap-3"},
          FEEDBACK_STATUSES.map(s => {
            const all = byStatus[s.id] || [];
            const filtered = all.filter(passesFilter);
            return h("div",{key:s.id, className:"card p-3"},
              h("div",{className:"ticker text-[var(--berry)] flex items-baseline justify-between gap-2"},
                h("span",null, s.label),
                h("span",{className:"text-[var(--ink-soft)] text-[10px]"}, filtered.length + (all.length !== filtered.length ? ("/" + all.length) : ""))
              ),
              h("p",{className:"text-[10px] text-[var(--ink-soft)] italic mb-2"}, s.helper),
              filtered.length === 0
                ? h("div",{className:"text-xs text-[var(--ink-soft)] italic py-2"}, all.length === 0 ? "Empty." : "Nothing matches filter.")
                : filtered.map((it) => {
                    // Index within the filtered subset, which doesn't reflect global rank
                    // when filters are active. Disable the move arrows in that case to
                    // prevent confusing reorders.
                    const filterActive = (filterType !== "all" || filterAuthor !== "all");

                        : renderCard(it, rawIdx, all.length)
                    );
                  })
            );
          })
        )
  );
};

// === ITERATION C.1: REHEARSAL RUN MODE ===
// Full-page focused UI for running a rehearsal: step through agenda one song at a time,
// mark Played / Skip, log unplanned songs, set practice statuses, take notes.
// All state lives on the event itself (playedSongIds, rehearsalNotes) — closing and
// reopening just resumes from wherever you were.
const RehearsalRunMode = ({event, songs, member, memberProfiles, mutate, onClose}) => {
  const eid = event.id;
  const agendaIds = Array.isArray(event.agendaSongIds) ? event.agendaSongIds : [];
  const playedIds = Array.isArray(event.playedSongIds) ? event.playedSongIds : [];
  const extraPlayed = playedIds.filter(id => !agendaIds.includes(id));
  // currentIdx: pointer into agendaIds for "the song we're working on now".
  // Initial: first un-played agenda item, or 0 if everything's done.
  const initialIdx = (() => {
    const i = agendaIds.findIndex(id => !playedIds.includes(id));
    return i >= 0 ? i : agendaIds.length;
  })();
  const [currentIdx, setCurrentIdx] = useState(initialIdx);
  // pickerMode: null when picker closed, "agenda" to add to agenda, "played" to log unplanned/played
  const [pickerMode, setPickerMode] = useState(null);
  // Notes are debounced so typing doesn't fire mutate every keystroke.
  const [notesDraft, setNotesDraft] = useState(event.rehearsalNotes || "");
  const notesTimerRef = useRef(null);
  const updateEvent = useCallback((fn) => {
    mutate(prev => {
      const events = Object.assign({}, prev.events||{});
      const ev = Object.assign({}, events[eid]||{});
      const patch = fn(ev);
      if (!patch) return prev;
      events[eid] = Object.assign({}, ev, patch);
      return Object.assign({}, prev, {events});
    });
  }, [mutate, eid]);
  useEffect(() => {
    if (notesTimerRef.current) clearTimeout(notesTimerRef.current);
    notesTimerRef.current = setTimeout(() => {
      updateEvent(ev => (ev.rehearsalNotes !== notesDraft) ? {rehearsalNotes: notesDraft} : null);
    }, 700);
    return () => { if (notesTimerRef.current) clearTimeout(notesTimerRef.current); };
  }, [notesDraft, updateEvent]);
  const markPlayed = (sid) => {
    updateEvent(ev => {
      const cur = Array.isArray(ev.playedSongIds) ? ev.playedSongIds : [];
      if (cur.includes(sid)) return null;
      return {playedSongIds: cur.concat([sid])};
    });
  };
  const unmarkPlayed = (sid) => {
    updateEvent(ev => {
      const cur = Array.isArray(ev.playedSongIds) ? ev.playedSongIds : [];
      return {playedSongIds: cur.filter(x => x !== sid)};
    });
  };
  const advance = () => {
    // Find the next un-played agenda item from currentIdx+1; otherwise land at end.
    setCurrentIdx(i => {
      for (let j = i + 1; j < agendaIds.length; j++) {
        if (!playedIds.includes(agendaIds[j])) return j;
      }
      return agendaIds.length;
    });
  };
  const goBack = () => setCurrentIdx(i => Math.max(0, i - 1));
  const jumpTo = (idx) => {
    if (idx < 0 || idx > agendaIds.length) return;
    setCurrentIdx(idx);
  };
  const onPlayed = () => {
    const sid = agendaIds[currentIdx];
    if (sid) markPlayed(sid);
    advance();
  };
  // Add a song to the agenda (planning to play it). Appended at the end.
  const addToAgenda = (sid) => {
    updateEvent(ev => {
      const cur = Array.isArray(ev.agendaSongIds) ? ev.agendaSongIds : [];
      if (cur.includes(sid)) return null;
      return {agendaSongIds: cur.concat([sid])};
    });
    setPickerMode(null);
  };
  // Remove a song from the agenda. Doesn't touch playedSongIds.
  const removeFromAgenda = (sid) => {
    updateEvent(ev => {
      const cur = Array.isArray(ev.agendaSongIds) ? ev.agendaSongIds : [];
      const next = cur.filter(x => x !== sid);
      return {agendaSongIds: next};
    });
    // If we removed something at or before the cursor, the cursor index moves implicitly:
    // the items array got shorter, so React will see the new length next render. Adjust to
    // keep pointing at "the same logical position" — clamp to new length.
    setCurrentIdx(i => {
      const removedIdx = agendaIds.indexOf(sid);
      if (removedIdx < 0) return i;
      if (removedIdx < i) return Math.max(0, i - 1);
      // Removing the active item: stay at same numeric index (which now points at what was the next song)
      return Math.min(i, agendaIds.length - 1);
    });
  };
  // Reorder a song in the agenda. Updates the cursor so it keeps pointing at the
  // same logical song (i.e. if you move the current song up, currentIdx follows it).
  const moveAgendaItem = (idx, dir) => {
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= agendaIds.length) return;
    updateEvent(ev => {
      const cur = Array.isArray(ev.agendaSongIds) ? ev.agendaSongIds : [];
      if (idx >= cur.length || newIdx >= cur.length) return null;
      const next = cur.slice();
      const [moved] = next.splice(idx, 1);
      next.splice(newIdx, 0, moved);
      return {agendaSongIds: next};
    });
    // Cursor follow logic:
    //   - If we moved the cursor's own song, the cursor moves with it.
    //   - If we moved a song from one side of the cursor to the other, cursor shifts by ±1.
    //   - Otherwise, cursor stays put.
    setCurrentIdx(i => {
      if (i === idx) return newIdx;
      if (dir === -1 && idx === i + 1) return i + 1;       // moved item just below cursor up past us
      if (dir === 1 && idx === i - 1) return i - 1;        // moved item just above cursor down past us
      return i;
    });
  };
  // Log a song as unplanned/just-played. Doesn't add it to the agenda.
  const onAddUnplanned = (sid) => {
    markPlayed(sid);
    setPickerMode(null);
  };
  const onPickerSelect = (sid) => {
    if (pickerMode === "agenda") addToAgenda(sid);
    else if (pickerMode === "played") onAddUnplanned(sid);
  };
  const setMyPractice = (sid, val) => {
    if (!member) return;
    mutate(prev => {
      const sg = Object.assign({}, prev.songs||{});
      const s = Object.assign({}, sg[sid]||{});
      const p = Object.assign({}, s.practice||{});
      if (!val) delete p[member.id]; else p[member.id] = val;
      s.practice = p; sg[sid] = s;
      return Object.assign({}, prev, {songs: sg});
    });
  };
  // Derived UI values
  const totalToCover = agendaIds.length + extraPlayed.length;
  const totalDone = agendaIds.filter(id => playedIds.includes(id)).length + extraPlayed.length;
  const currentSongId = agendaIds[currentIdx];
  const currentSong = currentSongId ? (songs && songs[currentSongId]) : null;
  const isAtEnd = currentIdx >= agendaIds.length;
  return h("div",{className:"max-w-3xl mx-auto px-3 sm:px-4 py-3 sm:py-4"},
    // Header
    h("header",{className:"flex items-center justify-between gap-3 mb-3"},
      h("button",{onClick:onClose,className:"btn bg-white px-3 py-1.5 text-sm font-semibold","aria-label":"End rehearsal mode"},"× End rehearsal"),
      h("div",{className:"text-right min-w-0"},
        h("div",{className:"ticker text-[var(--berry)]"},"Rehearsal mode"),
        h("div",{className:"text-xs text-[var(--ink-soft)] truncate"}, fmtDate(event.date) + (event.startTime ? (" · " + event.startTime) : ""))
      )
    ),
    // Progress
    h("div",{className:"card p-3 mb-3"},
      h("div",{className:"flex items-baseline justify-between gap-2 flex-wrap"},
        h("div",{className:"text-sm font-semibold"},
          agendaIds.length === 0
            ? "No agenda — log songs as you play"
            : isAtEnd ? "Agenda done!" : ("Song " + (currentIdx+1) + " of " + agendaIds.length)
        ),
        h("div",{className:"text-xs text-[var(--ink-soft)]"},
          totalDone, " played",
          agendaIds.length > 0 && (" · " + Math.max(0, agendaIds.length - agendaIds.filter(id => playedIds.includes(id)).length) + " agenda left"),
          extraPlayed.length > 0 && (" · " + extraPlayed.length + " unplanned")
        )
      ),
      totalToCover > 0 && h("div",{className:"mt-2 h-2 bg-[var(--line)]/10 rounded overflow-hidden"},
        h("div",{className:"h-full berry-bg",style:{width: Math.round((totalDone/totalToCover)*100) + "%"}})
      )
    ),
    // Current song card OR completion message OR no-agenda CTA
    agendaIds.length === 0
      ? h("div",{className:"card p-4 mb-3 text-center"},
          h("div",{className:"display text-xl"},"This rehearsal has no agenda"),
          h("p",{className:"text-sm text-[var(--ink-soft)] mt-1"},"Use \"Add unplanned song\" below to log what you're playing as you go.")
        )
      : isAtEnd
        ? h("div",{className:"card p-4 mb-3 text-center"},
            h("div",{className:"display text-2xl"},"Done with the agenda 🎉"),
            h("p",{className:"text-sm text-[var(--ink-soft)] mt-1"},"Add an unplanned song below or end the rehearsal.")
          )
        : currentSong
          ? h("div",{className:"card p-3 sm:p-4 mb-3"},
              h("div",{className:"flex items-start gap-3"},
                currentSong.coverArtUrl && h("img",{src:currentSong.coverArtUrl,alt:"",className:"shrink-0 rounded border border-[var(--line)]/30",style:{width:64,height:64,objectFit:"cover"},onError:e=>{e.target.style.display="none";}}),
                h("div",{className:"flex-1 min-w-0"},
                  h("div",{className:"display text-2xl leading-tight"}, currentSong.title || "(untitled)"),
                  currentSong.artist && h("div",{className:"text-sm text-[var(--ink-soft)] italic"}, currentSong.artist),
                  h("div",{className:"text-xs text-[var(--ink-soft)] mt-1"},
                    [currentSong.album, currentSong.year, formatDuration(currentSong.lengthSec)].filter(Boolean).join(" · ") || "no metadata yet"
                  ),
                  h("div",{className:"mt-2 flex flex-wrap items-center gap-2"},
                    h("a",{href:appleMusicLinkFor(currentSong),target:"_blank",rel:"noopener",className:"ticker text-[var(--berry)] underline"}, currentSong.iTunesUrl ? "Apple Music ↗" : "Apple Music 🔍"),
                    h("a",{href:spotifyLinkFor(currentSong),target:"_blank",rel:"noopener",className:"ticker text-[var(--berry)] underline"}, currentSong.spotifyUrl ? "Spotify ↗" : "Spotify 🔍"),
                    currentSong.lessonUrl && h("a",{href:currentSong.lessonUrl,target:"_blank",rel:"noopener",className:"ticker text-[var(--berry)] underline"},"Lesson ↗")
                  )
                )
              ),
              // Practice chips for the current song
              h("div",{className:"mt-3 pt-3 border-t border-[var(--line)]/15"},
                h("div",{className:"flex items-center gap-3 flex-wrap"},
                  h("span",{className:"ticker text-[var(--ink-soft)]"},"Practice"),
                  h("div",{className:"flex items-center gap-1.5"},
                    MEMBERS.map(m => h(PracticeChip,{key:m.id, initial:m.name[0], photoUrl: (memberProfiles && memberProfiles[m.id] && memberProfiles[m.id].photoUrl) || "", state:currentSong.practice && currentSong.practice[m.id], isMe: member && member.id===m.id, onClick:()=>setMyPractice(currentSongId, cyclePractice(currentSong.practice && currentSong.practice[m.id]))}))
                  ),
                  member ? h("span",{className:"text-xs text-[var(--ink-soft)] italic"},"Tap your circle to log how it went")
                         : h("span",{className:"text-xs text-[var(--ink-soft)] italic"},"Pick who you are at top to log practice")
                )
              ),
              // Action row
              h("div",{className:"mt-3 grid grid-cols-3 gap-2"},
                h("button",{onClick:goBack,disabled:currentIdx===0,className:"btn bg-white px-3 py-2.5 text-sm font-semibold disabled:opacity-30"},"← Back"),
                h("button",{onClick:onPlayed,className:"btn berry-bg px-3 py-2.5 text-sm font-semibold"},"✓ Played"),
                h("button",{onClick:advance,className:"btn bg-white px-3 py-2.5 text-sm font-semibold"},"Skip →")
              )
            )
          : h("div",{className:"card p-4 mb-3"},
              h("p",{className:"text-sm italic text-[var(--ink-soft)]"},"(This song was deleted from the song list.)"),
              h("div",{className:"mt-3 grid grid-cols-3 gap-2"},
                h("button",{onClick:goBack,disabled:currentIdx===0,className:"btn bg-white px-3 py-2.5 text-sm font-semibold disabled:opacity-30"},"← Back"),
                h("button",{onClick:advance,className:"btn berry-bg px-3 py-2.5 text-sm font-semibold col-span-2"},"Skip ahead →")
              )
            ),
    // Picker (opened either to add to agenda or log unplanned)
    pickerMode && h(SongPicker, {
      songs: songs,
      excludeIds: pickerMode === "agenda" ? agendaIds : playedIds,
      onPick: onPickerSelect,
      onClose: () => setPickerMode(null)
    }),
    // Agenda (consolidated): all items, tappable to jump, × to remove.
    agendaIds.length > 0 && h("div",{className:"card p-3 mb-3"},
      h("div",{className:"flex items-center justify-between mb-2"},
        h("div",{className:"ticker text-[var(--berry)]"},"Agenda (", agendaIds.length, ")"),
        h("span",{className:"ticker text-[var(--ink-soft)] text-[10px]"},"Tap title to jump · ↑↓ to reorder")
      ),
      h("ol",{className:"space-y-1 text-sm",style:{listStyle:"none",paddingLeft:0}},
        agendaIds.map((sid, i) => {
          const s = songs && songs[sid];
          const done = playedIds.includes(sid);
          const isCurrent = i === currentIdx && !isAtEnd;
          const titleText = s ? (s.title || "(untitled)") : "(deleted)";
          return h("li",{key:"a-"+sid+"-"+i, className:"flex items-center gap-1.5 py-1 px-1 rounded " + (isCurrent ? "bg-[var(--berry)]/10" : "hover:bg-[var(--acid)]/30")},
            h("span",{className:"text-[var(--ink-soft)] w-5 text-right shrink-0 text-xs"}, (i+1) + "."),
            h("button",{
              onClick:()=>jumpTo(i),
              className:"flex-1 min-w-0 text-left truncate " + (done && !isCurrent ? "line-through text-[var(--ink-soft)]" : (isCurrent ? "font-semibold" : "")),
              title: isCurrent ? "Currently on this song" : (done ? "Played — tap to revisit" : "Tap to jump here")
            }, titleText),
            isCurrent && h("span",{className:"ticker text-[var(--berry)] text-[10px] shrink-0"},"NOW"),
            done && !isCurrent && h("span",{className:"text-[var(--good)] shrink-0"},"✓"),
            h("button",{onClick:()=>moveAgendaItem(i, -1),disabled:i===0,className:"pill px-1.5 py-0.5 text-xs bg-white disabled:opacity-30 shrink-0",title:"Move up","aria-label":"Move up"},"↑"),
            h("button",{onClick:()=>moveAgendaItem(i, 1),disabled:i===agendaIds.length-1,className:"pill px-1.5 py-0.5 text-xs bg-white disabled:opacity-30 shrink-0",title:"Move down","aria-label":"Move down"},"↓"),
            h("button",{onClick:()=>removeFromAgenda(sid),className:"text-[var(--ink-soft)] hover:text-[var(--berry)] shrink-0 px-1.5 py-0.5 text-xs",title:"Remove from agenda"},"×")
          );
        })
      )
    ),
    // No agenda yet — CTA
    agendaIds.length === 0 && !pickerMode && h("div",{className:"card p-3 mb-3"},
      h("p",{className:"text-sm text-[var(--ink-soft)] italic mb-2"},"No agenda yet. Add songs to plan, or log songs as you play them."),
      h("div",{className:"grid grid-cols-1 sm:grid-cols-2 gap-2"},
        h("button",{onClick:()=>setPickerMode("agenda"),className:"btn berry-bg px-3 py-2 text-sm font-semibold"},"+ Add to agenda"),
        h("button",{onClick:()=>setPickerMode("played"),className:"btn bg-white px-3 py-2 text-sm font-semibold"},"+ Log a song just played")
      )
    ),
    // Unplanned songs played (separate list — these aren't in the agenda)
    extraPlayed.length > 0 && h("div",{className:"card p-3 mb-3"},
      h("div",{className:"ticker text-[var(--berry)] mb-2"},"Played off-plan (", extraPlayed.length, ")"),
      h("ul",{className:"space-y-1 text-sm",style:{listStyle:"none",paddingLeft:0}},
        extraPlayed.map(sid => {
          const s = songs && songs[sid];
          return h("li",{key:"x-"+sid,className:"flex items-center gap-2 py-1"},
            h("span",{className:"text-[var(--good)] shrink-0"},"✓"),
            h("span",{className:"flex-1 min-w-0 truncate"}, s ? (s.title || "(untitled)") : "(deleted)"),
            h("button",{onClick:()=>unmarkPlayed(sid),className:"ticker text-[var(--ink-soft)] hover:text-[var(--berry)] shrink-0",title:"Remove from played list"},"delete")
          );
        })
      )
    ),
    // Both Add buttons, side-by-side, when an agenda already exists.
    !pickerMode && agendaIds.length > 0 && h("div",{className:"grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3"},

      h("button",{onClick:()=>setPickerMode("played"),className:"btn bg-white px-3 py-2 text-sm font-semibold"},"+ Log a song just played")
    ),
    // Notes
    h("div",{className:"card p-3 mb-3"},
      h("div",{className:"ticker text-[var(--berry)] mb-1"},"Rehearsal notes"),
      h("textarea",{
        className:"input",
        rows:"3",
        value:notesDraft,
        onChange:e=>setNotesDraft(e.target.value),
        placeholder:"What went well, what to fix, ideas to try next time…"
      }),
      h("p",{className:"text-xs text-[var(--ink-soft)] italic mt-1"},"Saves automatically.")
    ),
    h("div",{className:"mt-4"},
      h("button",{onClick:onClose,className:"btn berry-bg px-5 py-2.5 text-sm font-semibold w-full"},"End rehearsal")
    )
  );
};

const App = () => {

  const storedBin = getStoredBinId();
  const [binId, setBinId] = useState(urlBin || storedBin || null);

  const [member, setMemberId] = useMemberIdentity();
  const [tab, setTab] = useState("gigs");
  const [showSyncPanel, setShowSyncPanel] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  // Iteration C.1: when set, App takes over with the focused Run Rehearsal page.
  const [runRehearsalId, setRunRehearsalId] = useState(null);
  // Iteration D.1 (rebuild): when set, App takes over with the full-screen Gig Mode.
  // Lifted from SetlistDetail to App so Gig Mode is a full-page route, not an overlay.
  // Overlay approach kept rendering the App underneath which broke print and on-screen.
  const [gigSetlistId, setGigSetlistId] = useState(null);
  useEffect(() => { if (urlBin && urlBin !== storedBin) setStoredBinId(urlBin); }, [urlBin, storedBin]);
  const sync = useSyncedState(binId, member && member.id);

  if (!binId) return h(SetupScreen,{onCreated: id => { setStoredBinId(id); const url = new URL(window.location.href); url.searchParams.set("bin", id); window.history.replaceState({}, "", url.toString()); setBinId(id); setShowShare(true); }});
  if (showShare) return h(ShareScreen,{binId:binId,onContinue:()=>setShowShare(false)});

  if (!sync.state) {
    return h("div",{className:"max-w-3xl mx-auto px-4 py-12 text-center"},
      h(Wordmark, {className:"h-12 mb-3 mx-auto"}),
      sync.status === "error"
        ? h("div",{className:"card p-5 text-left"},
            h("div",{className:"ticker text-[var(--berry)]"},"Couldn't load"),
            h("p",{className:"display text-xl mt-1"},"Something's wrong with the database."),
            h("p",{className:"text-sm mt-2 text-[var(--ink-soft)]"}, sync.errorMsg),
            h("div",{className:"mt-4 flex gap-2 flex-wrap"},
              h("button",{onClick:()=>sync.refresh(),className:"btn berry-bg px-4 py-2 font-semibold"},"Retry"),
              h("button",{onClick:()=>{ setStoredBinId(null); setBinId(null); },className:"btn bg-white px-4 py-2"},"Reset and start over")
            )
          )
        : h("p",{className:"display-italic text-lg text-[var(--ink-soft)]"},"Loading the band's data…")
    );
  }

  const events = sync.state.events || {};
  const songs = sync.state.songs || {};
  const setlists = sync.state.setlists || {};
  const equipment = sync.state.equipment || {};
  const wishlist = sync.state.wishlist || {};
  const practiceAvail = sync.state.practiceAvail || {};
  const memberProfiles = sync.state.memberProfiles || {};
  const settings = sync.state.settings || {};
  const feedback = sync.state.feedback || {};

  // Iteration C.1: full-page takeover for the rehearsal runner.
  if (runRehearsalId && events[runRehearsalId] && events[runRehearsalId].type === "rehearsal") {
    const ev = Object.assign({id: runRehearsalId}, events[runRehearsalId]);
    return h(RehearsalRunMode, {event: ev, songs: songs, member: member, memberProfiles: memberProfiles, mutate: sync.mutate, onClose: () => setRunRehearsalId(null)});
  }
  // If the id pointed to something that's gone or isn't a rehearsal, clear it silently.
  if (runRehearsalId && (!events[runRehearsalId] || events[runRehearsalId].type !== "rehearsal")) {
    setRunRehearsalId(null);
  }
  // Iteration D.1: full-page route for Gig Mode (replaces the App content while active).
  if (gigSetlistId && setlists[gigSetlistId]) {
    const sl = Object.assign({id: gigSetlistId}, setlists[gigSetlistId]);
    return h(GigModeView, {setlist: sl, songs: songs, events: events, onClose: () => setGigSetlistId(null)});
  }
  if (gigSetlistId && !setlists[gigSetlistId]) {
    setGigSetlistId(null);
  }

  return h("div",{className:"max-w-5xl xl:max-w-6xl mx-auto px-3 sm:px-6 py-4 sm:py-6"},
    sync.conflict && h(ConflictBanner,{conflict:sync.conflict,onResolve:sync.resolveConflict}),
    showSyncPanel && h(SyncPanel,{sync:sync,onClose:()=>setShowSyncPanel(false)}),
    showSettings && h(SettingsModal,{memberProfiles:memberProfiles, mutate:sync.mutate, onClose:()=>setShowSettings(false), binId:binId, state:sync.state, settings:settings, onRestore:(newState)=>sync.mutate(_prev=>newState)}),
    h("header",{className:"mb-4 sm:mb-6"},
      h("div",{className:"flex items-center justify-between gap-3 mb-2 sm:mb-0 sm:items-end sm:flex-wrap"},
        h("div",null,
          h(Wordmark, {className:"h-9 sm:h-14 md:h-16"})
        ),
        h(MemberPicker,{value:member,onChange:setMemberId,profiles:memberProfiles,onSelfClick:()=>setShowSettings(true)})
      ),
      h("div",{className:"tab-nav-wrap mt-3 sm:mt-6"},
        h("nav",{className:"flex items-center border-y-2 border-[var(--line)] overflow-x-auto",style:{WebkitOverflowScrolling:"touch"}},
          [
            {id:"gigs",label:"Gigs"},
            {id:"rehearsals",label:"Rehearsals"},
            {id:"practice",label:"Planner"},
            {id:"songs",label:"Songs"},
            {id:"setlists",label:"Setlists"},
            {id:"equipment",label:"Kit"},
            {id:"feedback",label:"Feedback"}
          ].map(t => h("button",{key:t.id,onClick:()=>setTab(t.id),className:"px-3 sm:px-4 py-2 sm:py-2.5 ticker whitespace-nowrap text-[10px] sm:text-xs " + (tab===t.id?"tab-active":"hover:bg-[var(--acid)]")}, t.label)),
          h("div",{className:"ml-auto pl-2 pr-1 shrink-0 flex items-center gap-1.5"},
            !member && h("button",{onClick:()=>setShowSettings(true),className:"text-base px-1.5 py-0.5 hover:bg-[var(--acid)]/40 rounded",title:"Settings","aria-label":"Settings"},"⚙"),
            h(SyncBadge,{sync:sync,onOpen:()=>setShowSyncPanel(true)})
          )
        )
      )
    ),
    tab==="gigs" && h(TypedScheduleView,{events:events,songs:songs,setlists:setlists,member:member,memberProfiles:memberProfiles,mutate:sync.mutate,eventType:"gig",settings:settings}),
    tab==="rehearsals" && h(TypedScheduleView,{events:events,songs:songs,setlists:setlists,member:member,memberProfiles:memberProfiles,mutate:sync.mutate,eventType:"rehearsal",settings:settings,onStartRehearsal: (id) => setRunRehearsalId(id)}),
    tab==="practice" && h(PracticeView,{practiceAvail:practiceAvail,events:events,member:member,mutate:sync.mutate,onGoToSchedule:()=>setTab("rehearsals")}),
    tab==="songs" && h(SongsView,{songs:songs,events:events,member:member,memberProfiles:memberProfiles,mutate:sync.mutate,settings:settings}),
    tab==="setlists" && h(SetlistsView,{setlists:setlists,songs:songs,events:events,member:member,mutate:sync.mutate,settings:settings,onStartGigMode:(id)=>setGigSetlistId(id)}),
    tab==="equipment" && h(EquipmentView,{equipment:equipment,wishlist:wishlist,member:member,memberProfiles:memberProfiles,mutate:sync.mutate}),
    tab==="feedback" && h(FeedbackView,{feedback:feedback,member:member,memberProfiles:memberProfiles,mutate:sync.mutate}),
    h("footer",{className:"mt-12 pt-6 border-t border-[var(--line)]/30 text-xs text-[var(--ink-soft)] flex justify-between flex-wrap gap-2"},
      h("span",null,"Sourberry ", h("span",{className:"opacity-70"},"v"+APP_VERSION)),
      h("span",{className:"display-italic"},"made with bitter love")
    )
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(h(App, null));

</script>

</body>
</html>
