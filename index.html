  <style>
    :root {
      --bg: #f6f1e7; --bg-card: #fffaf0; --ink: #1a0a14; --ink-soft: #4a2a3a;
      --berry: #b81f5c; --berry-deep: #7a0a35; --acid: #d6f04a; --line: #2a1018;
    }
    html, body { background: var(--bg); color: var(--ink); }
    body {
      font-family: 'Inter Tight', system-ui, sans-serif;
      background-image: radial-gradient(circle at 1px 1px, rgba(26,10,20,0.08) 1px, transparent 0);
      background-size: 22px 22px;
    }
    .display { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
    .display-italic { font-family: 'Fraunces', Georgia, serif; font-style: italic; }
    .wordmark {
      font-family: 'Fraunces', Georgia, serif; font-weight: 800;
      letter-spacing: -0.04em; font-variation-settings: "opsz" 144;
    }
    .ticker { letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; font-size: 0.72rem; }
    .card { background: var(--bg-card); border: 1.5px solid var(--line); box-shadow: 4px 4px 0 var(--line); }
    .card-flat { background: var(--bg-card); border: 1.5px solid var(--line); }
    .btn {
      border: 1.5px solid var(--line); box-shadow: 3px 3px 0 var(--line);
      transition: transform 80ms ease, box-shadow 80ms ease;
    }
    .btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--line); }
    .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--line); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .pill { border: 1.2px solid var(--line); }
    .input {
      background: #fffdf6; border: 1.5px solid var(--line);
      padding: 0.5rem 0.75rem; font-family: 'Inter Tight', sans-serif; width: 100%;
    }
    .input:focus { outline: none; box-shadow: 3px 3px 0 var(--berry); }
    .tab-active { background: var(--ink); color: var(--bg); }
    .berry-bg { background: var(--berry); color: #fff; }
    .acid-bg { background: var(--acid); color: var(--ink); }
    details > summary { cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    @media (max-width: 640px) { .card { box-shadow: 3px 3px 0 var(--line); } }
  </style>

</head>

  const slug = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  const songId = (title, artist) => `s_${slug(title)}__${slug(artist)}`;

  const buildEventsSeed = () => {
    const events = {};
    SEED_EVENTS.forEach((ev, i) => {
      const id = `seed_${i}_${Math.random().toString(36).slice(2,7)}`;
      events[id] = { ...ev, availability: {}, createdAt: Date.now() + i };
    });
    return events;
  };

  const buildSongsSeed = () => {
    const songs = {};
    SEED_SONGS.forEach(([title, artist, status, jamtrax, proposer, learnt, lessonUrl, comments], i) => {
      const id = songId(title, artist);
      songs[id] = {
        title, artist, status,
        jamtrax: !!jamtrax,
        proposer: proposer || "",
        learnt: !!learnt,
        lessonUrl: lessonUrl || "",
        comments: comments || "",
        votes: {},
        createdAt: Date.now() + i,
      };
    });
    return songs;
  };

  const buildSeedState = () => ({
    schemaVersion: 2,
    events: buildEventsSeed(),
    songs: buildSongsSeed(),
  });

  // ---- JSONBin
  const JB_BASE = "https://api.jsonbin.io/v3/b";
  const jbCreateBin = async (apiKey, data) => {
    const res = await fetch(JB_BASE, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": apiKey,
        "X-Bin-Private": "false",
        "X-Bin-Name": "sourberry-band-ops",
      },
      body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error(`Couldn't create database (HTTP ${res.status}): ${await res.text()}`);
    return (await res.json()).metadata?.id;
  };
  const jbReadBin = async (binId) => {
    const res = await fetch(`${JB_BASE}/${binId}/latest`, { headers: { "X-Bin-Meta": "false" } });
    if (!res.ok) throw new Error(`Couldn't read database (HTTP ${res.status}): ${await res.text()}`);
    return await res.json();
  };
  const jbUpdateBin = async (binId, data) => {
    const res = await fetch(`${JB_BASE}/${binId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error(`Couldn't save (HTTP ${res.status}): ${await res.text()}`);
    return await res.json();
  };

    if (!iso) return "";
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  };
  const todayISO = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  };
  const isPast = (iso) => iso < todayISO();
  const sortByDateAsc = (a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime);
  const eventsList = (events) => Object.entries(events || {}).map(([id, ev]) => ({ id, ...ev })).sort(sortByDateAsc);

  const newId = (p="e") => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`;

  // ---- Identity
  const useMemberIdentity = () => {
    const [memberId, setMemberIdState] = useState(() => localStorage.getItem("sourberry.memberId") || null);
    const setMemberId = (id) => {
      setMemberIdState(id);
      if (id) localStorage.setItem("sourberry.memberId", id);
    };
    return [MEMBERS.find(m => m.id === memberId) || null, setMemberId];
  };

  const getBinIdFromURL = () => new URLSearchParams(window.location.search).get("bin");
  const getStoredBinId = () => localStorage.getItem("sourberry.binId");
  const setStoredBinId = (id) => {
    if (id) localStorage.setItem("sourberry.binId", id);
    else localStorage.removeItem("sourberry.binId");
  };

  // ---- Sync
  const POLL_MS = 8000;
  const useSyncedState = (binId) => {
    const [state, setState] = useState(null);
    const [status, setStatus] = useState("loading");
    const [errorMsg, setErrorMsg] = useState("");
    const [lastSyncedAt, setLastSyncedAt] = useState(null);
    const stateRef = useRef(state);
    stateRef.current = state;
    const writeTimerRef = useRef(null);
    const writeInFlightRef = useRef(false);
    const pendingWriteRef = useRef(false);
    const migratedRef = useRef(false);

    const flushWrite = useCallback(async () => {
      if (!binId || writeInFlightRef.current) return;
      writeInFlightRef.current = true;
      pendingWriteRef.current = false;
      setStatus("saving");
      try {
        await jbUpdateBin(binId, stateRef.current);
        setStatus("ok"); setErrorMsg(""); setLastSyncedAt(Date.now());
      } catch (e) {
        setStatus("error"); setErrorMsg(e.message);
      } finally {
        writeInFlightRef.current = false;
        if (pendingWriteRef.current) setTimeout(flushWrite, 100);
      }
    }, [binId]);

    const scheduleWrite = useCallback(() => {
      if (writeTimerRef.current) clearTimeout(writeTimerRef.current);
      if (writeInFlightRef.current) { pendingWriteRef.current = true; return; }
      writeTimerRef.current = setTimeout(flushWrite, 600);
    }, [flushWrite]);

    const mutate = useCallback((updater) => {
      setState(prev => {
        const next = updater(prev || { schemaVersion: 2, events: {}, songs: {} });
        stateRef.current = next;
        return next;
      });
      scheduleWrite();
    }, [scheduleWrite]);

    useEffect(() => {
      if (!binId) return;
      let cancelled = false;
      let pollTimer = null;
      const fetchOnce = async () => {
        if (writeInFlightRef.current) return;
        try {
          let data = await jbReadBin(binId);
          if (cancelled) return;
          if (pendingWriteRef.current || writeTimerRef.current) return;

          // Migrate old data: add songs if missing
          if (!migratedRef.current && (!data.songs || data.schemaVersion < 2)) {
            data = {
              ...data,
              schemaVersion: 2,
              songs: data.songs || buildSongsSeed(),
              events: data.events || {},
            };
            migratedRef.current = true;
            setState(data); stateRef.current = data;
            setStatus("ok"); setErrorMsg(""); setLastSyncedAt(Date.now());
            scheduleWrite();
            return;
          }

          setState(data); stateRef.current = data;
          setStatus("ok"); setErrorMsg(""); setLastSyncedAt(Date.now());
        } catch (e) {
          if (cancelled) return;
          setStatus("error"); setErrorMsg(e.message);
        }
      };
      fetchOnce();
      const tick = () => {
        if (document.visibilityState === "visible") fetchOnce();
        pollTimer = setTimeout(tick, POLL_MS);
      };
      pollTimer = setTimeout(tick, POLL_MS);
      const onVis = () => { if (document.visibilityState === "visible") fetchOnce(); };
      document.addEventListener("visibilitychange", onVis);
      return () => {
        cancelled = true;
        if (pollTimer) clearTimeout(pollTimer);
        document.removeEventListener("visibilitychange", onVis);
      };
    }, [binId, scheduleWrite]);

    return { state, status, errorMsg, lastSyncedAt, mutate };
  };

  // =========================================================================

    const list = showPast ? past : upcoming;
    const setAvailability = (eid, mid, val) => mutate(prev => {
      const events = { ...(prev.events || {}) };
      const ev = { ...(events[eid] || {}) };
      const av = { ...(ev.availability || {}) };
      if (val === null) delete av[mid]; else av[mid] = val;
      ev.availability = av; events[eid] = ev;
      return { ...prev, events };
    });
    const updateEvent = (eid, data) => mutate(prev => ({ ...prev, events: { ...(prev.events||{}), [eid]: { ...(prev.events?.[eid]||{}), ...data } } }));
    const createEvent = (data) => mutate(prev => ({ ...prev, events: { ...(prev.events||{}), [newId("e")]: { ...data, availability: {}, createdAt: Date.now() } } }));

  const SongForm = ({ initial, onSave, onCancel, onDelete }) => {
    const [f, setF] = useState(initial || blankSong());
    const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
    return (
      <div className="card p-5 mb-4">
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <label className="text-sm md:col-span-2"><div className="ticker mb-1">Title</div>
            <input className="input" value={f.title} onChange={e => set("title", e.target.value)} placeholder="Song title" /></label>
          <label className="text-sm md:col-span-2"><div className="ticker mb-1">Artist</div>
            <input className="input" value={f.artist} onChange={e => set("artist", e.target.value)} placeholder="Artist" /></label>
          <label className="text-sm"><div className="ticker mb-1">Status</div>
            <select className="input" value={f.status} onChange={e => set("status", e.target.value)}>
              <option value="candidate">Candidate</option>
              <option value="agreed">Agreed</option>
            </select></label>
          <label className="text-sm"><div className="ticker mb-1">Proposed by</div>
            <input className="input" value={f.proposer} onChange={e => set("proposer", e.target.value)} placeholder="e.g. Veena, or Sourberry" /></label>
          <label className="text-sm flex items-center gap-2 mt-2 md:mt-7">
            <input type="checkbox" checked={!!f.jamtrax} onChange={e => set("jamtrax", e.target.checked)} className="w-4 h-4" />
            <span>Jamtrax available</span></label>
          <label className="text-sm flex items-center gap-2 mt-2 md:mt-7">
            <input type="checkbox" checked={!!f.learnt} onChange={e => set("learnt", e.target.checked)} className="w-4 h-4" />
            <span>Band has learnt it</span></label>
          <label className="text-sm md:col-span-2"><div className="ticker mb-1">Lesson / tab URL</div>
            <input className="input" type="url" value={f.lessonUrl} onChange={e => set("lessonUrl", e.target.value)} placeholder="https://…" /></label>
          <label className="text-sm md:col-span-2"><div className="ticker mb-1">Comments</div>
            <textarea className="input" rows="2" value={f.comments} onChange={e => set("comments", e.target.value)} /></label>
        </div>
        <div className="flex flex-wrap gap-2 mt-4">
          <button onClick={() => onSave(f)} className="btn berry-bg px-4 py-2 font-semibold">Save</button>
          <button onClick={onCancel} className="btn bg-white px-4 py-2">Cancel</button>
          {onDelete && <button onClick={() => { if (confirm("Delete this song?")) onDelete(); }} className="btn bg-white px-4 py-2 ml-auto text-[var(--berry)]">Delete</button>}
        </div>
      </div>
    );
  };

  const VotePill = ({ memberInitial, vote }) => {
    const bg = vote === "yes" ? "#1f8f4a" : vote === "no" ? "#c12c2c" : "transparent";
    const color = vote ? "#fff" : "var(--ink-soft)";
    return (
      <span className="inline-flex items-center justify-center text-xs font-semibold rounded-full border border-[var(--line)]"
            style={{ width: 22, height: 22, background: bg, color }} title={vote || "no vote"}>
        {memberInitial}
      </span>
    );
  };

  const SongCard = ({ song, member, onEdit, onVote, onPromote, onToggleLearnt }) => {
    const isAgreed = song.status === "agreed";
    const yesCount = MEMBERS.filter(m => song.votes?.[m.id] === "yes").length;
    const noCount  = MEMBERS.filter(m => song.votes?.[m.id] === "no").length;
    const allYes = yesCount === MEMBERS.length;
    const myVote = member ? song.votes?.[member.id] : null;

    return (
      <div className="card-flat p-3 sm:p-4">
        <div className="flex items-start gap-3 flex-wrap">
          <div className="flex-1 min-w-0">
            <div className="flex items-baseline gap-2 flex-wrap">
              <span className="display text-lg leading-tight">{song.title || "(untitled)"}</span>
              {song.artist && <span className="text-sm text-[var(--ink-soft)] italic">— {song.artist}</span>}
            </div>
            <div className="flex flex-wrap items-center gap-1.5 mt-1.5">
              {isAgreed && song.learnt && <span className="ticker bg-green-100 px-2 py-0.5">Learnt</span>}
              {isAgreed && !song.learnt && <span className="ticker bg-yellow-100 px-2 py-0.5">Not yet learnt</span>}
              {song.jamtrax && <span className="ticker acid-bg px-2 py-0.5">Jamtrax</span>}
              {song.proposer && <span className="ticker text-[var(--ink-soft)]">prop: {song.proposer}</span>}
              {song.lessonUrl && (
                <a href={song.lessonUrl} target="_blank" rel="noopener" className="ticker text-[var(--berry)] underline">
                  Lesson ↗
                </a>
              )}
            </div>
            {song.comments && (
              <details className="mt-2 text-sm">
                <summary className="ticker text-[var(--ink-soft)] hover:text-[var(--berry)]">Notes ▾</summary>
                <p className="mt-1.5 italic text-[var(--ink-soft)]">{song.comments}</p>
              </details>
            )}
          </div>
          <button onClick={onEdit} className="ticker text-[var(--ink-soft)] hover:text-[var(--berry)] shrink-0">Edit ▸</button>
        </div>

        {/* Action row */}
        {!isAgreed && (
          <div className="mt-3 pt-3 border-t border-[var(--line)]/20 flex flex-wrap items-center gap-3">
            <div className="flex items-center gap-1.5">
              {MEMBERS.map(m => <VotePill key={m.id} memberInitial={m.name[0]} vote={song.votes?.[m.id]} />)}
            </div>
            <span className="text-xs text-[var(--ink-soft)]">
              {yesCount} yes{noCount ? ` · ${noCount} no` : ""}
            </span>

            {member ? (
              <div className="flex gap-1.5 ml-auto">
                <button onClick={() => onVote(song.id, member.id, myVote === "yes" ? null : "yes")}
                  className={"pill px-3 py-1 text-xs font-semibold " + (myVote === "yes" ? "text-white" : "bg-white hover:bg-[var(--acid)]")}
                  style={myVote === "yes" ? { background: "#1f8f4a" } : {}}>✓ Yes</button>
                <button onClick={() => onVote(song.id, member.id, myVote === "no" ? null : "no")}
                  className={"pill px-3 py-1 text-xs font-semibold " + (myVote === "no" ? "text-white" : "bg-white hover:bg-[var(--acid)]")}
                  style={myVote === "no" ? { background: "#c12c2c" } : {}}>✗ No</button>
              </div>
            ) : (
              <span className="ml-auto text-xs italic text-[var(--ink-soft)]">Pick who you are to vote</span>
            )}
            {allYes && (
              <button onClick={() => onPromote(song.id)} className="btn berry-bg px-3 py-1.5 text-xs font-semibold w-full sm:w-auto">
                All in! Promote to agreed →
              </button>
            )}
          </div>
        )}

        {isAgreed && (
          <div className="mt-3 pt-3 border-t border-[var(--line)]/20 flex flex-wrap items-center gap-2">
            <button onClick={() => onToggleLearnt(song.id, !song.learnt)}
              className="pill px-3 py-1 text-xs font-semibold bg-white hover:bg-[var(--acid)]">
              {song.learnt ? "Mark as not yet learnt" : "Mark as learnt"}
            </button>
          </div>
        )}
      </div>
    );
  };

  const SongsView = ({ songs, member, mutate }) => {
    const [editingId, setEditingId] = useState(null);
    const [adding, setAdding] = useState(false);
    const [view, setView] = useState("agreed"); // agreed | candidates
    const [query, setQuery] = useState("");

    const all = songsList(songs);
    const agreed = all.filter(s => s.status === "agreed");
    const candidates = all.filter(s => s.status !== "agreed");

    // Sort: agreed by learnt-then-title; candidates by yes-count desc then title
    agreed.sort((a, b) => {
      if (!!b.learnt - !!a.learnt !== 0) return (b.learnt ? 1 : 0) - (a.learnt ? 1 : 0);
      return (a.title || "").localeCompare(b.title || "");
    });
    candidates.sort((a, b) => {
      const yA = MEMBERS.filter(m => a.votes?.[m.id] === "yes").length;
      const yB = MEMBERS.filter(m => b.votes?.[m.id] === "yes").length;
      if (yA !== yB) return yB - yA;
      return (a.title || "").localeCompare(b.title || "");
    });

    const filt = (list) => {
      const q = query.trim().toLowerCase();
      if (!q) return list;
      return list.filter(s =>
        (s.title || "").toLowerCase().includes(q) ||
        (s.artist || "").toLowerCase().includes(q) ||
        (s.proposer || "").toLowerCase().includes(q)
      );
    };

    const list = filt(view === "agreed" ? agreed : candidates);

    const updateSong = (id, data) => mutate(prev => ({ ...prev, songs: { ...(prev.songs||{}), [id]: { ...(prev.songs?.[id]||{}), ...data } } }));
    const createSong = (data) => mutate(prev => ({ ...prev, songs: { ...(prev.songs||{}), [newId("s")]: { ...data, votes: data.votes || {}, createdAt: Date.now() } } }));
    const deleteSong = (id) => mutate(prev => { const songs = { ...(prev.songs||{}) }; delete songs[id]; return { ...prev, songs }; });
    const voteSong = (id, mid, val) => mutate(prev => {
      const songs = { ...(prev.songs||{}) };
      const s = { ...(songs[id] || {}) };
      const v = { ...(s.votes || {}) };
      if (!val) delete v[mid]; else v[mid] = val;
      s.votes = v; songs[id] = s;
      return { ...prev, songs };
    });
    const promoteSong = (id) => mutate(prev => {
      const songs = { ...(prev.songs||{}) };
      songs[id] = { ...(songs[id]||{}), status: "agreed", votes: {} };
      return { ...prev, songs };
    });
    const toggleLearnt = (id, learnt) => updateSong(id, { learnt });

    const learntCount = agreed.filter(s => s.learnt).length;
    const allInCount  = candidates.filter(c => MEMBERS.every(m => c.votes?.[m.id] === "yes")).length;

    return (
      <div>
        {/* Top bar */}
        <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
          <div className="flex gap-2">
            <button onClick={() => setView("agreed")}
              className={"pill px-3 py-1 text-sm " + (view === "agreed" ? "berry-bg text-white" : "bg-white")}>
              Agreed ({agreed.length})
            </button>
            <button onClick={() => setView("candidates")}
              className={"pill px-3 py-1 text-sm " + (view === "candidates" ? "berry-bg text-white" : "bg-white")}>
              Candidates ({candidates.length}{allInCount ? ` · ${allInCount} ready` : ""})
            </button>
          </div>
          <button onClick={() => { setAdding(true); setEditingId(null); }} className="btn berry-bg px-4 py-2 text-sm font-semibold">+ Add song</button>
        </div>

        {/* Search */}
        <div className="mb-3">
          <input className="input" value={query} onChange={e => setQuery(e.target.value)}
            placeholder={`Search ${view === "agreed" ? "agreed" : "candidate"} songs by title, artist, or proposer…`} />
        </div>

        {/* Banner with summary */}
        <div className="card p-4 mb-4">
          <div className="ticker text-[var(--berry)]">
            {view === "agreed" ? "The set" : "On the table"}
          </div>
          <p className="display text-xl leading-tight mt-1">
            {view === "agreed"
              ? `${learntCount} learnt, ${agreed.length - learntCount} still to learn.`
              : `${candidates.length} candidates · ${allInCount} where everyone said yes.`
            }
          </p>
          {view === "candidates" && (
            <p className="text-xs text-[var(--ink-soft)] mt-1">
              Each member taps ✓ or ✗. When all 4 say yes, anyone can promote it.
            </p>
          )}
        </div>

        {adding && (
          <SongForm
            onSave={(f) => { createSong(f); setAdding(false); }}
            onCancel={() => setAdding(false)}
          />
        )}

        {list.length === 0 && !adding && (
          <div className="card p-6 text-center">
            <p className="display text-xl">{query ? "No matches." : view === "agreed" ? "No agreed songs yet." : "No candidates."}</p>
          </div>
        )}

        <div className="space-y-2.5">
          {list.map(s => editingId === s.id
            ? <SongForm key={s.id} initial={s}
                onSave={f => { updateSong(s.id, f); setEditingId(null); }}
                onCancel={() => setEditingId(null)}
                onDelete={() => { deleteSong(s.id); setEditingId(null); }} />
            : <SongCard key={s.id} song={s} member={member}
                onEdit={() => { setEditingId(s.id); setAdding(false); }}
                onVote={voteSong}
                onPromote={promoteSong}
                onToggleLearnt={toggleLearnt} />
          )}
        </div>
      </div>
    );
  };

  // =========================================================================
  // ROOT
  // =========================================================================
  const App = () => {
    const urlBin = getBinIdFromURL();
    const storedBin = getStoredBinId();
    const [binId, setBinId] = useState(urlBin || storedBin || null);
    const [showShare, setShowShare] = useState(false);
    const [member, setMemberId] = useMemberIdentity();
    const [tab, setTab] = useState("schedule");

    useEffect(() => {
      if (urlBin && urlBin !== storedBin) setStoredBinId(urlBin);
    }, [urlBin, storedBin]);

    const sync = useSyncedState(binId);

    if (!binId) return <SetupScreen onCreated={(id) => {
      setStoredBinId(id);
      const url = new URL(window.location.href);
      url.searchParams.set("bin", id);
      window.history.replaceState({}, "", url.toString());
      setBinId(id); setShowShare(true);
    }} />;
    if (showShare) return <ShareScreen binId={binId} onContinue={() => setShowShare(false)} />;

    if (!sync.state) {
      return (
        <div className="max-w-3xl mx-auto px-4 py-12 text-center">
          <h1 className="wordmark text-5xl mb-3">Sour<span className="display-italic font-medium" style={{color:"var(--berry)"}}>berry</span></h1>
          {sync.status === "error" ? (
            <div className="card p-5 text-left">
              <div className="ticker text-[var(--berry)]">Couldn't load</div>
              <p className="display text-xl mt-1">Something's wrong with the database.</p>
              <p className="text-sm mt-2 text-[var(--ink-soft)]">{sync.errorMsg}</p>
              <button onClick={() => { setStoredBinId(null); setBinId(null); }} className="btn bg-white px-4 py-2 mt-4">Reset and start over</button>
            </div>
          ) : (
            <p className="display-italic text-lg text-[var(--ink-soft)]">Loading the band's data…</p>
          )}
        </div>
      );
    }

    const events = sync.state.events || {};
    const songs = sync.state.songs || {};

    return (
      <div className="max-w-5xl mx-auto px-4 sm:px-6 py-6">
        <header className="mb-6">
          <div className="flex items-end justify-between gap-4 flex-wrap">
            <div>
              <div className="ticker text-[var(--berry)]">Band ops · est. for fun</div>
              <h1 className="wordmark text-6xl sm:text-7xl leading-none mt-1">
                Sour<span className="display-italic font-medium" style={{color:"var(--berry)"}}>berry</span>
              </h1>
            </div>
            <MemberPicker value={member} onChange={setMemberId} />
          </div>

          <nav className="mt-6 flex items-center border-y-2 border-[var(--line)] overflow-x-auto">
            {[
              { id: "schedule",     label: "Schedule" },
              { id: "availability", label: "Availability" },
              { id: "songs",        label: "Songs" },
            ].map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={"px-5 py-2.5 ticker whitespace-nowrap " + (tab === t.id ? "tab-active" : "hover:bg-[var(--acid)]")}>
                {t.label}
              </button>
            ))}
            <div className="ml-auto pr-2 shrink-0">
              <SyncBadge status={sync.status} errorMsg={sync.errorMsg} lastSyncedAt={sync.lastSyncedAt} />
            </div>
          </nav>
        </header>

        {tab === "schedule"     && <ScheduleView     events={events} member={member} mutate={sync.mutate} />}
        {tab === "availability" && <AvailabilityView events={events} member={member} mutate={sync.mutate} />}
        {tab === "songs"        && <SongsView        songs={songs}   member={member} mutate={sync.mutate} />}

        <footer className="mt-12 pt-6 border-t border-[var(--line)]/30 text-xs text-[var(--ink-soft)] flex justify-between flex-wrap gap-2">
          <span>Sourberry · keep the cover band tight</span>
          <span className="display-italic">made with bitter love</span>
        </footer>
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

</body>
</html>
