  <style>
    :root {
      --bg: #f6f1e7; --bg-card: #fffaf0; --ink: #1a0a14; --ink-soft: #4a2a3a;
      --berry: #e93ca3; --berry-deep: #b8217a; --acid: #d1db58; --line: #2a1018;
      --good: #1f8f4a; --rusty: #d97a1f; --learn: #c12c2c;
    }
    html, body { background: var(--bg); color: var(--ink); }
    body { font-family: 'Inter Tight', system-ui, sans-serif;
      background-image: radial-gradient(circle at 1px 1px, rgba(26,10,20,0.08) 1px, transparent 0);
      background-size: 22px 22px; }
    .display { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
    .display-italic { font-family: 'Fraunces', Georgia, serif; font-style: italic; }
    .wordmark { font-family: 'Fraunces', Georgia, serif; font-weight: 800;
      letter-spacing: -0.04em; font-variation-settings: "opsz" 144; }
    .ticker { letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; font-size: 0.72rem; }
    .card { background: var(--bg-card); border: 1.5px solid var(--line); box-shadow: 4px 4px 0 var(--line); }
    .card-flat { background: var(--bg-card); border: 1.5px solid var(--line); }
    .btn { border: 1.5px solid var(--line); box-shadow: 3px 3px 0 var(--line);
      transition: transform 80ms ease, box-shadow 80ms ease; }
    .btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--line); }
    .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--line); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .pill { border: 1.2px solid var(--line); }
    .input { background: #fffdf6; border: 1.5px solid var(--line);
      padding: 0.5rem 0.75rem; font-family: 'Inter Tight', sans-serif; width: 100%; }
    .input:focus { outline: none; box-shadow: 3px 3px 0 var(--berry); }
    .tab-active { background: var(--ink); color: var(--bg); }
    .berry-bg { background: var(--berry); color: #fff; }
    .acid-bg { background: var(--acid); color: var(--ink); }
    details > summary { cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    .tab-nav-wrap { position: relative; }
    .tab-nav-wrap::after {
      content: "";
      position: absolute; top: 0; right: 0; bottom: 0; width: 24px;
      background: linear-gradient(to right, transparent, var(--bg));
      pointer-events: none;
    }
    @media (min-width: 640px) {
      .tab-nav-wrap::after { display: none; }
    }
    @media (max-width: 640px) {
      .card { box-shadow: 3px 3px 0 var(--line); }
      .modal-bg { padding: 0.5rem; }
      body { background-size: 18px 18px; }
    }
    @media (min-width: 1280px) {
      body { background-size: 26px 26px; }
    }
    .modal-bg { position: fixed; inset: 0; background: rgba(26,10,20,0.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .blink { animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0.5; } }
    /* === PRINT STYLES === */
    /* Gig Mode is a full-page route (App early-returns the GigModeView), so when
       the user prints, only Gig Mode is in the DOM. Print rules just need to:
       - strip dotted backgrounds and dark colours for paper
       - hide screen-only chrome (toolbar, .no-print)
       - shrink Gig Mode's huge inline font sizes to A4-friendly values */
    @media print {
      body { background: #fff !important; background-image: none !important; color: #000 !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      a { color: inherit !important; text-decoration: none !important; }
      .card, .card-flat { box-shadow: none !important; border: 1px solid #ccc !important; background: #fff !important; }
      /* Page break controls */
      .page-break-before { page-break-before: always; break-before: page; }
      .avoid-break { page-break-inside: avoid; break-inside: avoid; }
      /* === Gig Mode print isolation ===
         Gig Mode is now a full-page route (App early-returns it), so there's no
         "underneath" — it's the only thing rendering. Print just needs to:
         (a) strip backgrounds/colours for paper
         (b) override Gig Mode's inline display font sizes for A4-friendly type. */
      .gig-print-root { background: #fff !important; color: #000 !important; }
      .gig-print-root h1 { font-size: 22pt !important; color: #000 !important; }
      .gig-print-root h2,
      .gig-print-root .display { font-size: 14pt !important; color: #000 !important; border-color: #000 !important; }
      .gig-print-root ol { font-size: 11pt !important; line-height: 1.45 !important; color: #000 !important; }
      .gig-print-root ol li { color: #000 !important; }
      .gig-print-root ol li span.font-semibold { font-weight: 700 !important; color: #000 !important; }
      .gig-print-root span,
      .gig-print-root div { color: inherit !important; }
      .gig-print-root .text-\\[var\\(--ink-soft\\)\\] { color: #555 !important; }
    }
    @page { margin: 12mm; }
    .print-only { display: none; }
  </style>

const migrate = data => {
  let migrated = false;

    data.wishlist = data.wishlist || {};
    data.schemaVersion = 5; migrated = true;
  }
  if (data.schemaVersion < 6) {
    data.practiceAvail = data.practiceAvail || {};
    data.schemaVersion = 6; migrated = true;
  }
  if (data.schemaVersion < 7) {
    Object.keys(data.songs || {}).forEach(id => {
      const s = data.songs[id];
      if (s.lengthSec === undefined) s.lengthSec = null;
      if (s.album === undefined) s.album = "";

    Object.keys(data.events || {}).forEach(id => {

      if (e.gigNotes === undefined) e.gigNotes = "";
      if (e.actualSetlistId === undefined) e.actualSetlistId = null;
    });
    data.schemaVersion = 7; migrated = true;
  }
  if (data.schemaVersion < 8) {
    Object.keys(data.setlists || {}).forEach(id => {
      const sl = data.setlists[id];
      if (!Array.isArray(sl.sets)) {
        const oldIds = Array.isArray(sl.songIds) ? sl.songIds.slice() : [];
        sl.sets = [{name: "Set 1", songIds: oldIds}];
      }
      if (sl.soundcheckSongId === undefined) sl.soundcheckSongId = null;
      delete sl.songIds;
    });
    data.schemaVersion = 8; migrated = true;
  }
  if (data.schemaVersion < 9) {
    if (!data.memberProfiles || typeof data.memberProfiles !== "object") data.memberProfiles = {};
    Object.keys(data.events || {}).forEach(id => {
      const e = data.events[id];
      if (e.type === "rehearsal") {
        if (!Array.isArray(e.agendaSongIds)) e.agendaSongIds = [];
        if (!Array.isArray(e.playedSongIds)) e.playedSongIds = [];
        if (e.rehearsalNotes === undefined) e.rehearsalNotes = "";
      }
    });
    data.schemaVersion = 9; migrated = true;
  }
  if (data.schemaVersion < 10) {
    // Iteration A.2: conflict detection. Stamp every state with the time
    // it was last saved and who saved it. Old data has no history of saves,
    // so initialise to "now" — first real save will overwrite.
    if (typeof data.updatedAt !== "number") data.updatedAt = Date.now();
    if (typeof data.lastSavedBy !== "string" && data.lastSavedBy !== null) data.lastSavedBy = null;
    data.schemaVersion = 10; migrated = true;
  }
  if (data.schemaVersion < 11) {
    // Iteration B.2: configurable thresholds (stale weeks, setup hours, break min)
    // live in state.settings as a band-shared slice. Old data keeps the defaults.
    if (!data.settings || typeof data.settings !== "object") data.settings = {};
    data.schemaVersion = 11; migrated = true;
  }
  return migrated;
};

// === ITERATION A.1: LOCAL BACKUPS ===
// Per-device snapshots stored in localStorage, scoped per bin.
// Triggered automatically on successful save (throttled), or manually.
// Keeps the most recent BACKUP_MAX_COUNT snapshots.
const BACKUP_KEY_PREFIX = "sourberry.backups.";
const BACKUP_MAX_COUNT = 10;
const BACKUP_THROTTLE_MS = 2 * 60 * 1000; // 2 minutes between automatic snapshots
const getBackupKey = binId => BACKUP_KEY_PREFIX + binId;
const loadBackups = binId => {
  if (!binId) return [];
  try {
    const raw = localStorage.getItem(getBackupKey(binId));
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) { return []; }
};
const writeBackups = (binId, list) => {
  if (!binId) return false;
  try {
    localStorage.setItem(getBackupKey(binId), JSON.stringify(list));
    return true;
  } catch (e) {
    // Likely QuotaExceededError. Try dropping the oldest entry and retrying.
    if (list.length > 1) {
      try {
        const trimmed = list.slice(0, -1);
        localStorage.setItem(getBackupKey(binId), JSON.stringify(trimmed));
        return true;
      } catch (e2) { return false; }
    }
    return false;
  }
};
// saveBackup: creates a new snapshot. Returns the new entry, or null if throttled or failed.
// opts.force=true bypasses the time-based throttle (for manual snapshots).
const saveBackup = (binId, state, opts) => {
  if (!binId || !state) return null;
  opts = opts || {};
  const list = loadBackups(binId);
  if (!opts.force && list.length > 0) {
    const last = list[0];
    if (last && typeof last.timestamp === "number" && (Date.now() - last.timestamp) < BACKUP_THROTTLE_MS) {
      return null; // throttled
    }
  }
  let dataJson;
  try { dataJson = JSON.stringify(state); }
  catch (e) { return null; }
  const entry = {
    timestamp: Date.now(),
    schemaVersion: typeof state.schemaVersion === "number" ? state.schemaVersion : null,
    sizeBytes: dataJson.length,
    dataJson: dataJson
  };
  const next = [entry].concat(list).slice(0, BACKUP_MAX_COUNT);
  return writeBackups(binId, next) ? entry : null;
};
const deleteBackup = (binId, timestamp) => {
  const list = loadBackups(binId).filter(b => b.timestamp !== timestamp);
  return writeBackups(binId, list);
};

// === ICS / iCalendar helpers (Iteration: calendar export) ===
// Generate a single-event or multi-event .ics file that the user can import into
// Apple Calendar, Google Calendar, etc. No external library — iCalendar is just text.
// RFC 5545 has many edge cases (timezones, recurrence, escaping); we cover the
// common ones a band needs (date + start/end time + summary + location + notes).
const icsEscape = (s) => {
  if (!s) return "";
  // Per RFC 5545: escape \ , ; first, then newlines
  return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n").replace(/\r/g, "");
};
// Convert "YYYY-MM-DD" + "HH:MM" → "YYYYMMDDTHHMMSS" (local floating time, no Z).
// Floating time means "this clock time wherever the calendar is read" — fine for a
// band rehearsal which happens at a specific local clock time regardless of timezone.
const icsLocalDateTime = (isoDate, hhmm) => {
  if (!isoDate) return null;
  const d = isoDate.replace(/-/g, "");
  if (!hhmm) return d; // all-day fallback
  const t = hhmm.replace(":", "") + "00";
  return d + "T" + t;
};
// Stable UID: same event id always produces the same UID (good for re-import / update).
const icsUid = (eventId, binId) => {
  const safe = String(eventId || "").replace(/[^a-zA-Z0-9_-]/g, "");
  const ns = String(binId || "anon").replace(/[^a-zA-Z0-9]/g, "");
  return safe + "@" + ns + ".sourberry";
};
// Build the body lines for one VEVENT.
const buildVEvent = (ev, opts) => {
  if (!ev || !ev.date) return null;
  const lines = [];
  const uid = icsUid(ev.id, opts && opts.binId);
  const summary = ((ev.type === "gig" ? "🎤 Gig" : "🎵 Rehearsal") + (ev.title ? (": " + ev.title) : ""));
  const dtstamp = (new Date()).toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  lines.push("BEGIN:VEVENT");
  lines.push("UID:" + uid);
  lines.push("DTSTAMP:" + dtstamp);
  if (ev.startTime) {
    const dtStart = icsLocalDateTime(ev.date, ev.startTime);
    const dtEnd = ev.endTime ? icsLocalDateTime(ev.date, ev.endTime) : icsLocalDateTime(ev.date, ev.startTime); // fallback: zero-length
    lines.push("DTSTART:" + dtStart);
    lines.push("DTEND:" + dtEnd);
  } else {
    // All-day event
    const d = ev.date.replace(/-/g, "");
    // For all-day, end is exclusive next day
    const next = new Date(ev.date + "T12:00:00");
    next.setDate(next.getDate() + 1);
    const nextISO = next.toISOString().slice(0,10).replace(/-/g, "");
    lines.push("DTSTART;VALUE=DATE:" + d);
    lines.push("DTEND;VALUE=DATE:" + nextISO);
  }
  lines.push("SUMMARY:" + icsEscape(summary));
  if (ev.location) lines.push("LOCATION:" + icsEscape(ev.location));
  const descParts = [];
  if (ev.type === "gig" && ev.gigNotes) descParts.push(ev.gigNotes);
  if (ev.type === "rehearsal" && ev.rehearsalNotes) descParts.push(ev.rehearsalNotes);
  if (ev.type === "gig" && ev.bookingMember) descParts.push("Booking: " + ev.bookingMember);
  descParts.push("\\nFrom Sourberry");
  if (descParts.length) lines.push("DESCRIPTION:" + icsEscape(descParts.join("\n")));
  lines.push("END:VEVENT");
  return lines.join("\r\n");
};
// Wrap one or more VEVENT blocks in a full VCALENDAR.
const buildICS = (events, opts) => {
  const list = Array.isArray(events) ? events : [events];
  const blocks = list.map(ev => buildVEvent(ev, opts)).filter(Boolean);
  if (blocks.length === 0) return null;
  return [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Sourberry//EN",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH"
  ].concat(blocks).concat(["END:VCALENDAR"]).join("\r\n");
};

const parseDuration = (str) => {
  if (str == null) return null;
  const s = String(str).trim();
  if (!s) return null;
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  const parts = s.split(":").map(p => p.trim());
  if (parts.some(p => !/^\d+$/.test(p))) return null;
  const nums = parts.map(p => parseInt(p, 10));
  if (nums.length === 2) return nums[0] * 60 + nums[1];
  if (nums.length === 3) return nums[0] * 3600 + nums[1] * 60 + nums[2];
  return null;
};
const formatDuration = (sec) => {
  if (sec == null || sec < 0 || isNaN(sec)) return "";
  const total = Math.round(sec);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  if (h > 0) return h + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  return m + ":" + String(s).padStart(2,"0");
};

  const create = async () => {
    const key = apiKey.trim();
    if (!key) { setErr("Paste your JSONBin API key first."); return; }
    setWorking(true); setErr("");
    try {
      const id = await jbCreateBin(key, buildSeedState());

      h("ol",{className:"text-sm space-y-2 mb-5 pl-5 list-decimal"},

};

const ShareScreen = ({binId, onContinue}) => {
  const [copied, setCopied] = useState(false);
  const url = window.location.origin + window.location.pathname + "?bin=" + binId;
  const copy = async () => {
    try { await navigator.clipboard.writeText(url); setCopied(true); setTimeout(()=>setCopied(false), 2000); }
    catch (e) {
      const ta = document.getElementById("share-url");
      if (ta) { ta.select(); document.execCommand("copy"); setCopied(true); setTimeout(()=>setCopied(false), 2000); }
    }
  };
  return h("div",{className:"max-w-2xl mx-auto px-4 py-8"},
    h("header",{className:"mb-6 flex items-start justify-between gap-3"},
      h("div",null,
        h("div",{className:"ticker text-[var(--berry)]"},"Done!"),
        h(Wordmark, {className:"h-12 sm:h-16 mt-1"})
      ),
      h("button",{onClick:onContinue,className:"btn bg-white px-3 py-1.5 text-sm font-semibold shrink-0",title:"Close","aria-label":"Close"},"× Close")
    ),
    h("div",{className:"card p-5"},
      h("h2",{className:"display text-2xl mb-2"},"Share this URL with the band"),
      h("div",{className:"flex gap-2 items-stretch mt-3"},
        h("input",{id:"share-url",className:"input font-mono text-xs flex-1",readOnly:true,value:url}),
        h("button",{onClick:copy,className:"btn berry-bg px-4 font-semibold whitespace-nowrap"}, copied?"Copied ✓":"Copy")
      ),
      h("button",{onClick:onContinue,className:"btn bg-white px-5 py-2.5 mt-5 font-semibold"},"Open the app →")
    )
  );
};

// Resize uploaded photo to a 200x200 center-cropped JPEG data URL (~10-30KB)
// Reads a file (image) into a data URL. Validates type and size.
const readImageFile = file => new Promise((resolve, reject) => {
  if (!file) return reject(new Error("No file selected"));
  if (!file.type || !file.type.startsWith("image/")) return reject(new Error("That's not an image file"));
  if (file.size > 10*1024*1024) return reject(new Error("Image too large (max 10MB)"));
  const reader = new FileReader();
  reader.onload = ev => resolve(ev.target.result);
  reader.onerror = () => reject(new Error("Couldn't read file"));
  reader.readAsDataURL(file);
});
// Older auto-crop-to-square helper, kept for fallback (centred crop).
const processProfileImage = file => readImageFile(file).then(dataUrl => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => {
    try {
      const target = 200;
      const canvas = document.createElement("canvas");
      canvas.width = target; canvas.height = target;
      const ctx = canvas.getContext("2d");
      const size = Math.min(img.width, img.height);
      const sx = Math.floor((img.width - size) / 2);
      const sy = Math.floor((img.height - size) / 2);
      ctx.drawImage(img, sx, sy, size, size, 0, 0, target, target);
      resolve(canvas.toDataURL("image/jpeg", 0.7));
    } catch(e) { reject(new Error("Couldn't process image")); }
  };
  img.onerror = () => reject(new Error("Couldn't load image"));
  img.src = dataUrl;
}));
// Crop a source data URL to a 200×200 JPEG, given:
//   src: original image data URL
//   imgW, imgH: natural dimensions
//   zoom: scale multiplier (>= 1; image fills viewport at zoom=1)
//   offX, offY: pan offsets in viewport pixels (positive = move image right/down)
//   viewport: viewport size in pixels (e.g. 240)
const cropImageToDataURL = (src, imgW, imgH, zoom, offX, offY, viewport) => new Promise((resolve, reject) => {
  const target = 200;
  const img = new Image();
  img.onload = () => {
    try {
      const canvas = document.createElement("canvas");
      canvas.width = target; canvas.height = target;
      const ctx = canvas.getContext("2d");
      // White background in case of transparency.
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0,0,target,target);
      // The image, when displayed in the viewport, has pixel size: imgW*scale, imgH*scale,
      // where scale = (viewport / min(imgW, imgH)) * zoom (this matches CSS object-fit:cover at zoom=1).
      const baseScale = viewport / Math.min(imgW, imgH);
      const scale = baseScale * zoom;
      const drawnW = imgW * scale, drawnH = imgH * scale;
      // The viewport's top-left in image-pixel coords is the inverse of where the image's top-left
      // sits relative to the viewport's top-left. Image is centred at zoom=1, then offset by (offX, offY).
      // So the image's top-left in viewport coords is: (viewport - drawnW)/2 + offX, (viewport - drawnH)/2 + offY
      const imgTLX = (viewport - drawnW) / 2 + offX;
      const imgTLY = (viewport - drawnH) / 2 + offY;
      // The viewport area corresponds to image coords from -imgTLX/scale .. (-imgTLX + viewport)/scale
      const sx = -imgTLX / scale;
      const sy = -imgTLY / scale;
      const sW = viewport / scale;
      const sH = viewport / scale;
      ctx.drawImage(img, sx, sy, sW, sH, 0, 0, target, target);
      resolve(canvas.toDataURL("image/jpeg", 0.78));
    } catch(e) { reject(new Error("Couldn't crop image")); }
  };
  img.onerror = () => reject(new Error("Couldn't load image"));
  img.src = src;
});

// === PHOTO CROPPER MODAL ===
// Touch-friendly crop UI for profile photos: zoom slider + drag-to-pan.
// At zoom=1 the image fills the round viewport (object-fit:cover style). At higher
// zooms the user can pan to position the crop. Output is a 200×200 JPEG dataUrl.
const PhotoCropper = ({src, onCancel, onConfirm}) => {
  const VIEWPORT = 240;
  const [imgW, setImgW] = useState(0);
  const [imgH, setImgH] = useState(0);
  const [zoom, setZoom] = useState(1);
  const [offX, setOffX] = useState(0);
  const [offY, setOffY] = useState(0);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const dragRef = useRef(null);
  const onImgLoad = e => {
    setImgW(e.target.naturalWidth);
    setImgH(e.target.naturalHeight);
    setZoom(1); setOffX(0); setOffY(0);
  };
  // Pan via pointer events. setPointerCapture so dragging off the image still tracks.
  const onPointerDown = e => {
    e.preventDefault();
    dragRef.current = {sx: e.clientX, sy: e.clientY, sOffX: offX, sOffY: offY};
    try { e.target.setPointerCapture(e.pointerId); } catch(_){}
  };
  const onPointerMove = e => {
    if (!dragRef.current) return;
    e.preventDefault();
    const dx = e.clientX - dragRef.current.sx;
    const dy = e.clientY - dragRef.current.sy;
    setOffX(dragRef.current.sOffX + dx);
    setOffY(dragRef.current.sOffY + dy);
  };
  const onPointerUp = e => {
    dragRef.current = null;
    try { e.target.releasePointerCapture(e.pointerId); } catch(_){}
  };
  const apply = async () => {
    if (!imgW || !imgH) { setError("Image hasn't loaded yet."); return; }
    setBusy(true); setError("");
    try {
      const dataUrl = await cropImageToDataURL(src, imgW, imgH, zoom, offX, offY, VIEWPORT);
      onConfirm(dataUrl);
    } catch (e) {
      setError(e.message || "Couldn't crop");
    } finally {
      setBusy(false);
    }
  };
  // Compute image display style based on zoom + offset.
  const baseScale = (imgW && imgH) ? (VIEWPORT / Math.min(imgW, imgH)) : 1;
  const drawnW = imgW * baseScale * zoom;
  const drawnH = imgH * baseScale * zoom;
  const imgStyle = {
    position: "absolute",
    left: ((VIEWPORT - drawnW) / 2 + offX) + "px",
    top: ((VIEWPORT - drawnH) / 2 + offY) + "px",
    width: drawnW + "px",
    height: drawnH + "px",
    maxWidth: "none",
    touchAction: "none",
    userSelect: "none",
    WebkitUserSelect: "none",
    cursor: dragRef.current ? "grabbing" : "grab"
  };
  return h("div",{className:"modal-bg",onClick:onCancel},
    h("div",{className:"card p-5 max-w-md w-full",onClick:e=>e.stopPropagation()},
      h("h3",{className:"display text-2xl mb-2"},"Position your photo"),
      h("p",{className:"text-xs text-[var(--ink-soft)] mb-3"},"Drag to pan, use the slider to zoom in. The circle is what everyone will see."),
      // Viewport
      h("div",{className:"mx-auto mb-3 relative overflow-hidden rounded-full border-2 border-[var(--berry)]",
        style:{width:VIEWPORT+"px",height:VIEWPORT+"px",background:"#fafafa",touchAction:"none"}},
        src && h("img",{
          src:src, alt:"", draggable:false, onLoad:onImgLoad,
          onPointerDown:onPointerDown, onPointerMove:onPointerMove, onPointerUp:onPointerUp, onPointerCancel:onPointerUp,
          style:imgStyle
        })
      ),
      // Zoom slider
      h("div",{className:"flex items-center gap-2 mb-3"},
        h("span",{className:"ticker text-[var(--ink-soft)] shrink-0"},"Zoom"),
        h("input",{type:"range", min:"1", max:"3", step:"0.05", value: zoom, onChange:e=>setZoom(parseFloat(e.target.value)),
          className:"flex-1", style:{accentColor: "var(--berry)"}}),
        h("span",{className:"text-xs text-[var(--ink-soft)] w-12 text-right shrink-0"}, zoom.toFixed(2) + "×")
      ),
      h("div",{className:"flex items-center gap-2 mb-1"},
        h("button",{onClick:()=>{ setZoom(1); setOffX(0); setOffY(0); },className:"btn bg-white px-2 py-1 text-xs"},"Reset"),
        h("span",{className:"text-xs text-[var(--ink-soft)] italic ml-2"},"Output: 200×200 JPEG")
      ),
      error && h("p",{className:"text-sm text-[var(--berry)] mt-2"}, error),
      h("div",{className:"flex gap-2 mt-4"},
        h("button",{onClick:onCancel,disabled:busy,className:"btn bg-white px-4 py-2 text-sm"},"Cancel"),
        h("button",{onClick:apply,disabled:busy || !imgW,className:"btn berry-bg px-4 py-2 text-sm font-semibold ml-auto"}, busy ? "Saving…" : "Save photo")
      )
    )
  );
};

// === ITERATION A.1: BackupsSection component ===
const BackupsSection = ({binId, state, onRestore}) => {
  const [refreshTick, setRefreshTick] = useState(0);
  const [feedback, setFeedback] = useState("");
  const [error, setError] = useState("");
  const [importing, setImporting] = useState(false);
  const backups = useMemo(() => loadBackups(binId), [binId, refreshTick]);
  const showFlash = (msg) => { setFeedback(msg); setError(""); setTimeout(()=>setFeedback(""), 3000); };
  const showError = (msg) => { setError(msg); setFeedback(""); };
  const onSnapshotNow = () => {
    setError(""); setFeedback("");
    if (!state) { showError("No data to snapshot yet."); return; }
    const entry = saveBackup(binId, state, {force: true});
    if (entry) { setRefreshTick(t => t+1); showFlash("Snapshot saved."); }
    else showError("Couldn't save snapshot. Browser storage may be full.");
  };
  const onDownloadCurrent = () => {
    if (!state) { showError("No data loaded."); return; }
    const fname = "sourberry-current-" + todayISO() + ".json";
    const ok = downloadJSON(fname, state);
    if (ok) showFlash("Download started."); else showError("Download failed.");
  };
  const onDownloadSnapshot = (entry) => {
    try {
      const obj = JSON.parse(entry.dataJson);
      const ts = new Date(entry.timestamp);
      const datePart = ts.getFullYear() + "-" + String(ts.getMonth()+1).padStart(2,"0") + "-" + String(ts.getDate()).padStart(2,"0") + "_" + String(ts.getHours()).padStart(2,"0") + String(ts.getMinutes()).padStart(2,"0");
      const fname = "sourberry-snapshot-" + datePart + ".json";
      const ok = downloadJSON(fname, obj);
      if (ok) showFlash("Download started."); else showError("Download failed.");
    } catch (e) { showError("Couldn't read this snapshot."); }
  };
  const onDelete = (entry) => {
    if (!confirm("Delete this snapshot from this device? (The other snapshots and the live database are unaffected.)")) return;
    deleteBackup(binId, entry.timestamp);
    setRefreshTick(t => t+1);
  };
  const performRestore = (parsedObj, sourceLabel) => {
    // Always force-snapshot the current state first, as a safety net.
    if (state) {
      try { saveBackup(binId, state, {force: true}); } catch (_) {}
    }
    try {
      migrate(parsedObj); // forward-only, idempotent
    } catch (e) {
      showError("Migration of " + sourceLabel + " failed: " + (e.message || "unknown error"));
      return;
    }
    onRestore(parsedObj);
    setRefreshTick(t => t+1);
    showFlash("Restored from " + sourceLabel + ". Saving to the live database…");
  };
  const onRestoreSnapshot = (entry) => {
    const when = fmtBackupTimestamp(entry.timestamp);
    const msg = "Restore band data from " + when + "?\n\n" +
      "This will REPLACE all current band data, including any changes other members have made since then. They'll see the change next time their app refreshes (within 30 seconds).\n\n" +
      "A safety snapshot of the current state will be saved first.";
    if (!confirm(msg)) return;
    let parsed;
    try { parsed = JSON.parse(entry.dataJson); }
    catch (e) { showError("Couldn't read this snapshot."); return; }
    performRestore(parsed, "snapshot of " + when);
  };
  const onImportFile = (file) => {
    setError(""); setFeedback("");
    if (!file) return;
    if (file.size > 25 * 1024 * 1024) { showError("File is too large (max 25MB)."); return; }
    setImporting(true);
    const reader = new FileReader();
    reader.onload = ev => {
      setImporting(false);
      let parsed;
      try { parsed = JSON.parse(ev.target.result); }
      catch (e) { showError("That file isn't valid JSON."); return; }
      const shapeErr = validateBackupShape(parsed);
      if (shapeErr) { showError("That file doesn't look like Sourberry data: " + shapeErr); return; }
      const sv = parsed.schemaVersion;
      const msg = "Restore band data from imported file?\n\n" +
        "Schema version: " + sv + "\n\n" +
        "This will REPLACE all current band data. The other members will see the change within 30 seconds.\n\n" +
        "A safety snapshot of the current state will be saved first.";
      if (!confirm(msg)) return;
      performRestore(parsed, "imported file");
    };
    reader.onerror = () => { setImporting(false); showError("Couldn't read that file."); };
    reader.readAsText(file);
  };
  const totalSize = backups.reduce((sum, b) => sum + (b.sizeBytes || 0), 0);
  return h("div",{className:"mt-5 pt-4 border-t border-[var(--line)]/15"},
    h("div",{className:"ticker text-[var(--berry)] mb-2"},"Local backups"),
    h("p",{className:"text-xs text-[var(--ink-soft)] mb-3"},
      "Snapshots stored ", h("span",{className:"font-semibold"},"only on this device"), " (in this browser's local storage). Saved automatically whenever you change something — max one snapshot every 2 minutes. Each device keeps its own history of up to ", BACKUP_MAX_COUNT, " snapshots. ", h("span",{className:"font-semibold"},"Restoring replaces the band's live data for everyone."), " Use Download to keep a copy off-device."
    ),
    h("div",{className:"flex flex-wrap gap-2 mb-3"},
      h("button",{onClick:onSnapshotNow,className:"btn bg-white px-3 py-1.5 text-xs font-semibold"},"Snapshot now"),
      h("button",{onClick:onDownloadCurrent,className:"btn bg-white px-3 py-1.5 text-xs font-semibold"},"Download current state"),
      h("label",{className:"btn bg-white px-3 py-1.5 text-xs font-semibold cursor-pointer"},
        importing ? "Reading…" : "Import backup file…",
        h("input",{type:"file",accept:"application/json,.json",className:"hidden",disabled:importing,onChange:e=>{ const f=e.target.files && e.target.files[0]; if (f) onImportFile(f); e.target.value=""; }})
      )
    ),
    feedback && h("div",{className:"mb-2 p-2 bg-[var(--good)]/10 border border-[var(--good)]/40 text-xs text-[var(--good)]"}, feedback),
    error && h("div",{className:"mb-2 p-2 bg-[var(--berry)]/10 border border-[var(--berry)]/40 text-xs text-[var(--berry)]"}, error),
    backups.length === 0
      ? h("div",{className:"text-xs text-[var(--ink-soft)] italic"},"No snapshots on this device yet. One will be saved automatically next time you change something. Or tap \"Snapshot now\" above.")
      : h("div",{className:"space-y-1"},
          backups.map(b => h("div",{key:b.timestamp,className:"flex items-center gap-2 py-1.5 border-b border-[var(--line)]/10 last:border-0 text-xs"},
            h("div",{className:"flex-1 min-w-0"},
              h("div",{className:"font-semibold"}, fmtBackupTimestamp(b.timestamp)),
              h("div",{className:"text-[var(--ink-soft)]"},
                "Schema v", b.schemaVersion == null ? "?" : b.schemaVersion, " · ", fmtBackupSize(b.sizeBytes)
              )
            ),
            h("button",{onClick:()=>onDownloadSnapshot(b),className:"btn bg-white px-2 py-1 text-xs",title:"Download as JSON file"},"↓"),
            h("button",{onClick:()=>onRestoreSnapshot(b),className:"btn bg-white px-2 py-1 text-xs font-semibold",title:"Restore this snapshot"},"Restore"),
            h("button",{onClick:()=>onDelete(b),className:"btn bg-white px-2 py-1 text-xs text-[var(--berry)]",title:"Delete from this device"},"×")
          ))
        ),
    backups.length > 0 && h("div",{className:"mt-2 text-xs text-[var(--ink-soft)] italic"},
      backups.length, " snapshot", backups.length===1?"":"s", " · total ", fmtBackupSize(totalSize), " on this device"
    )
  );
};

// === ITERATION A.2: ConflictBanner ===
// Shown at the top of the app when a save (or poll while editing) finds
// that the server has been updated by someone else. The user picks one:
//   • Keep mine — overwrites the other person's save with our local edits.
//   • Use theirs — discards our local edits and accepts the server's data.
// There is no automatic merging — the warning + manual choice IS the safety.
const fmtConflictAge = (ts) => {
  const diff = Math.max(0, Date.now() - ts);
  const sec = Math.round(diff / 1000);
  if (sec < 5) return "just now";
  if (sec < 60) return sec + "s ago";
  const min = Math.round(sec / 60);
  if (min < 60) return min + "m ago";
  const hr = Math.round(min / 60);
  return hr + "h ago";
};
const memberNameById = (id) => {
  if (!id) return "Someone";
  const m = MEMBERS.find(x => x.id === id);
  return m ? m.name : "Someone";
};
const ConflictBanner = ({conflict, onResolve}) => {
  if (!conflict) return null;
  const who = memberNameById(conflict.savedBy);
  const when = fmtConflictAge(conflict.savedAt);
  return h("div",{className:"card p-3 sm:p-4 mb-3",style:{background:"#fef3c7",borderColor:"#fcd34d"}},
    h("div",{className:"flex items-start gap-3 flex-wrap"},
      h("div",{className:"flex-1 min-w-0"},
        h("div",{className:"ticker text-[var(--berry)] mb-1"},"⚠ Heads up — someone else saved"),
        h("div",{className:"text-sm font-semibold"}, who, " saved ", when, "."),
        h("div",{className:"text-xs text-[var(--ink-soft)] mt-0.5"},
          "If you ", h("span",{className:"font-semibold"},"Save anyway"), ", you'll overwrite their changes. If you ", h("span",{className:"font-semibold"},"Use theirs"), ", you'll discard your unsaved edits."
        )
      ),
      h("div",{className:"flex gap-2 shrink-0 mt-1 flex-wrap"},
        h("button",{onClick:()=>onResolve("useTheirs"),className:"btn bg-white px-3 py-1.5 text-xs font-semibold"},"Use theirs"),
        h("button",{onClick:()=>onResolve("keepMine"),className:"btn berry-bg px-3 py-1.5 text-xs font-semibold"},"Save anyway")
      )
    )
  );
};
// === END ConflictBanner ===

// Lives inside SettingsModal. Lets the band tweak shared thresholds. All values
// are stored in state.settings so they sync across devices like other state.
const SettingRow = ({label, description, settingKey, currentValue, defaultValue, unit, min, max, onSave}) => {
  const [draft, setDraft] = useState(String(currentValue));
  // If parent value changes (e.g. another member edited it), update local draft.
  useEffect(() => { setDraft(String(currentValue)); }, [currentValue]);
  const parsed = parseInt(draft, 10);
  const isValid = !isNaN(parsed) && parsed >= min && parsed <= max;
  const dirty = isValid && parsed !== currentValue;
  const isDefault = currentValue === defaultValue;
  return h("div",{className:"py-2 border-b border-[var(--line)]/10 last:border-0"},
    h("div",{className:"text-sm font-semibold"}, label),
    description && h("div",{className:"text-xs text-[var(--ink-soft)] mt-0.5"}, description),
    h("div",{className:"flex items-center gap-2 mt-2 flex-wrap"},
      h("input",{
        type:"number", value:draft, min:min, max:max, step:"1",
        onChange:e=>setDraft(e.target.value),
        className:"input text-sm",
        style:{width:"4.5rem"}
      }),
      h("span",{className:"text-xs text-[var(--ink-soft)]"}, unit),
      !isValid && h("span",{className:"text-xs text-[var(--berry)]"}, "Must be " + min + "–" + max),
      h("div",{className:"ml-auto flex items-center gap-2"},
        isDefault && !dirty && h("span",{className:"text-xs italic text-[var(--ink-soft)]"},"default"),
        dirty && h("button",{onClick:()=>onSave(parsed),className:"btn berry-bg px-3 py-1 text-xs font-semibold"},"Save"),
        !dirty && !isDefault && h("button",{onClick:()=>onSave(defaultValue),className:"btn bg-white px-2 py-1 text-xs",title:"Reset to default ("+defaultValue+" "+unit+")"},"Reset")
      )
    )
  );
};

// Each band member can pick which instrument(s) they play. Multi-select. Stored on
// memberProfiles[memberId].instruments as an array of instrument ids.
const MemberInstrumentsSection = ({memberProfiles, mutate}) => {
  const toggleInstrument = (memberId, instId) => {
    mutate(prev => {
      const profiles = Object.assign({}, prev.memberProfiles || {});
      const cur = Object.assign({}, profiles[memberId] || {});
      const list = Array.isArray(cur.instruments) ? cur.instruments.slice() : [];
      const idx = list.indexOf(instId);
      if (idx >= 0) list.splice(idx, 1); else list.push(instId);
      cur.instruments = list;
      profiles[memberId] = cur;
      return Object.assign({}, prev, {memberProfiles: profiles});
    });
  };
  return h("div",{className:"mt-5 pt-4 border-t border-[var(--line)]/15"},
    h("div",{className:"ticker text-[var(--berry)] mb-2"},"Instruments"),

      MEMBERS.map(m => {
        const cur = (memberProfiles && memberProfiles[m.id] && Array.isArray(memberProfiles[m.id].instruments)) ? memberProfiles[m.id].instruments : [];

const SyncPanel = ({sync, onClose}) => {
  const [retrying, setRetrying] = useState(false);

  };
  const retry = async () => { setRetrying(true); await sync.refresh(); setRetrying(false); };
  const reload = async () => { setRetrying(true); await sync.reloadFromServer(); setRetrying(false); };
  return h("div",{className:"modal-bg",onClick:onClose},
    h("div",{className:"card p-5 max-w-lg w-full",onClick:e=>e.stopPropagation()},

            sync.status==="loading"&&h("span",null,"⟳ Loading…"),
            sync.status==="saving"&&h("span",null,"⟳ Saving…"),

          )
        ),
        h("div",null,
          h("div",{className:"ticker text-[var(--ink-soft)] mb-1"},"Last successful sync"),
          h("div",null, ago!==null ? (ago + " seconds ago") : "Never this session")
        ),
        sync.status==="error" && h(React.Fragment,null,
          h("div",null,
            h("div",{className:"ticker text-[var(--ink-soft)] mb-1"},"What happened"),

            : is404 ? h("p",null,"The database wasn't found. The bin may have been deleted or your URL is wrong.")

const TypedScheduleView = ({events, songs, setlists, member, memberProfiles, mutate, eventType, onStartRehearsal, settings}) => {
  const [editingId, setEditingId] = useState(null);
  const [adding, setAdding] = useState(false);
  const [showPast, setShowPast] = useState(false);
  const all = eventsList(events).filter(e => e.type === eventType);
  const upcoming = all.filter(e => !isPast(e.date));
  const past = all.filter(e => isPast(e.date)).reverse();
  const list = showPast ? past : upcoming;
  const locationSuggestions = uniqueLocations(events);
  // For gigs: precompute pinned setlists keyed by gigEventId so EventCard can warn about un-rehearsed songs.
  const setlistByGig = useMemo(() => {
    const out = {};
    Object.entries(setlists || {}).forEach(([id, sl]) => {
      if (sl && sl.gigEventId) out[sl.gigEventId] = Object.assign({id}, sl);
    });
    return out;
  }, [setlists]);
  const setAvailability = (eid, mid, val) => mutate(prev => {
    const events = Object.assign({}, prev.events||{});
    const ev = Object.assign({}, events[eid]||{});
    const av = Object.assign({}, ev.availability||{});
    if (val === null) delete av[mid]; else av[mid] = val;
    ev.availability = av; events[eid] = ev;
    return Object.assign({}, prev, {events});
  });
  const updateEvent = (eid, data) => {
    mutate(prev => Object.assign({}, prev, {events: Object.assign({}, prev.events||{}, {[eid]: Object.assign({}, (prev.events&&prev.events[eid])||{}, data)})}));
    setEditingId(null);
  };
  const createEvent = data => {
    mutate(prev => Object.assign({}, prev, {events: Object.assign({}, prev.events||{}, {[newId("e")]: Object.assign({}, data, {availability:{}, createdAt: Date.now()})})}));
    setAdding(false);
  };
  const deleteEvent = eid => {
    mutate(prev => { const events = Object.assign({}, prev.events||{}); delete events[eid]; return Object.assign({}, prev, {events}); });
    setEditingId(null);
  };
  const clearAllPast = () => {
    if (past.length === 0) return;
    if (!confirm("Delete " + past.length + " past " + eventType + (past.length===1?"":"s") + "?")) return;
    mutate(prev => { const events = Object.assign({}, prev.events||{}); past.forEach(e => delete events[e.id]); return Object.assign({}, prev, {events}); });
  };
  const addLabel = eventType === "gig" ? "+ Gig" : "+ Rehearsal";
  return h("div",null,
    h("div",{className:"flex items-center justify-between mb-4 flex-wrap gap-2"},
      h("div",{className:"flex gap-2"},
        h("button",{onClick:()=>setShowPast(false),className:"pill px-3 py-1 text-sm " + (!showPast?"berry-bg text-white":"bg-white")},"Upcoming (" + upcoming.length + ")"),
        h("button",{onClick:()=>setShowPast(true),className:"pill px-3 py-1 text-sm " + (showPast?"berry-bg text-white":"bg-white")},"Past (" + past.length + ")")
      ),
      h("button",{onClick:()=>{setAdding(true); setEditingId(null);},className:"btn berry-bg px-3 py-2 text-sm font-semibold"}, addLabel)
    ),
    showPast && past.length>0 && h("div",{className:"card-flat p-3 mb-4 flex items-center justify-between gap-2 flex-wrap"},
      h("span",{className:"text-sm text-[var(--ink-soft)]"},"Tidy up: " + past.length + " past " + eventType + (past.length===1?"":"s") + "."),
      h("button",{onClick:clearAllPast,className:"btn bg-white px-3 py-1.5 text-sm text-[var(--berry)]"},"Delete all past")
    ),
    adding && h(EventForm,{initial: blankEvent(eventType), onSave:createEvent, onCancel:()=>setAdding(false), locationSuggestions:locationSuggestions, songs:songs}),
    list.length===0 && !adding && h("div",{className:"card p-6 text-center"},
      h("p",{className:"display text-xl"}, showPast ? ("No past " + eventType + "s.") : ("No " + eventType + "s in the diary yet.")),
      !showPast && h("p",{className:"text-sm mt-2 text-[var(--ink-soft)]"},"Tap \"" + addLabel + "\" to add one.")
    ),
    h("div",{className:"space-y-3"},
      list.map(ev => editingId===ev.id
        ? h(EventForm,{key:ev.id, initial:ev, onSave: f => updateEvent(ev.id, f), onCancel:()=>setEditingId(null), onDelete:()=>deleteEvent(ev.id), locationSuggestions:locationSuggestions, songs:songs})
        : h(EventCard,{key:ev.id, ev:ev, member:member, memberProfiles:memberProfiles, songs:songs, events:events, pinnedSetlist: setlistByGig[ev.id], settings: settings, onEdit:()=>{setEditingId(ev.id); setAdding(false);}, onSetAvailability:setAvailability, onStartRehearsal: onStartRehearsal, onDelete:()=>{ if(confirm("Delete this past event?")) deleteEvent(ev.id); }})
      )
    )
  );
};

const SongForm = ({initial, onSave, onCancel, onDelete}) => {
  const [f, setF] = useState(initial || blankSong());
  const [durationText, setDurationText] = useState(formatDuration((initial || blankSong()).lengthSec));
  const [durationError, setDurationError] = useState("");
  const [lookupOpen, setLookupOpen] = useState(false);
  const [lookupQuery, setLookupQuery] = useState("");
  const [lookupBusy, setLookupBusy] = useState(false);
  const [lookupResults, setLookupResults] = useState([]);
  const [lookupError, setLookupError] = useState("");
  const set = (k,v) => setF(prev => Object.assign({}, prev, {[k]:v}));
  const handleSave = () => {
    const trimmed = durationText.trim();
    let lengthSec = null;
    if (trimmed) {
      lengthSec = parseDuration(trimmed);
      if (lengthSec == null) { setDurationError("Use M:SS, MM:SS, or seconds"); return; }
    }
    setDurationError("");
    onSave(Object.assign({}, f, {lengthSec}));
  };
  const doLookup = async (overrideQ) => {
    const q = overrideQ != null ? overrideQ : lookupQuery;
    setLookupBusy(true); setLookupError(""); setLookupResults([]);
    try {
      const results = await itunesSearch(q, 5);
      setLookupResults(results);
      if (results.length === 0) setLookupError("No matches.");
    } catch (e) {
      setLookupError("Lookup failed: " + e.message);
    } finally {
      setLookupBusy(false);
    }
  };
  const openLookup = () => {
    const q = ((f.artist||"") + " " + (f.title||"")).trim();
    setLookupQuery(q); setLookupResults([]); setLookupError("");
    setLookupOpen(true);
    if (q) doLookup(q);
  };
  const useResult = (r) => {
    setF(prev => {
      const out = Object.assign({}, prev);
      if (!prev.title && r.title) out.title = r.title;
      if (!prev.artist && r.artist) out.artist = r.artist;
      if (!prev.album && r.album) out.album = r.album;
      if (!prev.year && r.year) out.year = r.year;
      if (!prev.coverArtUrl && r.coverArtUrl) out.coverArtUrl = r.coverArtUrl;
      if (!prev.iTunesUrl && r.iTunesUrl) out.iTunesUrl = r.iTunesUrl;
      return out;
    });
    // Only set duration if currently empty/invalid
    if (r.lengthSec && parseDuration(durationText) == null) {
      setDurationText(formatDuration(r.lengthSec));
      setDurationError("");
    }
    setLookupOpen(false);
  };
  return h("div",{className:"card p-5 mb-4"},
    // Auto-fill panel
    h("div",{className:"mb-4 pb-4 border-b border-[var(--line)]/20"},
      !lookupOpen

            h("div",{className:"flex items-center gap-2 mb-2"},
              h("span",{className:"ticker text-[var(--berry)] flex-1"},"Apple Music search"),
              h("button",{type:"button",onClick:()=>setLookupOpen(false),className:"ticker text-[var(--ink-soft)]"},"Close ✕")
            ),
            h("div",{className:"flex gap-2 mb-2"},
              h("input",{className:"input flex-1",value:lookupQuery,onChange:e=>setLookupQuery(e.target.value),placeholder:"Title and artist…",onKeyDown:e=>{if(e.key==="Enter"){e.preventDefault();doLookup();}}}),
              h("button",{type:"button",onClick:()=>doLookup(),disabled:lookupBusy,className:"btn berry-bg px-3 py-1.5 text-sm font-semibold"}, lookupBusy?"…":"Search")
            ),
            lookupError && h("p",{className:"text-sm italic text-[var(--ink-soft)] mb-2"}, lookupError),
            lookupBusy && h("p",{className:"text-sm italic text-[var(--ink-soft)] mb-2"},"Searching Apple Music…"),
            lookupResults.length > 0 && h("div",{className:"space-y-1.5"},
              lookupResults.map((r, i) => h("button",{
                key:i, type:"button", onClick:()=>useResult(r),
                className:"card-flat p-2 w-full text-left hover:bg-[var(--acid)]/30 flex items-center gap-3"
              },
                r.coverArtUrl && h("img",{src:r.coverArtUrl,alt:"",className:"shrink-0 rounded border border-[var(--line)]/30",style:{width:48,height:48,objectFit:"cover"},onError:e=>{e.target.style.display="none";}}),
                h("div",{className:"flex-1 min-w-0"},
                  h("div",{className:"font-semibold truncate"}, r.title),
                  h("div",{className:"text-xs text-[var(--ink-soft)] italic truncate"}, r.artist),
                  h("div",{className:"text-xs text-[var(--ink-soft)] truncate"}, [r.album, r.year, formatDuration(r.lengthSec)].filter(Boolean).join(" · "))
                ),
                h("span",{className:"ticker text-[var(--berry)] shrink-0"},"Use ▸")
              ))
            ),
            h("p",{className:"text-xs text-[var(--ink-soft)] italic mt-2"},"Tap a result to fill blank fields.")
          )
    ),
    h("div",{className:"grid grid-cols-1 md:grid-cols-2 gap-3"},
      h("label",{className:"text-sm md:col-span-2"}, h("div",{className:"ticker mb-1"},"Title"), h("input",{className:"input",value:f.title,onChange:e=>set("title",e.target.value),placeholder:"Song title"})),
      h("label",{className:"text-sm md:col-span-2"}, h("div",{className:"ticker mb-1"},"Artist"), h("input",{className:"input",value:f.artist,onChange:e=>set("artist",e.target.value),placeholder:"Artist"})),

      h("label",{className:"text-sm"}, h("div",{className:"ticker mb-1"},"Album"), h("input",{className:"input",value:f.album,onChange:e=>set("album",e.target.value),placeholder:"e.g. Back to Black"})),

      h("label",{className:"text-sm"}, h("div",{className:"ticker mb-1"},"Spotify URL"), h("input",{className:"input",type:"url",value:f.spotifyUrl,onChange:e=>set("spotifyUrl",e.target.value),placeholder:"https://open.spotify.com/…"})),
      h("label",{className:"text-sm md:col-span-2 flex items-start gap-2 mt-1"},
        h("input",{type:"checkbox",checked:!!f.jamtrax,onChange:e=>set("jamtrax",e.target.checked),className:"w-4 h-4 mt-0.5"}),
        h("span",null, h("span",{className:"font-semibold"},"Jamtrax available"), h("br",null), h("span",{className:"text-xs text-[var(--ink-soft)]"},"A Jamkazam feature — guided backing tracks for online jamming, useful when not all members can make it."))
      ),
      h("label",{className:"text-sm md:col-span-2"}, h("div",{className:"ticker mb-1"},"Lesson / tab URL"), h("input",{className:"input",type:"url",value:f.lessonUrl,onChange:e=>set("lessonUrl",e.target.value),placeholder:"https://…"})),
      h("label",{className:"text-sm md:col-span-2"}, h("div",{className:"ticker mb-1"},"Comments"), h("textarea",{className:"input",rows:"2",value:f.comments,onChange:e=>set("comments",e.target.value)}))
    ),
    h("div",{className:"flex flex-wrap gap-2 mt-4"},
      h("button",{onClick:handleSave,className:"btn berry-bg px-4 py-2 font-semibold"},"Save"),
      h("button",{onClick:onCancel,className:"btn bg-white px-4 py-2"},"Cancel"),

  );

const SongsView = ({songs, events, member, memberProfiles, mutate, settings}) => {
  const lastRehearsedMap = useMemo(() => buildLastRehearsedMap(events), [events]);
  // Iteration B.2: configurable stale-weeks threshold from band settings.
  const staleWeeks = getSetting(settings, "staleWeeks");
  const [editingId, setEditingId] = useState(null);
  const [adding, setAdding] = useState(false);
  const [view, setView] = useState("repertoire");
  const [query, setQuery] = useState("");
  const [sortMode, setSortMode] = useState("smart");
  const [staleOnly, setStaleOnly] = useState(false); // Iteration B.1: filter Repertoire to stale songs only
  const [bulkOpen, setBulkOpen] = useState(false);
  const [bulkProgress, setBulkProgress] = useState(null); // {current, total, song}
  const [bulkResult, setBulkResult] = useState(null); // {filled, skipped, failed, total, skippedIds}
  // When true, bulk fill operates on every song with title+artist (regardless of whether
  // it already has metadata) and overwrites existing fields. Default false: only blanks get filled.
  const [bulkRefetchAll, setBulkRefetchAll] = useState(false);
  const bulkCancelRef = useRef(false);
  // Iteration: review wizard for songs missing metadata (or skipped from bulk fill).
  // Goes through them one at a time, surfacing top Apple Music candidates so the user
  // can pick the right one or skip without leaving the song list.
  const [reviewOpen, setReviewOpen] = useState(false);
  const [reviewQueue, setReviewQueue] = useState([]); // array of song ids snapshot at start
  const [reviewIndex, setReviewIndex] = useState(0);
  const [reviewQuery, setReviewQuery] = useState("");
  const [reviewBusy, setReviewBusy] = useState(false);
  const [reviewResults, setReviewResults] = useState([]);
  const [reviewError, setReviewError] = useState("");
  const [reviewApplied, setReviewApplied] = useState(0);
  const [reviewSkipped, setReviewSkipped] = useState(0);

  const all = songsList(songs);
  const counts = {}; SONG_STATUSES.forEach(s => { counts[s.id] = all.filter(x => x.status === s.id).length; });
  // Iteration B.1: how many repertoire songs are stale (never or 4+ weeks since last rehearsed).
  const repertoireStaleCount = useMemo(() => all.filter(s => s.status === "repertoire" && isStaleSong(lastRehearsedMap[s.id], staleWeeks)).length, [all, lastRehearsedMap, staleWeeks]);
  // Candidates for bulk fill (default mode: only songs with at least one missing core field).
  const bulkCandidatesMissing = all.filter(s => s.title && s.artist && (!s.lengthSec || !s.coverArtUrl || !s.album || !s.iTunesUrl));
  // Candidates when re-fetching all: every song that has enough info to look up.
  const bulkCandidatesAll = all.filter(s => s.title && s.artist);

  const list = view === "all" ? all.slice() : all.filter(s => s.status === view);
  list.sort((a, b) => {
    if (sortMode === "newest") return (b.createdAt||0) - (a.createdAt||0);
    if (sortMode === "title") return (a.title||"").localeCompare(b.title||"");
    if (view === "suggested") {
      const aNew = isNew(a.createdAt), bNew = isNew(b.createdAt);
      if (aNew && !bNew) return -1;
      if (!aNew && bNew) return 1;
      if (aNew && bNew) return (b.createdAt||0) - (a.createdAt||0);
      const yA = MEMBERS.filter(m => a.votes && a.votes[m.id] === "yes").length;
      const yB = MEMBERS.filter(m => b.votes && b.votes[m.id] === "yes").length;
      if (yA !== yB) return yB - yA;
    }
    return (a.title||"").localeCompare(b.title||"");
  });
  const filtered = list.filter(s => {
    if (!songMatchesQuery(s, query)) return false;
    // Iteration B.1: when on Repertoire with staleOnly, hide non-stale songs.
    if (view === "repertoire" && staleOnly && !isStaleSong(lastRehearsedMap[s.id], staleWeeks)) return false;
    return true;
  });

  const updateSong = (id, data) => mutate(prev => Object.assign({}, prev, {songs: Object.assign({}, prev.songs||{}, {[id]: Object.assign({}, (prev.songs && prev.songs[id])||{}, data)})}));
  const setStatus = (id, status) => updateSong(id, {status});
  const createSong = (data) => { mutate(prev => Object.assign({}, prev, {songs: Object.assign({}, prev.songs||{}, {[newId("s")]: Object.assign({}, data, {votes:{}, practice:{}, createdAt: Date.now()})})})); setAdding(false); };
  const deleteSong = (id) => { mutate(prev => { const songs = Object.assign({}, prev.songs||{}); delete songs[id]; return Object.assign({}, prev, {songs}); }); setEditingId(null); };
  const voteSong = (id, mid, val) => mutate(prev => {
    const songs = Object.assign({}, prev.songs||{});
    const s = Object.assign({}, songs[id]||{});
    const v = Object.assign({}, s.votes||{});
    if (!val) delete v[mid]; else v[mid] = val;
    s.votes = v; songs[id] = s;
    return Object.assign({}, prev, {songs});
  });
  const setPractice = (id, mid, val) => mutate(prev => {
    const songs = Object.assign({}, prev.songs||{});
    const s = Object.assign({}, songs[id]||{});
    const p = Object.assign({}, s.practice||{});
    if (!val) delete p[mid]; else p[mid] = val;
    s.practice = p; songs[id] = s;
    return Object.assign({}, prev, {songs});
  });
  const promoteSong = (id) => mutate(prev => Object.assign({}, prev, {songs: Object.assign({}, prev.songs||{}, {[id]: Object.assign({}, (prev.songs && prev.songs[id])||{}, {status:"shortlist", votes:{}})})}));

  // ---- Bulk fill from Apple Music
  // Two-step: openBulkFill shows a confirmation panel where the user picks the mode;
  // runBulkFill is what actually executes when they tap Start.
  const openBulkFill = () => {
    setBulkResult(null);
    setBulkProgress(null);
    bulkCancelRef.current = false;
    setBulkOpen(true);
  };
  const runBulkFill = async () => {
    bulkCancelRef.current = false;
    const candidates = (bulkRefetchAll ? bulkCandidatesAll : bulkCandidatesMissing).slice();
    if (candidates.length === 0) {
      setBulkResult({filled:0, skipped:0, failed:0, total:0, mode: bulkRefetchAll ? "refetchAll" : "missingOnly"});
      return;
    }
    let filled = 0, skipped = 0, failed = 0;
    const skippedIds = [];
    for (let i = 0; i < candidates.length; i++) {
      if (bulkCancelRef.current) break;
      const song = candidates[i];
      setBulkProgress({current: i+1, total: candidates.length, song: (song.title||"") + (song.artist ? (" · " + song.artist) : "")});
      try {
        const results = await itunesSearch((song.artist||"") + " " + (song.title||""), 1);
        const top = results[0];
        if (!top || !confidenceMatch(song, top)) { skipped++; skippedIds.push(song.id); continue; }
        const updates = {};
        // In missing-only mode, never overwrite existing values.
        // In re-fetch-all mode, overwrite when the API returns a value.
        const writeIf = (key) => {
          const apiVal = top[key];
          if (!apiVal) return;
          if (bulkRefetchAll || !song[key]) updates[key] = apiVal;
        };
        writeIf("lengthSec");
        writeIf("album");
        writeIf("year");
        writeIf("coverArtUrl");
        writeIf("iTunesUrl");
        if (Object.keys(updates).length > 0) { updateSong(song.id, updates); filled++; } else { skipped++; skippedIds.push(song.id); }
      } catch (e) { failed++; }
      await new Promise(r => setTimeout(r, 220));
    }
    setBulkProgress(null);
    setBulkResult({filled, skipped, failed, total: candidates.length, cancelled: bulkCancelRef.current, mode: bulkRefetchAll ? "refetchAll" : "missingOnly", skippedIds: skippedIds});
  };
  const cancelBulk = () => { bulkCancelRef.current = true; };
  const closeBulk = () => { setBulkOpen(false); setBulkProgress(null); setBulkResult(null); };

  // ---- Review wizard for songs missing metadata
  const doReviewSearch = async (q) => {
    setReviewQuery(q);
    setReviewBusy(true); setReviewError(""); setReviewResults([]);
    try {
      const results = await itunesSearch(q, 5);
      setReviewResults(results);
      if (results.length === 0) setReviewError("No matches. Try editing the search above.");
    } catch (e) {
      setReviewError("Search failed: " + e.message);
    } finally {
      setReviewBusy(false);
    }
  };
  const startReview = (songIds) => {
    if (!songIds || songIds.length === 0) return;
    // Snapshot current song data for the queue so even if mutate fires the queue stays stable.
    setReviewQueue(songIds.slice());
    setReviewIndex(0);
    setReviewApplied(0);
    setReviewSkipped(0);
    setReviewOpen(true);
    // Close bulk modal if it was open (so review takes over).
    setBulkOpen(false);
    const firstId = songIds[0];
    const firstSong = songs && songs[firstId];
    if (firstSong) {
      doReviewSearch(((firstSong.artist || "") + " " + (firstSong.title || "")).trim());
    }
  };
  const advanceReview = () => {
    const next = reviewIndex + 1;
    if (next >= reviewQueue.length) {
      setReviewOpen(false);
      return;
    }
    setReviewIndex(next);
    const sid = reviewQueue[next];
    const s = songs && songs[sid];
    if (s) {
      doReviewSearch(((s.artist || "") + " " + (s.title || "")).trim());
    } else {
      setReviewQuery(""); setReviewResults([]); setReviewError("");
    }
  };
  const reviewUseResult = (r) => {
    const sid = reviewQueue[reviewIndex];
    const s = songs && songs[sid];
    if (!s || !r) { advanceReview(); return; }
    const updates = {};
    // In review mode the user is explicitly picking, so overwrite blanks AND existing wrong values.
    // (User can hit the Edit button on the song afterwards if they want to undo.)
    if (r.lengthSec) updates.lengthSec = r.lengthSec;
    if (r.album) updates.album = r.album;
    if (r.year) updates.year = r.year;
    if (r.coverArtUrl) updates.coverArtUrl = r.coverArtUrl;
    if (r.iTunesUrl) updates.iTunesUrl = r.iTunesUrl;
    if (Object.keys(updates).length > 0) {
      updateSong(sid, updates);
      setReviewApplied(n => n + 1);
    }
    advanceReview();
  };
  const reviewSkip = () => {
    setReviewSkipped(n => n + 1);
    advanceReview();
  };
  const reviewClose = () => { setReviewOpen(false); };
  // Songs that currently have title+artist but are missing core metadata — candidates for review.
  const missingMetadataIds = useMemo(() => {
    return all.filter(s => s.title && s.artist && (!s.lengthSec || !s.coverArtUrl || !s.album || !s.iTunesUrl)).map(s => s.id);
  }, [all]);

  const allInSuggested = all.filter(c => c.status==="suggested" && MEMBERS.every(m => c.votes && c.votes[m.id]==="yes")).length;
  const newSuggested = all.filter(c => c.status==="suggested" && isNew(c.createdAt)).length;
  const currentStatus = SONG_STATUSES.find(s => s.id === view);

  return h("div",null,
    // Bulk fill modal
    bulkOpen && h("div",{className:"modal-bg",onClick: bulkProgress ? null : closeBulk},
      h("div",{className:"card p-5 max-w-md w-full",onClick:e=>e.stopPropagation()},

        !bulkProgress && !bulkResult && h(React.Fragment,null,
          h("p",{className:"text-sm text-[var(--ink-soft)] mb-3"},
            "Looks up each song's metadata (length, album, year, cover art, link) on Apple Music."

          h("div",{className:"space-y-2 mb-4"},
            h("label",{className:"flex items-start gap-2 cursor-pointer p-2 rounded border " + (!bulkRefetchAll ? "border-[var(--berry)] bg-[var(--berry)]/5" : "border-[var(--line)]/30")},
              h("input",{type:"radio",name:"bulkMode",checked:!bulkRefetchAll,onChange:()=>setBulkRefetchAll(false),className:"mt-1"}),
              h("div",null,
                h("div",{className:"text-sm font-semibold"},"Fill blanks only ", h("span",{className:"text-xs text-[var(--ink-soft)] font-normal"},"(", bulkCandidatesMissing.length, " song", bulkCandidatesMissing.length===1?"":"s", ")")),
                h("div",{className:"text-xs text-[var(--ink-soft)] mt-0.5"},"Only songs missing details. Existing values are kept.")
              )
            ),
            h("label",{className:"flex items-start gap-2 cursor-pointer p-2 rounded border " + (bulkRefetchAll ? "border-[var(--berry)] bg-[var(--berry)]/5" : "border-[var(--line)]/30")},
              h("input",{type:"radio",name:"bulkMode",checked:bulkRefetchAll,onChange:()=>setBulkRefetchAll(true),className:"mt-1"}),
              h("div",null,
                h("div",{className:"text-sm font-semibold"},"Re-fetch all ", h("span",{className:"text-xs text-[var(--ink-soft)] font-normal"},"(", bulkCandidatesAll.length, " song", bulkCandidatesAll.length===1?"":"s", ")")),
                h("div",{className:"text-xs text-[var(--ink-soft)] mt-0.5"},
                  h("span",{className:"text-[var(--berry)] font-semibold"},"Overwrites"), " existing length, album, year, cover, and link with whatever Apple Music returns. Use if data looks wrong."
                )
              )

          h("p",{className:"text-xs text-[var(--ink-soft)] italic mb-3"},"Songs with no confident match are skipped — you can review them after."),
          h("div",{className:"flex gap-2"},
            h("button",{onClick:closeBulk,className:"btn bg-white px-4 py-2 text-sm"},"Cancel"),
            h("button",{onClick:runBulkFill,className:"btn berry-bg px-4 py-2 text-sm font-semibold ml-auto",disabled: (bulkRefetchAll ? bulkCandidatesAll.length : bulkCandidatesMissing.length) === 0},"Start")

            h("div",null, h("span",{className:"text-[var(--ink-soft)] font-semibold"},"— Skipped: "), bulkResult.skipped, " ", h("span",{className:"text-xs text-[var(--ink-soft)] italic"},"(no confident match)")),
            bulkResult.failed > 0 && h("div",null, h("span",{className:"text-[var(--berry)] font-semibold"},"✗ Failed: "), bulkResult.failed, " ", h("span",{className:"text-xs text-[var(--ink-soft)] italic"},"(network/API error)"))
          ),
          h("p",{className:"text-xs text-[var(--ink-soft)] italic mt-3"},"Skipped songs need manual lookup — open each and tap the Apple Music search button."),
          h("div",{className:"mt-4 flex gap-2 flex-wrap"},

            h("button",{onClick:closeBulk,className:"btn bg-white px-4 py-2 text-sm"},"Close")
          )
        )
      )
    ),

// Inline multi-select picker: chip list of selected songs + native dropdown to add more.
const SongMultiPicker = ({songs, selected, onChange, label, helpText}) => {
  const all = songsList(songs);
  const sortedRemaining = all.filter(s => !selected.includes(s.id))
    .sort((a, b) => (a.title || "").localeCompare(b.title || ""));
  // Iteration C.2: search-as-you-type instead of native select dropdown.
  // Native <select> on iOS becomes a wheel picker — unusable for >20 songs.
  const [query, setQuery] = useState("");
  const [focused, setFocused] = useState(false);
  // C.2 polish: keyboard navigation in the dropdown (ArrowUp/Down/Enter/Escape).
  // Useful with iPad bluetooth keyboards.
  const [highlightIdx, setHighlightIdx] = useState(0);
  useEffect(() => { setHighlightIdx(0); }, [query]);
  const matches = sortedRemaining.filter(s => songMatchesQuery(s, query));
  const visible = matches.slice(0, 8); // cap to keep UI tight
  const showResults = focused && (query.length > 0 || matches.length > 0);
  const addSong = (sid) => {
    onChange(selected.concat([sid]));
    setQuery("");
    setHighlightIdx(0);
  };
  const onKeyDown = (e) => {
    if (e.key === "Escape") {
      if (query) { e.preventDefault(); setQuery(""); }
      return;
    }
    if (visible.length === 0) return;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      setHighlightIdx(i => Math.min(i + 1, visible.length - 1));
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      setHighlightIdx(i => Math.max(0, i - 1));
    } else if (e.key === "Enter") {
      e.preventDefault();
      const target = visible[Math.max(0, Math.min(highlightIdx, visible.length - 1))];
      if (target) addSong(target.id);
    }
  };
  return h("div",{className:"text-sm md:col-span-2"},
    h("div",{className:"ticker mb-1"}, label + (selected.length > 0 ? (" (" + selected.length + ")") : "")),
    selected.length > 0 && h("ol",{className:"mb-2 space-y-1",style:{listStyle:"none",paddingLeft:0}},
      selected.map((sid, i) => {
        const s = songs && songs[sid];
        const onRemove = () => onChange(selected.filter(x => x !== sid));
        const moveUp = () => {
          if (i === 0) return;
          const next = selected.slice();
          next.splice(i - 1, 0, next.splice(i, 1)[0]);
          onChange(next);
        };
        const moveDown = () => {
          if (i === selected.length - 1) return;
          const next = selected.slice();
          next.splice(i + 1, 0, next.splice(i, 1)[0]);
          onChange(next);
        };
        const inner = !s
          ? h(React.Fragment,null,
              h("span",{className:"flex-1 italic text-[var(--ink-soft)] truncate"},"(deleted)")
            )
          : h(React.Fragment,null,
              h("span",{className:"flex-1 truncate"},
                h("span",null, s.title || "(untitled)"),
                s.artist && h("span",{className:"text-[var(--ink-soft)] italic"}, " — ", s.artist)
              )
            );
        return h("li",{key:sid, className:"card-flat p-1.5 flex items-center gap-1.5 text-xs"},
          h("span",{className:"text-[var(--ink-soft)] w-5 text-right shrink-0"}, (i+1) + "."),
          inner,
          h("button",{type:"button",onClick:moveUp,disabled:i===0,className:"pill px-1.5 py-0.5 text-xs bg-white disabled:opacity-30",title:"Move up","aria-label":"Move up"},"↑"),
          h("button",{type:"button",onClick:moveDown,disabled:i===selected.length-1,className:"pill px-1.5 py-0.5 text-xs bg-white disabled:opacity-30",title:"Move down","aria-label":"Move down"},"↓"),
          h("button",{type:"button",onClick:onRemove,className:"pill px-1.5 py-0.5 text-xs bg-white text-[var(--berry)] font-bold",title:"Remove","aria-label":"Remove"},"×")
        );
      })
    ),
    sortedRemaining.length > 0
      ? h("div",{className:"relative"},
          h("input",{
            type:"text",
            className:"input text-sm",
            value: query,
            placeholder: "Search to add a song… (" + sortedRemaining.length + " available)",
            onChange: e => setQuery(e.target.value),
            onFocus: () => setFocused(true),
            onKeyDown: onKeyDown,
            // Delay blur so a tap on a result registers as click first.
            onBlur: () => setTimeout(() => setFocused(false), 150)
          }),
          showResults && h("div",{className:"absolute left-0 right-0 mt-1 card bg-white shadow-md z-10 max-h-64 overflow-y-auto",style:{borderColor:"var(--line)"}},
            visible.length === 0
              ? h("div",{className:"p-2 text-xs italic text-[var(--ink-soft)]"}, "No matches.")
              : visible.map((s, i) => h("button",{
                  key: s.id,
                  type: "button",
                  // onMouseDown fires before onBlur, so the result tap doesn't lose focus first.
                  onMouseDown: e => { e.preventDefault(); addSong(s.id); },
                  onClick: e => e.preventDefault(),
                  onMouseEnter: () => setHighlightIdx(i),
                  className: "w-full text-left px-2.5 py-2 border-b border-[var(--line)]/10 last:border-0 " + (i === highlightIdx ? "bg-[var(--acid)]/40" : "hover:bg-[var(--acid)]/30")
                },
                  h("div",{className:"flex items-baseline gap-2"},
                    h("span",{className:"font-semibold truncate"}, s.title || "(untitled)"),
                    s.artist && h("span",{className:"text-xs text-[var(--ink-soft)] italic truncate"}, "— " + s.artist),
                    h("span",{className:"ticker text-[var(--ink-soft)] text-[10px] ml-auto shrink-0"}, ((SONG_STATUSES.find(x => x.id === s.status) || {}).label || s.status || ""))
                  )
                )),
            matches.length > visible.length && h("div",{className:"p-2 text-xs italic text-[var(--ink-soft)] border-t border-[var(--line)]/10"},
              "+ ", matches.length - visible.length, " more — keep typing to narrow"
            )
          )
        )
      : h("div",{className:"text-xs italic text-[var(--ink-soft)]"},"No more songs to add."),
    helpText && h("div",{className:"text-xs text-[var(--ink-soft)] italic mt-1"}, helpText)
  );
};

// Full-screen, large-type setlist display for use during the show. Auto-fits all the songs
// to one screen by default; manual font slider as escape hatch. Hides everything else.
const GigModeView = ({setlist, songs, events, onClose}) => {
  const [fontPx, setFontPx] = useState(28);
  const [autoFit, setAutoFit] = useState(true);
  const containerRef = useRef(null);
  const sets = setlist.sets || [];
  const pinnedGig = setlist.gigEventId && events ? events[setlist.gigEventId] : null;
  // Auto-fit: estimate font size from row count and viewport height. Not pixel-perfect
  // (we can't measure mid-render), but good enough for typical 4-set / 30-song setlists.
  useEffect(() => {
    if (!autoFit) return;
    const fit = () => {
      const vh = window.innerHeight - 60; // toolbar + small margin
      // Rough px-per-row including line-height ≈ size * 1.4. Title takes ~size * 1.8.
      // Each set adds a header at size * 1.05.
      const songRows = sets.reduce((acc, s) => acc + (s.songIds || []).length, 0);
      const setHeaders = sets.length;
      // size * 1.4 * songRows + size * 1.05 * setHeaders + size * 1.8 (title) ≤ vh
      const denom = 1.4 * songRows + 1.05 * setHeaders + 1.8 + 1.0; // +1 for the meta line
      const target = Math.floor(vh / Math.max(denom, 5));
      setFontPx(Math.max(16, Math.min(64, target)));
    };
    fit();
    const onResize = () => fit();
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, [autoFit, sets]);
  // ESC to exit
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  // Iteration D.1 (rebuild): Gig Mode is now a full-page route at App level —
  // App early-returns this component, so there is no underlying app to bleed through.
  // Plain block layout, no fixed-position overlay needed.
  return h("div",{
    ref:containerRef,
    className:"gig-print-root",
    style:{
      minHeight:"100vh",
      background:"var(--cream)",
      color:"var(--ink)"
    }
  },
    h("div",{className:"max-w-5xl mx-auto p-4 sm:p-6"},
      // Toolbar — small, doesn't compete with content. Hidden when printing.
      h("div",{className:"no-print flex items-center gap-2 mb-3 flex-wrap"},
        h("button",{onClick:onClose,className:"btn bg-white px-3 py-1.5 text-sm font-semibold"},"× Exit"),
        h("button",{onClick:()=>{ try { window.print(); } catch(_){} },className:"btn bg-white px-3 py-1.5 text-sm"},"🖨 Print"),
        h("div",{className:"flex items-center gap-1.5 ml-auto"},
          h("label",{className:"flex items-center gap-1 text-xs"},
            h("input",{type:"checkbox",checked:autoFit,onChange:e=>setAutoFit(e.target.checked)}),
            h("span",null,"Auto-fit")
          ),
          !autoFit && h(React.Fragment,null,
            h("button",{onClick:()=>setFontPx(p => Math.max(14, p - 2)),className:"pill bg-white px-2 py-0.5 text-xs"},"A−"),
            h("span",{className:"text-xs w-10 text-center"}, fontPx + "px"),
            h("button",{onClick:()=>setFontPx(p => Math.min(96, p + 2)),className:"pill bg-white px-2 py-0.5 text-xs"},"A+")
          )
        )
      ),
      // Title + meta
      h("div",{className:"mb-2"},
        h("h1",{className:"display leading-tight",style:{fontSize: Math.round(fontPx * 1.6) + "px"}}, setlist.name),
        pinnedGig && h("div",{className:"text-[var(--ink-soft)] mt-1",style:{fontSize: Math.round(fontPx * 0.55) + "px"}},
          fmtDate(pinnedGig.date), pinnedGig.title ? (" · " + pinnedGig.title) : "", pinnedGig.location ? (" · " + pinnedGig.location) : ""
        )
      ),
      // Sets
      h("div",{className:"mt-3"},
        sets.length === 0 ? h("p",{className:"italic"},"Empty setlist.") : sets.map((set, si) => {
          const songIds = set.songIds || [];
          const setName = set.name || ("Set " + (si+1));
          return h("div",{key:si, className:"mb-4"},
            h("div",{className:"display border-b-2 border-[var(--berry)] pb-1 mb-1",style:{fontSize: Math.round(fontPx * 1.05) + "px",color:"var(--berry)"}}, setName),
            songIds.length === 0
              ? h("div",{className:"italic text-[var(--ink-soft)]",style:{fontSize: Math.round(fontPx * 0.7) + "px"}},"(no songs)")
              : h("ol",{className:"list-decimal pl-8 sm:pl-12",style:{fontSize: fontPx + "px",lineHeight:1.4}},
                  songIds.map((sid, i) => {
                    const s = songs && songs[sid];
                    if (!s) return h("li",{key:"d-"+i,className:"italic text-[var(--ink-soft)]"},"(deleted)");
                    return h("li",{key:sid,className:"break-words"},
                      h("span",{className:"font-semibold"}, s.title || "(untitled)"),
                      s.artist && h("span",{className:"text-[var(--ink-soft)] italic ml-2",style:{fontSize:"0.75em"}}, "— " + s.artist)
                    );
                  })
                )
          );
        })
      )
    )
  );
};
