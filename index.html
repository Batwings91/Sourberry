    :root {
      --bg: #f6f1e7; --bg-card: #fffaf0; --ink: #1a0a14; --ink-soft: #4a2a3a;
      --berry: #b81f5c; --berry-deep: #7a0a35; --acid: #d6f04a; --line: #2a1018;
      --good: #1f8f4a; --rusty: #d97a1f; --learn: #c12c2c;
    }
    html, body { background: var(--bg); color: var(--ink); }
    body {
      font-family: 'Inter Tight', system-ui, sans-serif;
      background-image: radial-gradient(circle at 1px 1px, rgba(26,10,20,0.08) 1px, transparent 0);
      background-size: 22px 22px;
    }
    .display { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
    .display-italic { font-family: 'Fraunces', Georgia, serif; font-style: italic; }
    .wordmark { font-family: 'Fraunces', Georgia, serif; font-weight: 800;
      letter-spacing: -0.04em; font-variation-settings: "opsz" 144; }
    .ticker { letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; font-size: 0.72rem; }
    .card { background: var(--bg-card); border: 1.5px solid var(--line); box-shadow: 4px 4px 0 var(--line); }
    .card-flat { background: var(--bg-card); border: 1.5px solid var(--line); }
    .btn { border: 1.5px solid var(--line); box-shadow: 3px 3px 0 var(--line);
      transition: transform 80ms ease, box-shadow 80ms ease; }
    .btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--line); }
    .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--line); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .pill { border: 1.2px solid var(--line); }
    .input { background: #fffdf6; border: 1.5px solid var(--line);
      padding: 0.5rem 0.75rem; font-family: 'Inter Tight', sans-serif; width: 100%; }
    .input:focus { outline: none; box-shadow: 3px 3px 0 var(--berry); }
    .tab-active { background: var(--ink); color: var(--bg); }
    .berry-bg { background: var(--berry); color: #fff; }
    .acid-bg { background: var(--acid); color: var(--ink); }
    details > summary { cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    @media (max-width: 640px) { .card { box-shadow: 3px 3px 0 var(--line); } }
  </style>

  const slug = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  const songId = (title, artist) => `s_${slug(title)}__${slug(artist)}`;

  const buildEventsSeed = () => {
    const events = {};
    SEED_EVENTS.forEach((ev, i) => {
      const id = `seed_${i}_${Math.random().toString(36).slice(2,7)}`;
      events[id] = { ...ev, availability: {}, createdAt: Date.now() + i };
    });
    return events;
  };
  const buildSongsSeed = () => {
    const songs = {};
    SEED_SONGS.forEach(([title, artist, status, jamtrax, proposer, lessonUrl, comments], i) => {
      const id = songId(title, artist);
      songs[id] = {
        title, artist, status,
        jamtrax: !!jamtrax, proposer: proposer || "",
        lessonUrl: lessonUrl || "", comments: comments || "",
        votes: {}, practice: {},
        createdAt: Date.now() + i,
      };
    });
    return songs;
  };
  const buildSeedState = () => ({
    schemaVersion: 3,
    events: buildEventsSeed(),
    songs: buildSongsSeed(),
    setlists: {},
  });

  const migrate = (data) => {
    let migrated = false;
    const sv = data.schemaVersion || 1;
    if (sv < 2 || !data.songs) {
      data.songs = data.songs || buildSongsSeed();
      data.schemaVersion = 2;
      migrated = true;
    }
    if (data.schemaVersion < 3) {
      Object.keys(data.songs || {}).forEach(id => {
        const s = data.songs[id];
        if (s.status === "agreed") {
          s.status = s.learnt ? "repertoire" : "shortlist";
        } else if (s.status === "candidate") {
          s.status = "suggested";
        }
        delete s.learnt;
        s.practice = s.practice || {};
        s.votes = s.votes || {};
      });
      Object.keys(data.events || {}).forEach(id => {
        const e = data.events[id];
        if (!e.venueType) {
          e.venueType = (e.location && /remote/i.test(e.location)) ? "virtual" : "in-person";
        }
      });
      data.setlists = data.setlists || {};
      data.schemaVersion = 3;
      migrated = true;
    }
    return migrated;
  };

  const JB_BASE = "https://api.jsonbin.io/v3/b";
  const jbCreateBin = async (apiKey, data) => {
    const res = await fetch(JB_BASE, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Master-Key": apiKey, "X-Bin-Private": "false", "X-Bin-Name": "sourberry-band-ops" },
      body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error(`Couldn't create database (HTTP ${res.status}): ${await res.text()}`);
    return (await res.json()).metadata?.id;
  };
  const jbReadBin = async (binId) => {
    const res = await fetch(`${JB_BASE}/${binId}/latest`, { headers: { "X-Bin-Meta": "false" } });
    if (!res.ok) throw new Error(`Couldn't read database (HTTP ${res.status}): ${await res.text()}`);
    return await res.json();
  };
  const jbUpdateBin = async (binId, data) => {
    const res = await fetch(`${JB_BASE}/${binId}`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error(`Couldn't save (HTTP ${res.status}): ${await res.text()}`);
    return await res.json();
  };

  const fmtDate = (iso) => {

  };
  const isPast = (iso) => iso < todayISO();
  const sortByDateAsc = (a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime);
  const eventsList = (events) => Object.entries(events || {}).map(([id, ev]) => ({ id, ...ev })).sort(sortByDateAsc);
  const songsList = (songs) => Object.entries(songs || {}).map(([id, s]) => ({ id, ...s }));
  const setlistsList = (sls) => Object.entries(sls || {}).map(([id, s]) => ({ id, ...s }));
  const newId = (p="x") => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`;

  const POLL_MS = 8000;
  const useSyncedState = (binId) => {
    const [state, setState] = useState(null);
    const [status, setStatus] = useState("loading");
    const [errorMsg, setErrorMsg] = useState("");
    const [lastSyncedAt, setLastSyncedAt] = useState(null);
    const stateRef = useRef(state); stateRef.current = state;
    const writeTimerRef = useRef(null);
    const writeInFlightRef = useRef(false);
    const pendingWriteRef = useRef(false);

    const flushWrite = useCallback(async () => {
      if (!binId || writeInFlightRef.current) return;
      writeInFlightRef.current = true;
      pendingWriteRef.current = false;
      setStatus("saving");
      try {
        await jbUpdateBin(binId, stateRef.current);
        setStatus("ok"); setErrorMsg(""); setLastSyncedAt(Date.now());
      } catch (e) {
        setStatus("error"); setErrorMsg(e.message);
      } finally {
        writeInFlightRef.current = false;
        if (pendingWriteRef.current) setTimeout(flushWrite, 100);
      }
    }, [binId]);

    const scheduleWrite = useCallback(() => {
      if (writeTimerRef.current) clearTimeout(writeTimerRef.current);
      if (writeInFlightRef.current) { pendingWriteRef.current = true; return; }
      writeTimerRef.current = setTimeout(flushWrite, 600);
    }, [flushWrite]);

    const mutate = useCallback((updater) => {
      setState(prev => {
        const next = updater(prev || { schemaVersion: 3, events: {}, songs: {}, setlists: {} });
        stateRef.current = next;
        return next;
      });
      scheduleWrite();
    }, [scheduleWrite]);

    useEffect(() => {
      if (!binId) return;
      let cancelled = false;
      let pollTimer = null;
      const fetchOnce = async () => {
        if (writeInFlightRef.current) return;
        try {
          let data = await jbReadBin(binId);
          if (cancelled) return;
          if (pendingWriteRef.current || writeTimerRef.current) return;
          const didMigrate = migrate(data);
          setState(data); stateRef.current = data;
          setStatus("ok"); setErrorMsg(""); setLastSyncedAt(Date.now());
          if (didMigrate) scheduleWrite();
        } catch (e) {
          if (cancelled) return;
          setStatus("error"); setErrorMsg(e.message);
        }
      };
      fetchOnce();
      const tick = () => {
        if (document.visibilityState === "visible") fetchOnce();
        pollTimer = setTimeout(tick, POLL_MS);
      };
      pollTimer = setTimeout(tick, POLL_MS);
      const onVis = () => { if (document.visibilityState === "visible") fetchOnce(); };
      document.addEventListener("visibilitychange", onVis);
      return () => {
        cancelled = true;
        if (pollTimer) clearTimeout(pollTimer);
        document.removeEventListener("visibilitychange", onVis);
      };
    }, [binId, scheduleWrite]);

    return { state, status, errorMsg, lastSyncedAt, mutate };
  };

                    <div className="font-semibold">{fmtDate(ev.date)}</div>
                    <div className="text-xs text-[var(--ink-soft)] mt-0.5"><TypeBadge type={ev.type} status={ev.status} /> {ev.venueType === "virtual" ? "(virtual) " : ""}{ev.title}</div>
                  </td>
                  <td className="px-3 py-2.5 text-xs text-[var(--ink-soft)] align-top">
                    <div>{ev.startTime}–{ev.endTime}</div>{ev.location && <div>{ev.location}</div>}
                  </td>
                  {MEMBERS.map(m => {
                    const isMe = member?.id === m.id;
                    const cur = ev.availability?.[m.id];
                    return (
                      <td key={m.id} className="px-2 py-2.5 text-center align-top">
                        {isMe ? (
                          <select value={cur || ""} onChange={e => setAvailability(ev.id, m.id, e.target.value || null)}
                            className="input text-xs py-1 px-1 text-center" style={{ minWidth: 70 }}>
                            <option value="">—</option><option value="yes">Yes</option><option value="maybe">Maybe</option><option value="no">No</option>
                          </select>
                        ) : (
                          <div className="flex items-center justify-center gap-1"><StatusDot status={cur} /><span className="text-xs">{cur ? cur[0].toUpperCase() : "—"}</span></div>
                        )}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    );
  };

  const blankSong = () => ({
    title: "", artist: "", status: "suggested",
    jamtrax: false, proposer: "", lessonUrl: "", comments: "",
    votes: {}, practice: {},
  });

  const SongForm = ({ initial, onSave, onCancel, onDelete }) => {
    const [f, setF] = useState(initial || blankSong());
    const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
    return (
      <div className="card p-5 mb-4">
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <label className="text-sm md:col-span-2"><div className="ticker mb-1">Title</div>
            <input className="input" value={f.title} onChange={e => set("title", e.target.value)} placeholder="Song title" /></label>
          <label className="text-sm md:col-span-2"><div className="ticker mb-1">Artist</div>
            <input className="input" value={f.artist} onChange={e => set("artist", e.target.value)} placeholder="Artist" /></label>
          <label className="text-sm"><div className="ticker mb-1">Status</div>
            <select className="input" value={f.status} onChange={e => set("status", e.target.value)}>
              {SONG_STATUSES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
            </select></label>
          <label className="text-sm"><div className="ticker mb-1">Proposed by</div>
            <input className="input" value={f.proposer} onChange={e => set("proposer", e.target.value)} placeholder="e.g. Veena, Sourberry" /></label>
          <label className="text-sm flex items-center gap-2 mt-2 md:mt-7">
            <input type="checkbox" checked={!!f.jamtrax} onChange={e => set("jamtrax", e.target.checked)} className="w-4 h-4" />
            <span>Jamtrax available</span></label>
          <div></div>
          <label className="text-sm md:col-span-2"><div className="ticker mb-1">Lesson / tab URL</div>
            <input className="input" type="url" value={f.lessonUrl} onChange={e => set("lessonUrl", e.target.value)} placeholder="https://…" /></label>
          <label className="text-sm md:col-span-2"><div className="ticker mb-1">Comments</div>
            <textarea className="input" rows="2" value={f.comments} onChange={e => set("comments", e.target.value)} /></label>
        </div>
        <div className="flex flex-wrap gap-2 mt-4">
          <button onClick={() => onSave(f)} className="btn berry-bg px-4 py-2 font-semibold">Save</button>
          <button onClick={onCancel} className="btn bg-white px-4 py-2">Cancel</button>
          {onDelete && <button onClick={() => { if (confirm("Delete this song?")) onDelete(); }} className="btn bg-white px-4 py-2 ml-auto text-[var(--berry)]">Delete</button>}
        </div>
      </div>
    );
  };

  const VotePill = ({ initial, vote }) => {
    const bg = vote === "yes" ? "var(--good)" : vote === "no" ? "var(--learn)" : "transparent";
    const color = vote ? "#fff" : "var(--ink-soft)";
    return (
      <span className="inline-flex items-center justify-center text-xs font-semibold rounded-full border border-[var(--line)]"
            style={{ width: 22, height: 22, background: bg, color }} title={vote || "no vote"}>{initial}</span>
    );
  };

  const PracticeChip = ({ initial, state, isMe, onClick }) => {
    const bg = state ? PRACTICE_COLOR[state] : "transparent";
    const color = state ? "#fff" : "var(--ink-soft)";
    return (
      <button onClick={isMe ? onClick : undefined} disabled={!isMe}
        title={state ? `${initial}: ${PRACTICE_LABEL[state]}` : `${initial}: not set`}
        className="inline-flex items-center justify-center text-xs font-semibold rounded-full border border-[var(--line)]"
        style={{ width: 26, height: 26, background: bg, color, cursor: isMe ? "pointer" : "default" }}>
        {initial}
      </button>
    );
  };

  const cyclePractice = (current) => {
    if (current === "good") return "rusty";
    if (current === "rusty") return "learn";
    if (current === "learn") return null;
    return "good";
  };

  const SongCard = ({ song, member, onEdit, onVote, onSetStatus, onSetPractice, onPromote }) => {
    const showVotes = song.status === "suggested";
    const showPractice = ["shortlist", "learning", "repertoire"].includes(song.status);
    const yesCount = MEMBERS.filter(m => song.votes?.[m.id] === "yes").length;
    const noCount  = MEMBERS.filter(m => song.votes?.[m.id] === "no").length;
    const allYes = yesCount === MEMBERS.length;
    const myVote = member ? song.votes?.[member.id] : null;

    return (
      <div className="card-flat p-3 sm:p-4">
        <div className="flex items-start gap-3 flex-wrap">
          <div className="flex-1 min-w-0">
            <div className="flex items-baseline gap-2 flex-wrap">
              <span className="display text-lg leading-tight">{song.title || "(untitled)"}</span>
              {song.artist && <span className="text-sm text-[var(--ink-soft)] italic">— {song.artist}</span>}
            </div>
            <div className="flex flex-wrap items-center gap-1.5 mt-1.5">
              {song.jamtrax && <span className="ticker acid-bg px-2 py-0.5">Jamtrax</span>}
              {song.proposer && <span className="ticker text-[var(--ink-soft)]">prop: {song.proposer}</span>}
              {song.lessonUrl && <a href={song.lessonUrl} target="_blank" rel="noopener" className="ticker text-[var(--berry)] underline">Lesson ↗</a>}
            </div>
            {song.comments && (
              <details className="mt-2 text-sm">
                <summary className="ticker text-[var(--ink-soft)] hover:text-[var(--berry)]">Notes ▾</summary>
                <p className="mt-1.5 italic text-[var(--ink-soft)]">{song.comments}</p>
              </details>
            )}
          </div>
          <button onClick={onEdit} className="ticker text-[var(--ink-soft)] hover:text-[var(--berry)] shrink-0">Edit ▸</button>
        </div>

        {showPractice && (
          <div className="mt-3 pt-3 border-t border-[var(--line)]/20 flex flex-wrap items-center gap-3">
            <span className="ticker text-[var(--ink-soft)]">Practice</span>
            <div className="flex items-center gap-1.5">
              {MEMBERS.map(m => (
                <PracticeChip key={m.id} initial={m.name[0]} state={song.practice?.[m.id]}
                  isMe={member?.id === m.id}
                  onClick={() => onSetPractice(song.id, m.id, cyclePractice(song.practice?.[m.id]))} />
              ))}
            </div>
            {member ? (
              <span className="text-xs text-[var(--ink-soft)] italic">Tap your circle to cycle: Good → Rusty → Learn → —</span>
            ) : (
              <span className="text-xs text-[var(--ink-soft)] italic">Pick who you are above to mark your practice.</span>
            )}
          </div>
        )}

        {showVotes && (
          <div className="mt-3 pt-3 border-t border-[var(--line)]/20 flex flex-wrap items-center gap-3">
            <div className="flex items-center gap-1.5">
              {MEMBERS.map(m => <VotePill key={m.id} initial={m.name[0]} vote={song.votes?.[m.id]} />)}
            </div>
            <span className="text-xs text-[var(--ink-soft)]">{yesCount} yes{noCount ? ` · ${noCount} no` : ""}</span>
            {member ? (
              <div className="flex gap-1.5 ml-auto">
                <button onClick={() => onVote(song.id, member.id, myVote === "yes" ? null : "yes")}
                  className={"pill px-3 py-1 text-xs font-semibold " + (myVote === "yes" ? "text-white" : "bg-white hover:bg-[var(--acid)]")}
                  style={myVote === "yes" ? { background: "var(--good)" } : {}}>✓ Yes</button>
                <button onClick={() => onVote(song.id, member.id, myVote === "no" ? null : "no")}
                  className={"pill px-3 py-1 text-xs font-semibold " + (myVote === "no" ? "text-white" : "bg-white hover:bg-[var(--acid)]")}
                  style={myVote === "no" ? { background: "var(--learn)" } : {}}>✗ No</button>
              </div>
            ) : <span className="ml-auto text-xs italic text-[var(--ink-soft)]">Pick who you are to vote</span>}
            {allYes && (
              <button onClick={() => onPromote(song.id)} className="btn berry-bg px-3 py-1.5 text-xs font-semibold w-full sm:w-auto">All in! → Shortlist</button>
            )}
          </div>
        )}

        <div className="mt-3 pt-3 border-t border-[var(--line)]/20 flex flex-wrap items-center gap-2">
          <span className="ticker text-[var(--ink-soft)]">Move to</span>
          {SONG_STATUSES.map(s => (
            <button key={s.id} onClick={() => onSetStatus(song.id, s.id)}
              disabled={s.id === song.status}
              className={"pill px-2.5 py-1 text-xs font-semibold " + (s.id === song.status ? "berry-bg text-white" : "bg-white hover:bg-[var(--acid)]")}>
              {s.label}
            </button>
          ))}
        </div>
      </div>
    );
  };

  const SongsView = ({ songs, member, mutate }) => {
    const [editingId, setEditingId] = useState(null);
    const [adding, setAdding] = useState(false);
    const [view, setView] = useState("repertoire");
    const [query, setQuery] = useState("");

    const all = songsList(songs);
    const counts = {};
    SONG_STATUSES.forEach(s => { counts[s.id] = all.filter(x => x.status === s.id).length; });

    const list = all.filter(s => s.status === view);
    list.sort((a, b) => {
      if (view === "suggested") {
        const yA = MEMBERS.filter(m => a.votes?.[m.id] === "yes").length;
        const yB = MEMBERS.filter(m => b.votes?.[m.id] === "yes").length;
        if (yA !== yB) return yB - yA;
      }
      return (a.title || "").localeCompare(b.title || "");
    });
    const q = query.trim().toLowerCase();
    const filtered = !q ? list : list.filter(s =>
      (s.title || "").toLowerCase().includes(q) ||
      (s.artist || "").toLowerCase().includes(q) ||
      (s.proposer || "").toLowerCase().includes(q));

    const updateSong = (id, data) => { mutate(prev => ({ ...prev, songs: { ...(prev.songs||{}), [id]: { ...(prev.songs?.[id]||{}), ...data } } })); };
    const setStatus = (id, status) => updateSong(id, { status });
    const createSong = (data) => { mutate(prev => ({ ...prev, songs: { ...(prev.songs||{}), [newId("s")]: { ...data, votes: {}, practice: {}, createdAt: Date.now() } } })); setAdding(false); };
    const deleteSong = (id) => { mutate(prev => { const songs = { ...(prev.songs||{}) }; delete songs[id]; return { ...prev, songs }; }); setEditingId(null); };
    const voteSong = (id, mid, val) => mutate(prev => {
      const songs = { ...(prev.songs||{}) };
      const s = { ...(songs[id] || {}) };
      const v = { ...(s.votes || {}) };
      if (!val) delete v[mid]; else v[mid] = val;
      s.votes = v; songs[id] = s;
      return { ...prev, songs };
    });
    const setPractice = (id, mid, val) => mutate(prev => {
      const songs = { ...(prev.songs||{}) };
      const s = { ...(songs[id] || {}) };
      const p = { ...(s.practice || {}) };
      if (!val) delete p[mid]; else p[mid] = val;
      s.practice = p; songs[id] = s;
      return { ...prev, songs };
    });
    const promoteSong = (id) => mutate(prev => {
      const songs = { ...(prev.songs||{}) };
      songs[id] = { ...(songs[id]||{}), status: "shortlist", votes: {} };
      return { ...prev, songs };
    });

    const allInSuggested = all.filter(c => c.status === "suggested" && MEMBERS.every(m => c.votes?.[m.id] === "yes")).length;

    return (
      <div>
        <div className="flex gap-2 flex-wrap mb-3">
          {SONG_STATUSES.map(s => (
            <button key={s.id} onClick={() => setView(s.id)}
              className={"pill px-3 py-1.5 text-sm font-semibold " + (view === s.id ? "berry-bg text-white" : "bg-white hover:bg-[var(--acid)]")}>
              {s.label} <span className="opacity-70 ml-1">{counts[s.id]}</span>
              {s.id === "suggested" && allInSuggested > 0 && view !== "suggested" && (
                <span className="ml-1 text-[10px] berry-bg text-white px-1 rounded-full" title={`${allInSuggested} ready to promote`}>{allInSuggested}!</span>
              )}
            </button>
          ))}
        </div>

        <div className="flex items-center justify-between gap-2 mb-3 flex-wrap">
          <input className="input flex-1" value={query} onChange={e => setQuery(e.target.value)}
            placeholder={`Search ${SONG_STATUSES.find(s => s.id === view)?.label.toLowerCase()} songs…`} />
          <button onClick={() => { setAdding(true); setEditingId(null); }} className="btn berry-bg px-4 py-2 text-sm font-semibold whitespace-nowrap">+ Add song</button>
        </div>

        <div className="card p-3 mb-4 text-sm">
          <span className="ticker text-[var(--berry)] mr-2">{SONG_STATUSES.find(s => s.id === view)?.label}</span>
          <span className="text-[var(--ink-soft)]">{SONG_STATUSES.find(s => s.id === view)?.desc}</span>
        </div>

        {adding && <SongForm onSave={createSong} onCancel={() => setAdding(false)} />}

        {filtered.length === 0 && !adding && (
          <div className="card p-6 text-center"><p className="display text-xl">{query ? "No matches." : "Nothing here yet."}</p></div>
        )}

        <div className="space-y-2.5">
          {filtered.map(s => editingId === s.id
            ? <SongForm key={s.id} initial={s} onSave={f => { updateSong(s.id, f); setEditingId(null); }} onCancel={() => setEditingId(null)} onDelete={() => deleteSong(s.id)} />
            : <SongCard key={s.id} song={s} member={member}
                onEdit={() => { setEditingId(s.id); setAdding(false); }}
                onVote={voteSong} onSetStatus={setStatus} onSetPractice={setPractice} onPromote={promoteSong} />
          )}
        </div>
      </div>
    );
  };

  const SetlistsView = ({ setlists, songs, events, member, mutate }) => {
    const [openId, setOpenId] = useState(null);
    const [creating, setCreating] = useState(false);
    const [newName, setNewName] = useState("");

    const all = setlistsList(setlists).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

    const createSetlist = (name) => {
      const id = newId("sl");
      mutate(prev => ({ ...prev, setlists: { ...(prev.setlists||{}), [id]: { name, songIds: [], gigEventId: null, notes: "", createdAt: Date.now() } } }));
      setOpenId(id); setCreating(false); setNewName("");
    };
    const updateSetlist = (id, data) => mutate(prev => ({ ...prev, setlists: { ...(prev.setlists||{}), [id]: { ...(prev.setlists?.[id]||{}), ...data } } }));
    const deleteSetlist = (id) => { mutate(prev => { const sl = { ...(prev.setlists||{}) }; delete sl[id]; return { ...prev, setlists: sl }; }); setOpenId(null); };

    if (openId && setlists?.[openId]) {
      return <SetlistDetail
        setlist={{ id: openId, ...setlists[openId] }}
        songs={songs} events={events} member={member}
        onBack={() => setOpenId(null)}
        onUpdate={(data) => updateSetlist(openId, data)}
        onDelete={() => deleteSetlist(openId)} />;
    }

    return (
      <div>
        <div className="flex items-center justify-between mb-4">
          <p className="text-sm text-[var(--ink-soft)]">Build a named setlist from your library, optionally pinned to a gig.</p>
          <button onClick={() => setCreating(true)} className="btn berry-bg px-4 py-2 text-sm font-semibold">+ New setlist</button>
        </div>

        {creating && (
          <div className="card p-4 mb-4">
            <label className="text-sm block">
              <div className="ticker mb-1">Name</div>
              <input autoFocus className="input" value={newName} onChange={e => setNewName(e.target.value)} placeholder="e.g. Dec 2026 — provisional" />
            </label>
            <div className="flex gap-2 mt-3">
              <button onClick={() => newName.trim() && createSetlist(newName.trim())} className="btn berry-bg px-4 py-2 font-semibold" disabled={!newName.trim()}>Create</button>
              <button onClick={() => { setCreating(false); setNewName(""); }} className="btn bg-white px-4 py-2">Cancel</button>
            </div>
          </div>
        )}

        {all.length === 0 && !creating && (
          <div className="card p-6 text-center">
            <p className="display text-xl">No setlists yet.</p>
            <p className="text-sm text-[var(--ink-soft)] mt-2">Tap "+ New setlist" to start one for your next gig.</p>
          </div>
        )}

        <div className="space-y-3">
          {all.map(sl => {
            const songCount = (sl.songIds || []).length;
            const gig = sl.gigEventId && events?.[sl.gigEventId];
            return (
              <button key={sl.id} onClick={() => setOpenId(sl.id)} className="card-flat p-4 w-full text-left hover:bg-[var(--acid)]/20 transition">
                <div className="flex items-center justify-between gap-3 flex-wrap">
                  <div className="flex-1 min-w-0">
                    <div className="display text-xl leading-tight">{sl.name}</div>
                    <div className="text-sm text-[var(--ink-soft)] mt-1">
                      {songCount} song{songCount === 1 ? "" : "s"}
                      {gig ? ` · pinned to ${gig.title || "gig"} on ${fmtDate(gig.date)}` : ""}
                    </div>
                  </div>
                  <span className="ticker text-[var(--berry)]">Open ▸</span>
                </div>
              </button>
            );
          })}
        </div>
      </div>
    );
  };

  const SetlistDetail = ({ setlist, songs, events, member, onBack, onUpdate, onDelete }) => {
    const [editingName, setEditingName] = useState(false);
    const [name, setName] = useState(setlist.name);
    const [picker, setPicker] = useState(false);
    const songIds = setlist.songIds || [];
    const gigOptions = eventsList(events).filter(e => e.type === "gig");

    const moveSong = (idx, dir) => {
      const arr = [...songIds];
      const ni = idx + dir;
      if (ni < 0 || ni >= arr.length) return;
      [arr[idx], arr[ni]] = [arr[ni], arr[idx]];
      onUpdate({ songIds: arr });
    };
    const removeSong = (idx) => {
      const arr = [...songIds];
      arr.splice(idx, 1);
      onUpdate({ songIds: arr });
    };
    const addSong = (id) => {
      if (songIds.includes(id)) return;
      onUpdate({ songIds: [...songIds, id] });
    };

    return (
      <div>
        <button onClick={onBack} className="ticker text-[var(--berry)] mb-3">← Back to setlists</button>

        <div className="card p-4 mb-4">
          {editingName ? (
            <div className="flex gap-2">
              <input className="input flex-1" value={name} onChange={e => setName(e.target.value)} autoFocus />
              <button onClick={() => { onUpdate({ name: name.trim() || setlist.name }); setEditingName(false); }} className="btn berry-bg px-3 py-1.5 text-sm font-semibold">Save</button>
            </div>
          ) : (
            <div className="flex items-center justify-between gap-3 flex-wrap">
              <h2 className="display text-3xl leading-tight">{setlist.name}</h2>
              <button onClick={() => setEditingName(true)} className="ticker text-[var(--ink-soft)] hover:text-[var(--berry)]">Rename ▸</button>
            </div>
          )}

          <div className="mt-3 flex items-center gap-2 flex-wrap">
            <span className="ticker text-[var(--ink-soft)]">Pin to gig</span>
            <select className="input text-sm" style={{ width: "auto", maxWidth: "100%" }} value={setlist.gigEventId || ""} onChange={e => onUpdate({ gigEventId: e.target.value || null })}>
              <option value="">— none —</option>
              {gigOptions.map(g => <option key={g.id} value={g.id}>{fmtDate(g.date)} · {g.title || "Gig"}</option>)}
            </select>
          </div>

          <label className="block mt-3">
            <div className="ticker mb-1 text-[var(--ink-soft)]">Notes</div>
            <textarea className="input text-sm" rows="2" value={setlist.notes || ""} onChange={e => onUpdate({ notes: e.target.value })} placeholder="e.g. running order tweaks, key changes…" />
          </label>

          <div className="mt-4 flex gap-2 flex-wrap">
            <button onClick={() => setPicker(true)} className="btn berry-bg px-4 py-2 text-sm font-semibold">+ Add songs</button>
            <button onClick={() => { if (confirm(`Delete setlist "${setlist.name}"?`)) onDelete(); }} className="btn bg-white px-4 py-2 text-sm text-[var(--berry)] ml-auto">Delete</button>
          </div>
        </div>

        {picker && <SongPicker songs={songs} excludeIds={songIds} onPick={addSong} onClose={() => setPicker(false)} />}

        {songIds.length === 0 ? (
          <div className="card-flat p-6 text-center">
            <p className="display text-xl">No songs yet.</p>
            <p className="text-sm text-[var(--ink-soft)] mt-2">Tap "+ Add songs" above.</p>
          </div>
        ) : (
          <ol className="space-y-2">
            {songIds.map((sid, i) => {
              const s = songs?.[sid];
              if (!s) return (
                <li key={sid} className="card-flat p-3 text-sm italic text-[var(--ink-soft)]">
                  (deleted song) <button onClick={() => removeSong(i)} className="text-[var(--berry)] underline ml-2">remove</button>
                </li>
              );
              return (
                <li key={sid} className="card-flat p-3">
                  <div className="flex items-start gap-3">
                    <div className="display text-xl text-[var(--berry)] shrink-0 w-8">{i + 1}.</div>
                    <div className="flex-1 min-w-0">
                      <div className="display text-base leading-tight">{s.title}</div>
                      {s.artist && <div className="text-xs text-[var(--ink-soft)] italic">{s.artist}</div>}
                      <div className="mt-1.5 flex items-center gap-1.5 flex-wrap">
                        <span className="ticker text-[var(--ink-soft)]">{SONG_STATUSES.find(x => x.id === s.status)?.label}</span>
                        <span className="ticker text-[var(--ink-soft)]">·</span>
                        {MEMBERS.map(m => (
                          <PracticeChip key={m.id} initial={m.name[0]} state={s.practice?.[m.id]} isMe={false} />
                        ))}
                      </div>
                    </div>
                    <div className="flex flex-col gap-1 shrink-0">
                      <button onClick={() => moveSong(i, -1)} disabled={i === 0} className="pill px-2 py-0.5 text-xs bg-white disabled:opacity-30">↑</button>
                      <button onClick={() => moveSong(i, 1)} disabled={i === songIds.length - 1} className="pill px-2 py-0.5 text-xs bg-white disabled:opacity-30">↓</button>
                      <button onClick={() => removeSong(i)} className="pill px-2 py-0.5 text-xs bg-white text-[var(--berry)]">×</button>
                    </div>
                  </div>
                </li>
              );
            })}
          </ol>
        )}
      </div>
    );
  };

  const SongPicker = ({ songs, excludeIds, onPick, onClose }) => {
    const [query, setQuery] = useState("");
    const [statusFilter, setStatusFilter] = useState("all");
    const all = songsList(songs).filter(s => !excludeIds.includes(s.id));
    const list = all.filter(s => {
      if (statusFilter !== "all" && s.status !== statusFilter) return false;
      const q = query.trim().toLowerCase();
      if (!q) return true;
      return (s.title || "").toLowerCase().includes(q) || (s.artist || "").toLowerCase().includes(q);
    }).sort((a, b) => (a.title || "").localeCompare(b.title || ""));

    return (
      <div className="card p-4 mb-4">
        <div className="flex items-center justify-between mb-3">
          <h3 className="display text-xl">Pick songs to add</h3>
          <button onClick={onClose} className="ticker text-[var(--ink-soft)]">Done ▸</button>
        </div>
        <input className="input mb-2" value={query} onChange={e => setQuery(e.target.value)} placeholder="Search by title or artist…" />
        <div className="flex gap-1.5 flex-wrap mb-3">
          <button onClick={() => setStatusFilter("all")} className={"pill px-2.5 py-1 text-xs font-semibold " + (statusFilter === "all" ? "berry-bg text-white" : "bg-white")}>All</button>
          {SONG_STATUSES.map(s => (
            <button key={s.id} onClick={() => setStatusFilter(s.id)} className={"pill px-2.5 py-1 text-xs font-semibold " + (statusFilter === s.id ? "berry-bg text-white" : "bg-white")}>{s.label}</button>
          ))}
        </div>
        {list.length === 0 ? (
          <p className="text-sm italic text-[var(--ink-soft)]">No songs match.</p>
        ) : (
          <div className="max-h-80 overflow-y-auto space-y-1.5">
            {list.map(s => (
              <button key={s.id} onClick={() => onPick(s.id)} className="card-flat p-2.5 w-full text-left hover:bg-[var(--acid)]/30 transition">
                <div className="flex items-center justify-between gap-2">
                  <div className="min-w-0 flex-1">
                    <div className="font-semibold truncate">{s.title}</div>
                    {s.artist && <div className="text-xs text-[var(--ink-soft)] italic truncate">{s.artist}</div>}
                  </div>
                  <span className="ticker text-[var(--ink-soft)] shrink-0">{SONG_STATUSES.find(x => x.id === s.status)?.label}</span>
                </div>
              </button>
            ))}
          </div>
        )}
      </div>
    );
  };

  const App = () => {
    const urlBin = getBinIdFromURL();
    const storedBin = getStoredBinId();
    const [binId, setBinId] = useState(urlBin || storedBin || null);
    const [showShare, setShowShare] = useState(false);
    const [member, setMemberId] = useMemberIdentity();
    const [tab, setTab] = useState("schedule");

    useEffect(() => { if (urlBin && urlBin !== storedBin) setStoredBinId(urlBin); }, [urlBin, storedBin]);

    const sync = useSyncedState(binId);

    if (!binId) return <SetupScreen onCreated={(id) => {
      setStoredBinId(id);
      const url = new URL(window.location.href);
      url.searchParams.set("bin", id);
      window.history.replaceState({}, "", url.toString());
      setBinId(id); setShowShare(true);
    }} />;
    if (showShare) return <ShareScreen binId={binId} onContinue={() => setShowShare(false)} />;

    if (!sync.state) {
      return (
        <div className="max-w-3xl mx-auto px-4 py-12 text-center">
          <h1 className="wordmark text-5xl mb-3">Sour<span className="display-italic font-medium" style={{color:"var(--berry)"}}>berry</span></h1>
          {sync.status === "error" ? (
            <div className="card p-5 text-left">
              <div className="ticker text-[var(--berry)]">Couldn't load</div>
              <p className="display text-xl mt-1">Something's wrong with the database.</p>
              <p className="text-sm mt-2 text-[var(--ink-soft)]">{sync.errorMsg}</p>
              <button onClick={() => { setStoredBinId(null); setBinId(null); }} className="btn bg-white px-4 py-2 mt-4">Reset and start over</button>
            </div>
          ) : (
            <p className="display-italic text-lg text-[var(--ink-soft)]">Loading the band's data…</p>
          )}
        </div>
      );
    }

    const events = sync.state.events || {};
    const songs = sync.state.songs || {};
    const setlists = sync.state.setlists || {};

    return (
      <div className="max-w-5xl mx-auto px-4 sm:px-6 py-6">
        <header className="mb-6">
          <div className="flex items-end justify-between gap-4 flex-wrap">
            <div>
              <div className="ticker text-[var(--berry)]">Band ops · est. for fun</div>
              <h1 className="wordmark text-6xl sm:text-7xl leading-none mt-1">Sour<span className="display-italic font-medium" style={{color:"var(--berry)"}}>berry</span></h1>
            </div>
            <MemberPicker value={member} onChange={setMemberId} />
          </div>

          <nav className="mt-6 flex items-center border-y-2 border-[var(--line)] overflow-x-auto">
            {[
              { id: "schedule",     label: "Schedule" },
              { id: "availability", label: "Availability" },
              { id: "songs",        label: "Songs" },
              { id: "setlists",     label: "Setlists" },
            ].map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={"px-5 py-2.5 ticker whitespace-nowrap " + (tab === t.id ? "tab-active" : "hover:bg-[var(--acid)]")}>
                {t.label}
              </button>
            ))}
            <div className="ml-auto pr-2 shrink-0">
              <SyncBadge status={sync.status} errorMsg={sync.errorMsg} lastSyncedAt={sync.lastSyncedAt} />
            </div>
          </nav>
        </header>

        {tab === "schedule"     && <ScheduleView     events={events} member={member} mutate={sync.mutate} />}
        {tab === "availability" && <AvailabilityView events={events} member={member} mutate={sync.mutate} />}
        {tab === "songs"        && <SongsView        songs={songs}   member={member} mutate={sync.mutate} />}
        {tab === "setlists"     && <SetlistsView     setlists={setlists} songs={songs} events={events} member={member} mutate={sync.mutate} />}

        <footer className="mt-12 pt-6 border-t border-[var(--line)]/30 text-xs text-[var(--ink-soft)] flex justify-between flex-wrap gap-2">
          <span>Sourberry · keep the cover band tight</span>
          <span className="display-italic">made with bitter love</span>
        </footer>
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

</body>
</html>
