  <style>
    :root {
      --bg: #f6f1e7; --bg-card: #fffaf0; --ink: #1a0a14; --ink-soft: #4a2a3a;
      --berry: #e93ca3; --berry-deep: #b8217a; --acid: #d1db58; --line: #2a1018;
      --good: #1f8f4a; --rusty: #d97a1f; --learn: #c12c2c;
    }
    html, body { background: var(--bg); color: var(--ink); }
    body { font-family: 'Inter Tight', system-ui, sans-serif;
      background-image: radial-gradient(circle at 1px 1px, rgba(26,10,20,0.08) 1px, transparent 0);
      background-size: 22px 22px; }
    .display { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
    .display-italic { font-family: 'Fraunces', Georgia, serif; font-style: italic; }
    .wordmark { font-family: 'Fraunces', Georgia, serif; font-weight: 800;
      letter-spacing: -0.04em; font-variation-settings: "opsz" 144; }
    .ticker { letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; font-size: 0.72rem; }
    .card { background: var(--bg-card); border: 1.5px solid var(--line); box-shadow: 4px 4px 0 var(--line); }
    .card-flat { background: var(--bg-card); border: 1.5px solid var(--line); }
    .btn { border: 1.5px solid var(--line); box-shadow: 3px 3px 0 var(--line);
      transition: transform 80ms ease, box-shadow 80ms ease; }
    .btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--line); }
    .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--line); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .pill { border: 1.2px solid var(--line); }
    .input { background: #fffdf6; border: 1.5px solid var(--line);
      padding: 0.5rem 0.75rem; font-family: 'Inter Tight', sans-serif; width: 100%; }
    .input:focus { outline: none; box-shadow: 3px 3px 0 var(--berry); }
    .tab-active { background: var(--ink); color: var(--bg); }
    .berry-bg { background: var(--berry); color: #fff; }
    .acid-bg { background: var(--acid); color: var(--ink); }
    details > summary { cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    .tab-nav-wrap { position: relative; }
    .tab-nav-wrap::after {
      content: "";
      position: absolute; top: 0; right: 0; bottom: 0; width: 24px;
      background: linear-gradient(to right, transparent, var(--bg));
      pointer-events: none;
    }
    @media (min-width: 640px) {
      .tab-nav-wrap::after { display: none; }
    }
    @media (max-width: 640px) {
      .card { box-shadow: 3px 3px 0 var(--line); }
      .modal-bg { padding: 0.5rem; }
      body { background-size: 18px 18px; }
    }
    @media (min-width: 1280px) {
      body { background-size: 26px 26px; }
    }
    .modal-bg { position: fixed; inset: 0; background: rgba(26,10,20,0.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .blink { animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0.5; } }
  </style>

</head>

const migrate = data => {
  let migrated = false;
  const sv = data.schemaVersion || 1;
  if (sv < 2 || !data.songs) { data.songs = data.songs || buildSongsSeed(); data.schemaVersion = 2; migrated = true; }
  if (data.schemaVersion < 3) {
    Object.keys(data.songs || {}).forEach(id => {
      const s = data.songs[id];
      if (s.status === "agreed") s.status = s.learnt ? "repertoire" : "shortlist";
      else if (s.status === "candidate") s.status = "suggested";
      delete s.learnt;
      s.practice = s.practice || {};
      s.votes = s.votes || {};
    });
    Object.keys(data.events || {}).forEach(id => {
      const e = data.events[id];
      if (!e.venueType) e.venueType = e.location && /remote|jam/i.test(e.location) ? "virtual" : "in-person";
    });
    data.setlists = data.setlists || {};
    data.schemaVersion = 3; migrated = true;
  }
  if (data.schemaVersion < 4) {
    Object.keys(data.events || {}).forEach(id => {
      const e = data.events[id];
      if (e.venueType === "in-person") e.venueType = "in-person-studio";
      else if (e.venueType === "virtual") e.venueType = "jamkazam";
      if (!e.venueType) e.venueType = "in-person-studio";
    });
    if (!data.setlists || Object.keys(data.setlists).length === 0) data.setlists = buildSetlistsSeed();
    data.polls = data.polls || {};
    data.schemaVersion = 4; migrated = true;
  }
  if (data.schemaVersion < 5) {
    Object.keys(data.events || {}).forEach(id => {
      const e = data.events[id];
      if ("bookedAndPaid" in e) { e.confirmed = !!e.bookedAndPaid; delete e.bookedAndPaid; }
    });
    if (!data.equipment || Object.keys(data.equipment).length === 0) data.equipment = buildEquipmentSeed();
    data.wishlist = data.wishlist || {};
    data.schemaVersion = 5; migrated = true;
  }
  if (data.schemaVersion < 6) {
    data.practiceAvail = data.practiceAvail || {};
    data.schemaVersion = 6; migrated = true;
  }
  if (data.schemaVersion < 7) {
    Object.keys(data.songs || {}).forEach(id => {
      const s = data.songs[id];
      if (s.lengthSec === undefined) s.lengthSec = null;
      if (s.album === undefined) s.album = "";
      if (s.year === undefined) s.year = "";
      if (s.coverArtUrl === undefined) s.coverArtUrl = "";
      if (s.iTunesUrl === undefined) s.iTunesUrl = "";
      if (s.spotifyUrl === undefined) s.spotifyUrl = "";
    });
    Object.keys(data.events || {}).forEach(id => {
      const e = data.events[id];
      if (e.recordingUrl === undefined) e.recordingUrl = "";
      if (e.gigNotes === undefined) e.gigNotes = "";
      if (e.actualSetlistId === undefined) e.actualSetlistId = null;
    });
    data.schemaVersion = 7; migrated = true;
  }
  if (data.schemaVersion < 8) {
    Object.keys(data.setlists || {}).forEach(id => {
      const sl = data.setlists[id];
      if (!Array.isArray(sl.sets)) {
        const oldIds = Array.isArray(sl.songIds) ? sl.songIds.slice() : [];
        sl.sets = [{name: "Set 1", songIds: oldIds}];
      }
      if (sl.soundcheckSongId === undefined) sl.soundcheckSongId = null;
      delete sl.songIds;
    });
    data.schemaVersion = 8; migrated = true;
  }
  return migrated;
};

const parseDuration = (str) => {
  if (str == null) return null;
  const s = String(str).trim();
  if (!s) return null;
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  const parts = s.split(":").map(p => p.trim());
  if (parts.some(p => !/^\d+$/.test(p))) return null;
  const nums = parts.map(p => parseInt(p, 10));
  if (nums.length === 2) return nums[0] * 60 + nums[1];
  if (nums.length === 3) return nums[0] * 3600 + nums[1] * 60 + nums[2];
  return null;
};
const formatDuration = (sec) => {
  if (sec == null || sec < 0 || isNaN(sec)) return "";
  const total = Math.round(sec);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  if (h > 0) return h + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  return m + ":" + String(s).padStart(2,"0");
};

const jsonpFetch = (url, timeoutMs) => new Promise((resolve, reject) => {
  const cbName = "_jsonp_" + Math.random().toString(36).slice(2) + "_" + Date.now();
  let timer = null;
  let script = null;
  const cleanup = () => {
    try { delete window[cbName]; } catch(_) { window[cbName] = undefined; }
    if (script && script.parentNode) script.parentNode.removeChild(script);
    if (timer) clearTimeout(timer);
  };
  window[cbName] = (data) => { cleanup(); resolve(data); };
  script = document.createElement("script");
  script.onerror = () => { cleanup(); reject(new Error("Network error")); };
  script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + cbName;
  timer = setTimeout(() => { cleanup(); reject(new Error("Timed out")); }, timeoutMs || 8000);
  document.body.appendChild(script);
});

const normalizeArtistForMatch = s => {
  let n = normalizeForMatch(s);
  if (n.startsWith("the")) n = n.slice(3);
  if (n.endsWith("the")) n = n.slice(0, -3);
  return n;
};
const titleMatches = (a, b) => {
  const n1 = normalizeForMatch(a), n2 = normalizeForMatch(b);
  if (!n1 || !n2) return false;

};
const artistMatches = (a, b) => {
  const n1 = normalizeArtistForMatch(a), n2 = normalizeArtistForMatch(b);
  if (!n1 || !n2) return false;
  return n1 === n2 || n1.includes(n2) || n2.includes(n1);
};

const POLL_MS = 30000;
const useSyncedState = binId => {
  const [state, setState] = useState(null);
  const [status, setStatus] = useState("loading");
  const [errorMsg, setErrorMsg] = useState("");
  const [errorStatus, setErrorStatus] = useState(null);
  const [lastSyncedAt, setLastSyncedAt] = useState(null);
  const stateRef = useRef(state); stateRef.current = state;
  const writeTimerRef = useRef(null);
  const writeInFlightRef = useRef(false);
  const pendingWriteRef = useRef(false);
  const flushWrite = useCallback(async () => {
    if (!binId || writeInFlightRef.current) return;
    writeInFlightRef.current = true;
    pendingWriteRef.current = false;
    setStatus("saving");
    try {
      await jbUpdateBin(binId, stateRef.current);
      setStatus("ok"); setErrorMsg(""); setErrorStatus(null); setLastSyncedAt(Date.now());
    } catch (e) {
      setStatus("error"); setErrorMsg(e.message); setErrorStatus(e.status || null);
    } finally {
      writeInFlightRef.current = false;
      if (pendingWriteRef.current) setTimeout(flushWrite, 100);
    }
  }, [binId]);
  const scheduleWrite = useCallback(() => {
    if (writeTimerRef.current) clearTimeout(writeTimerRef.current);
    if (writeInFlightRef.current) { pendingWriteRef.current = true; return; }
    writeTimerRef.current = setTimeout(flushWrite, 600);
  }, [flushWrite]);
  const mutate = useCallback(updater => {
    setState(prev => {
      const next = updater(prev || {schemaVersion:8, events:{}, songs:{}, setlists:{}, polls:{}, equipment:{}, wishlist:{}, practiceAvail:{}});
      stateRef.current = next;
      return next;
    });
    scheduleWrite();
  }, [scheduleWrite]);
  const fetchOnce = useCallback(async () => {
    if (writeInFlightRef.current) return;
    try {
      let data = await jbReadBin(binId);
      if (pendingWriteRef.current || writeTimerRef.current) return;
      const didMigrate = migrate(data);
      setState(data); stateRef.current = data;
      setStatus("ok"); setErrorMsg(""); setErrorStatus(null); setLastSyncedAt(Date.now());
      if (didMigrate) scheduleWrite();
    } catch (e) {
      setStatus("error"); setErrorMsg(e.message); setErrorStatus(e.status || null);
    }
  }, [binId, scheduleWrite]);
  const reloadFromServer = useCallback(async () => {
    if (writeTimerRef.current) { clearTimeout(writeTimerRef.current); writeTimerRef.current = null; }
    pendingWriteRef.current = false;
    setStatus("loading");
    await fetchOnce();
  }, [fetchOnce]);
  useEffect(() => {
    if (!binId) return;
    let cancelled = false;
    let pollTimer = null;
    const tick = () => { if (!cancelled && document.visibilityState === "visible") fetchOnce(); pollTimer = setTimeout(tick, POLL_MS); };
    fetchOnce();
    pollTimer = setTimeout(tick, POLL_MS);
    const onVis = () => { if (document.visibilityState === "visible") fetchOnce(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { cancelled = true; if (pollTimer) clearTimeout(pollTimer); document.removeEventListener("visibilitychange", onVis); };
  }, [binId, fetchOnce]);
  return {state, status, errorMsg, errorStatus, lastSyncedAt, mutate, refresh: fetchOnce, reloadFromServer};
};

const Wordmark = ({className}) => h("img", {src: LOGO_SRC, alt: "Sourberry", className: "block " + (className || "")});

const SetupScreen = ({onCreated}) => {
  const [apiKey, setApiKey] = useState("");
  const [working, setWorking] = useState(false);
  const [err, setErr] = useState("");
  const create = async () => {
    const key = apiKey.trim();
    if (!key) { setErr("Paste your JSONBin API key first."); return; }
    setWorking(true); setErr("");
    try {
      const id = await jbCreateBin(key, buildSeedState());
      if (!id) throw new Error("JSONBin didn't return a bin ID.");
      onCreated(id);
    } catch (e) { setErr(e.message); } finally { setWorking(false); }
  };
  return h("div",{className:"max-w-2xl mx-auto px-4 py-8"},
    h("header",{className:"mb-6"},
      h("div",{className:"ticker text-[var(--berry)]"},"First-time setup"),
      h(Wordmark, {className:"h-12 sm:h-16 mt-1"})
    ),
    h("div",{className:"card p-5"},
      h("h2",{className:"display text-2xl mb-2"},"Connect your database"),
      h("ol",{className:"text-sm space-y-2 mb-5 pl-5 list-decimal"},
        h("li",null,"Open ", h("a",{className:"text-[var(--berry)] underline",href:"https://jsonbin.io/api-keys",target:"_blank",rel:"noopener"},"jsonbin.io/api-keys"), " in another tab."),
        h("li",null,"Copy your ", h("strong",null,"Master Key"), "."),
        h("li",null,"Paste it below and tap ", h("strong",null,"Create database"), ".")
      ),
      h("label",{className:"block text-sm"},
        h("div",{className:"ticker mb-1"},"JSONBin Master Key"),
        h("input",{className:"input font-mono text-xs",type:"password",value:apiKey,onChange:e=>setApiKey(e.target.value),placeholder:"$2a$10$...",autoComplete:"off",autoCapitalize:"off",autoCorrect:"off",spellCheck:"false"})
      ),
      err && h("div",{className:"mt-3 p-3 border border-[var(--berry)] bg-[var(--berry)]/10 text-sm"}, h("strong",null,"Couldn't set up:"), " ", err),
      h("div",{className:"mt-4"},
        h("button",{onClick:create,disabled:working,className:"btn berry-bg px-5 py-2.5 font-semibold"}, working?"Creating…":"Create database")
      )
    )
  );
};

const ShareScreen = ({binId, onContinue}) => {
  const [copied, setCopied] = useState(false);
  const url = window.location.origin + window.location.pathname + "?bin=" + binId;
  const copy = async () => {
    try { await navigator.clipboard.writeText(url); setCopied(true); setTimeout(()=>setCopied(false), 2000); }
    catch (e) {
      const ta = document.getElementById("share-url");
      if (ta) { ta.select(); document.execCommand("copy"); setCopied(true); setTimeout(()=>setCopied(false), 2000); }
    }
  };
  return h("div",{className:"max-w-2xl mx-auto px-4 py-8"},
    h("header",{className:"mb-6"},
      h("div",{className:"ticker text-[var(--berry)]"},"Done!"),
      h(Wordmark, {className:"h-12 sm:h-16 mt-1"})
    ),
    h("div",{className:"card p-5"},
      h("h2",{className:"display text-2xl mb-2"},"Share this URL with the band"),
      h("div",{className:"flex gap-2 items-stretch mt-3"},
        h("input",{id:"share-url",className:"input font-mono text-xs flex-1",readOnly:true,value:url}),
        h("button",{onClick:copy,className:"btn berry-bg px-4 font-semibold whitespace-nowrap"}, copied?"Copied ✓":"Copy")
      ),
      h("button",{onClick:onContinue,className:"btn bg-white px-5 py-2.5 mt-5 font-semibold"},"Open the app →")
    )
  );
};

const TypeBadge = ({type, status}) => {
  const isGig = type === "gig";
  const cancelled = status === "cancelled";
  return h("span",{className:"ticker px-2 py-0.5 " + (cancelled?"bg-gray-200 text-gray-500":isGig?"berry-bg":"acid-bg")}, cancelled?"Cancelled":isGig?"Gig":"Rehearsal");
};
const VenueBadge = ({venueType}) => {
  if (venueType === "jamkazam") return h("span",{className:"ticker bg-blue-100 px-2 py-0.5"},"Jamkazam");
  return h("span",{className:"ticker bg-orange-100 px-2 py-0.5"},"Studio");
};
const StatusDot = ({status}) => {
  const map = {yes:"var(--good)", no:"var(--learn)", maybe:"var(--rusty)"};
  if (!map[status]) return h("span",{className:"inline-block w-3 h-3 rounded-full border border-[var(--line)] bg-white"});
  return h("span",{className:"inline-block w-3 h-3 rounded-full border border-[var(--line)]",style:{background: map[status]}});
};
const MemberPicker = ({value, onChange}) => h("div",{className:"flex items-center gap-1.5 sm:gap-2 shrink-0"},
  h("span",{className:"ticker text-[var(--ink-soft)] hidden sm:inline"},"I am"),
  h("div",{className:"flex gap-1 sm:gap-1.5 flex-wrap"},
    MEMBERS.map(m => {
      const active = value && value.id === m.id;
      return h("button",{key:m.id,onClick:()=>onChange(m.id),className:"pill px-2 sm:px-3 py-1 text-xs sm:text-sm font-semibold transition-all " + (active?"berry-bg":"bg-white hover:bg-[var(--acid)]")},
        h("span",{className:"sm:hidden"}, active?m.name:m.name[0]),
        h("span",{className:"hidden sm:inline"}, m.name)
      );
    })
  )
);
const SyncPanel = ({sync, onClose}) => {
  const [retrying, setRetrying] = useState(false);
  const ago = sync.lastSyncedAt ? Math.round((Date.now() - sync.lastSyncedAt)/1000) : null;
  const isRateLimit = sync.errorStatus === 429;
  const is404 = sync.errorStatus === 404;
  const reset = () => {
    if (!confirm("This will clear the saved bin ID on this device. Continue?")) return;
    setStoredBinId(null);
    window.location.href = window.location.origin + window.location.pathname;
  };
  const retry = async () => { setRetrying(true); await sync.refresh(); setRetrying(false); };
  const reload = async () => { setRetrying(true); await sync.reloadFromServer(); setRetrying(false); };
  return h("div",{className:"modal-bg",onClick:onClose},
    h("div",{className:"card p-5 max-w-lg w-full",onClick:e=>e.stopPropagation()},
      h("div",{className:"flex items-center justify-between mb-3"},
        h("h3",{className:"display text-2xl"},"Sync status"),
        h("button",{onClick:onClose,className:"ticker text-[var(--ink-soft)]"},"Close ✕")
      ),
      h("div",{className:"space-y-3 text-sm"},
        h("div",null,
          h("div",{className:"ticker text-[var(--ink-soft)] mb-1"},"Status"),
          h("div",{className:"font-semibold"},
            sync.status==="ok"&&h("span",{className:"text-[var(--good)]"},"✓ Connected"),
            sync.status==="loading"&&h("span",null,"⟳ Loading…"),
            sync.status==="saving"&&h("span",null,"⟳ Saving…"),
            sync.status==="error"&&h("span",{className:"text-[var(--berry)]"},"✗ Sync error")
          )
        ),
        h("div",null,
          h("div",{className:"ticker text-[var(--ink-soft)] mb-1"},"Last successful sync"),
          h("div",null, ago!==null ? (ago + " seconds ago") : "Never this session")
        ),
        sync.status==="error" && h(React.Fragment,null,
          h("div",null,
            h("div",{className:"ticker text-[var(--ink-soft)] mb-1"},"What happened"),
            isRateLimit ? h("p",null,"You've hit JSONBin's rate limit. The free tier allows a limited number of requests per month. Upgrade JSONBin (~£3/month) or wait until next month.")
            : is404 ? h("p",null,"The database wasn't found. The bin may have been deleted or your URL is wrong.")
            : h("p",null,"The app couldn't reach JSONBin or the request failed. Could be a temporary network blip.")
          ),
          h("details",null,
            h("summary",{className:"ticker text-[var(--ink-soft)]"},"Technical details ▾"),
            h("pre",{className:"mt-2 p-2 bg-black/5 text-xs overflow-x-auto whitespace-pre-wrap break-all"}, sync.errorMsg)
          )
        ),
        h("div",{className:"pt-3 border-t border-[var(--line)]/20 flex flex-wrap gap-2"},
          h("button",{onClick:retry,disabled:retrying,className:"btn berry-bg px-3 py-1.5 text-sm font-semibold"}, retrying?"Trying…":"Retry now"),
          h("button",{onClick:reload,disabled:retrying,className:"btn bg-white px-3 py-1.5 text-sm"},"Force reload"),
          h("button",{onClick:reset,className:"btn bg-white px-3 py-1.5 text-sm text-[var(--berry)] ml-auto"},"Reset connection")
        )
      )
    )
  );
};
const SyncBadge = ({sync, onOpen}) => {
  const ago = sync.lastSyncedAt ? Math.round((Date.now() - sync.lastSyncedAt)/1000) : null;
  let label, cls = "text-[var(--ink-soft)]";
  if (sync.status === "saving") label = "saving…";
  else if (sync.status === "loading") label = "loading…";
  else if (sync.status === "error") { label = "⚠ sync error · tap"; cls = "text-[var(--berry)] font-semibold"; }
  else label = ago!==null ? ("synced " + ago + "s ago") : "synced";
  return h("button",{onClick:onOpen,className:"display-italic text-[10px] sm:text-xs hover:underline text-right " + cls + (sync.status==="error"?" blink":"")}, label);
};

const TypedScheduleView = ({events, member, mutate, eventType}) => {
  const [editingId, setEditingId] = useState(null);
  const [adding, setAdding] = useState(false);
  const [showPast, setShowPast] = useState(false);
  const all = eventsList(events).filter(e => e.type === eventType);
  const upcoming = all.filter(e => !isPast(e.date));
  const past = all.filter(e => isPast(e.date)).reverse();
  const list = showPast ? past : upcoming;
  const locationSuggestions = uniqueLocations(events);
  const setAvailability = (eid, mid, val) => mutate(prev => {
    const events = Object.assign({}, prev.events||{});
    const ev = Object.assign({}, events[eid]||{});
    const av = Object.assign({}, ev.availability||{});
    if (val === null) delete av[mid]; else av[mid] = val;
    ev.availability = av; events[eid] = ev;
    return Object.assign({}, prev, {events});
  });
  const updateEvent = (eid, data) => {
    mutate(prev => Object.assign({}, prev, {events: Object.assign({}, prev.events||{}, {[eid]: Object.assign({}, (prev.events&&prev.events[eid])||{}, data)})}));
    setEditingId(null);
  };
  const createEvent = data => {
    mutate(prev => Object.assign({}, prev, {events: Object.assign({}, prev.events||{}, {[newId("e")]: Object.assign({}, data, {availability:{}, createdAt: Date.now()})})}));
    setAdding(false);
  };
  const deleteEvent = eid => {
    mutate(prev => { const events = Object.assign({}, prev.events||{}); delete events[eid]; return Object.assign({}, prev, {events}); });
    setEditingId(null);
  };
  const clearAllPast = () => {
    if (past.length === 0) return;
    if (!confirm("Delete " + past.length + " past " + eventType + (past.length===1?"":"s") + "?")) return;
    mutate(prev => { const events = Object.assign({}, prev.events||{}); past.forEach(e => delete events[e.id]); return Object.assign({}, prev, {events}); });
  };
  const addLabel = eventType === "gig" ? "+ Gig" : "+ Rehearsal";
  return h("div",null,
    h("div",{className:"flex items-center justify-between mb-4 flex-wrap gap-2"},
      h("div",{className:"flex gap-2"},
        h("button",{onClick:()=>setShowPast(false),className:"pill px-3 py-1 text-sm " + (!showPast?"berry-bg text-white":"bg-white")},"Upcoming (" + upcoming.length + ")"),
        h("button",{onClick:()=>setShowPast(true),className:"pill px-3 py-1 text-sm " + (showPast?"berry-bg text-white":"bg-white")},"Past (" + past.length + ")")
      ),
      h("button",{onClick:()=>{setAdding(true); setEditingId(null);},className:"btn berry-bg px-3 py-2 text-sm font-semibold"}, addLabel)
    ),
    showPast && past.length>0 && h("div",{className:"card-flat p-3 mb-4 flex items-center justify-between gap-2 flex-wrap"},
      h("span",{className:"text-sm text-[var(--ink-soft)]"},"Tidy up: " + past.length + " past " + eventType + (past.length===1?"":"s") + "."),
      h("button",{onClick:clearAllPast,className:"btn bg-white px-3 py-1.5 text-sm text-[var(--berry)]"},"Delete all past")
    ),
    adding && h(EventForm,{initial: blankEvent(eventType), onSave:createEvent, onCancel:()=>setAdding(false), locationSuggestions:locationSuggestions}),
    list.length===0 && !adding && h("div",{className:"card p-6 text-center"},
      h("p",{className:"display text-xl"}, showPast ? ("No past " + eventType + "s.") : ("No " + eventType + "s in the diary yet.")),
      !showPast && h("p",{className:"text-sm mt-2 text-[var(--ink-soft)]"},"Tap \"" + addLabel + "\" to add one.")
    ),
    h("div",{className:"space-y-3"},
      list.map(ev => editingId===ev.id
        ? h(EventForm,{key:ev.id, initial:ev, onSave: f => updateEvent(ev.id, f), onCancel:()=>setEditingId(null), onDelete:()=>deleteEvent(ev.id), locationSuggestions:locationSuggestions})
        : h(EventCard,{key:ev.id, ev:ev, member:member, onEdit:()=>{setEditingId(ev.id); setAdding(false);}, onSetAvailability:setAvailability, onDelete:()=>{ if(confirm("Delete this past event?")) deleteEvent(ev.id); }})
      )
    )
  );
};

const blankSong = () => ({title:"", artist:"", status:"suggested", jamtrax:false, proposer:"", lessonUrl:"", comments:"", votes:{}, practice:{}, lengthSec:null, album:"", year:"", coverArtUrl:"", iTunesUrl:"", spotifyUrl:""});

const SongForm = ({initial, onSave, onCancel, onDelete}) => {
  const [f, setF] = useState(initial || blankSong());
  const [durationText, setDurationText] = useState(formatDuration((initial || blankSong()).lengthSec));
  const [durationError, setDurationError] = useState("");
  const [lookupOpen, setLookupOpen] = useState(false);
  const [lookupQuery, setLookupQuery] = useState("");
  const [lookupBusy, setLookupBusy] = useState(false);
  const [lookupResults, setLookupResults] = useState([]);
  const [lookupError, setLookupError] = useState("");
  const set = (k,v) => setF(prev => Object.assign({}, prev, {[k]:v}));
  const handleSave = () => {
    const trimmed = durationText.trim();
    let lengthSec = null;
    if (trimmed) {
      lengthSec = parseDuration(trimmed);
      if (lengthSec == null) { setDurationError("Use M:SS, MM:SS, or seconds"); return; }
    }
    setDurationError("");
    onSave(Object.assign({}, f, {lengthSec}));
  };
  const doLookup = async (overrideQ) => {
    const q = overrideQ != null ? overrideQ : lookupQuery;
    setLookupBusy(true); setLookupError(""); setLookupResults([]);
    try {
      const results = await itunesSearch(q, 5);
      setLookupResults(results);
      if (results.length === 0) setLookupError("No matches.");
    } catch (e) {
      setLookupError("Lookup failed: " + e.message);
    } finally {
      setLookupBusy(false);
    }
  };
  const openLookup = () => {
    const q = ((f.artist||"") + " " + (f.title||"")).trim();
    setLookupQuery(q); setLookupResults([]); setLookupError("");
    setLookupOpen(true);
    if (q) doLookup(q);
  };
  const useResult = (r) => {
    setF(prev => {
      const out = Object.assign({}, prev);
      if (!prev.title && r.title) out.title = r.title;
      if (!prev.artist && r.artist) out.artist = r.artist;
      if (!prev.album && r.album) out.album = r.album;
      if (!prev.year && r.year) out.year = r.year;
      if (!prev.coverArtUrl && r.coverArtUrl) out.coverArtUrl = r.coverArtUrl;
      if (!prev.iTunesUrl && r.iTunesUrl) out.iTunesUrl = r.iTunesUrl;
      return out;
    });
    // Only set duration if currently empty/invalid
    if (r.lengthSec && parseDuration(durationText) == null) {
      setDurationText(formatDuration(r.lengthSec));
      setDurationError("");
    }
    setLookupOpen(false);
  };
  return h("div",{className:"card p-5 mb-4"},
    // Auto-fill panel
    h("div",{className:"mb-4 pb-4 border-b border-[var(--line)]/20"},
      !lookupOpen
        ? h("button",{type:"button",onClick:openLookup,className:"btn bg-white px-3 py-2 text-sm font-semibold w-full"},"🔍 Auto-fill from Apple Music")
        : h("div",null,
            h("div",{className:"flex items-center gap-2 mb-2"},
              h("span",{className:"ticker text-[var(--berry)] flex-1"},"Apple Music search"),
              h("button",{type:"button",onClick:()=>setLookupOpen(false),className:"ticker text-[var(--ink-soft)]"},"Close ✕")
            ),
            h("div",{className:"flex gap-2 mb-2"},
              h("input",{className:"input flex-1",value:lookupQuery,onChange:e=>setLookupQuery(e.target.value),placeholder:"Title and artist…",onKeyDown:e=>{if(e.key==="Enter"){e.preventDefault();doLookup();}}}),
              h("button",{type:"button",onClick:()=>doLookup(),disabled:lookupBusy,className:"btn berry-bg px-3 py-1.5 text-sm font-semibold"}, lookupBusy?"…":"Search")
            ),
            lookupError && h("p",{className:"text-sm italic text-[var(--ink-soft)] mb-2"}, lookupError),
            lookupBusy && h("p",{className:"text-sm italic text-[var(--ink-soft)] mb-2"},"Searching Apple Music…"),
            lookupResults.length > 0 && h("div",{className:"space-y-1.5"},
              lookupResults.map((r, i) => h("button",{
                key:i, type:"button", onClick:()=>useResult(r),
                className:"card-flat p-2 w-full text-left hover:bg-[var(--acid)]/30 flex items-center gap-3"
              },
                r.coverArtUrl && h("img",{src:r.coverArtUrl,alt:"",className:"shrink-0 rounded border border-[var(--line)]/30",style:{width:48,height:48,objectFit:"cover"},onError:e=>{e.target.style.display="none";}}),
                h("div",{className:"flex-1 min-w-0"},
                  h("div",{className:"font-semibold truncate"}, r.title),
                  h("div",{className:"text-xs text-[var(--ink-soft)] italic truncate"}, r.artist),
                  h("div",{className:"text-xs text-[var(--ink-soft)] truncate"}, [r.album, r.year, formatDuration(r.lengthSec)].filter(Boolean).join(" · "))
                ),
                h("span",{className:"ticker text-[var(--berry)] shrink-0"},"Use ▸")
              ))
            ),
            h("p",{className:"text-xs text-[var(--ink-soft)] italic mt-2"},"Tap a result to fill blank fields.")
          )
    ),
    h("div",{className:"grid grid-cols-1 md:grid-cols-2 gap-3"},
      h("label",{className:"text-sm md:col-span-2"}, h("div",{className:"ticker mb-1"},"Title"), h("input",{className:"input",value:f.title,onChange:e=>set("title",e.target.value),placeholder:"Song title"})),
      h("label",{className:"text-sm md:col-span-2"}, h("div",{className:"ticker mb-1"},"Artist"), h("input",{className:"input",value:f.artist,onChange:e=>set("artist",e.target.value),placeholder:"Artist"})),
      h("label",{className:"text-sm"}, h("div",{className:"ticker mb-1"},"Status"),
        h("select",{className:"input",value:f.status,onChange:e=>set("status",e.target.value)}, SONG_STATUSES.map(s=>h("option",{key:s.id,value:s.id}, s.label)))),
      h("label",{className:"text-sm"}, h("div",{className:"ticker mb-1"},"Proposed by"), h("input",{className:"input",value:f.proposer,onChange:e=>set("proposer",e.target.value),placeholder:"e.g. Veena, Sourberry"})),
      h("label",{className:"text-sm"}, h("div",{className:"ticker mb-1"},"Length"),
        h("input",{className:"input",value:durationText,onChange:e=>{setDurationText(e.target.value); setDurationError("");},placeholder:"3:45"}),
        durationError && h("div",{className:"text-xs mt-1 text-[var(--berry)]"}, durationError)),
      h("label",{className:"text-sm"}, h("div",{className:"ticker mb-1"},"Album"), h("input",{className:"input",value:f.album,onChange:e=>set("album",e.target.value),placeholder:"e.g. Back to Black"})),
      h("label",{className:"text-sm"}, h("div",{className:"ticker mb-1"},"Year"), h("input",{className:"input",value:f.year,onChange:e=>set("year",e.target.value),placeholder:"e.g. 2007"})),
      h("label",{className:"text-sm md:col-span-2"}, h("div",{className:"ticker mb-1"},"Cover art URL"), h("input",{className:"input",type:"url",value:f.coverArtUrl,onChange:e=>set("coverArtUrl",e.target.value),placeholder:"https://…"})),
      h("label",{className:"text-sm"}, h("div",{className:"ticker mb-1"},"Apple Music URL"), h("input",{className:"input",type:"url",value:f.iTunesUrl,onChange:e=>set("iTunesUrl",e.target.value),placeholder:"https://music.apple.com/…"})),
      h("label",{className:"text-sm"}, h("div",{className:"ticker mb-1"},"Spotify URL"), h("input",{className:"input",type:"url",value:f.spotifyUrl,onChange:e=>set("spotifyUrl",e.target.value),placeholder:"https://open.spotify.com/…"})),
      h("label",{className:"text-sm md:col-span-2 flex items-start gap-2 mt-1"},
        h("input",{type:"checkbox",checked:!!f.jamtrax,onChange:e=>set("jamtrax",e.target.checked),className:"w-4 h-4 mt-0.5"}),
        h("span",null, h("span",{className:"font-semibold"},"Jamtrax available"), h("br",null), h("span",{className:"text-xs text-[var(--ink-soft)]"},"A Jamkazam feature — guided backing tracks for online jamming, useful when not all members can make it."))
      ),
      h("label",{className:"text-sm md:col-span-2"}, h("div",{className:"ticker mb-1"},"Lesson / tab URL"), h("input",{className:"input",type:"url",value:f.lessonUrl,onChange:e=>set("lessonUrl",e.target.value),placeholder:"https://…"})),
      h("label",{className:"text-sm md:col-span-2"}, h("div",{className:"ticker mb-1"},"Comments"), h("textarea",{className:"input",rows:"2",value:f.comments,onChange:e=>set("comments",e.target.value)}))
    ),
    h("div",{className:"flex flex-wrap gap-2 mt-4"},
      h("button",{onClick:handleSave,className:"btn berry-bg px-4 py-2 font-semibold"},"Save"),
      h("button",{onClick:onCancel,className:"btn bg-white px-4 py-2"},"Cancel"),
      onDelete && h("button",{onClick:()=>{ if(confirm("Delete this song?")) onDelete(); },className:"btn bg-white px-4 py-2 ml-auto text-[var(--berry)]"},"Delete")
    )
  );
};

const cyclePractice = current => {

  if (current === "rusty") return "learn";
  if (current === "learn") return null;

};

const SongsView = ({songs, member, mutate}) => {
  const [editingId, setEditingId] = useState(null);
  const [adding, setAdding] = useState(false);
  const [view, setView] = useState("repertoire");
  const [query, setQuery] = useState("");
  const [sortMode, setSortMode] = useState("smart");
  const [bulkOpen, setBulkOpen] = useState(false);
  const [bulkProgress, setBulkProgress] = useState(null); // {current, total, song}
  const [bulkResult, setBulkResult] = useState(null); // {filled, skipped, failed, total}
  const bulkCancelRef = useRef(false);

  const all = songsList(songs);
  const counts = {}; SONG_STATUSES.forEach(s => { counts[s.id] = all.filter(x => x.status === s.id).length; });
  // Candidates for bulk fill: have title+artist, are missing core metadata
  const bulkCandidates = all.filter(s => s.title && s.artist && (!s.lengthSec || !s.coverArtUrl || !s.album || !s.iTunesUrl));

  const list = all.filter(s => s.status === view);
  list.sort((a, b) => {
    if (sortMode === "newest") return (b.createdAt||0) - (a.createdAt||0);
    if (sortMode === "title") return (a.title||"").localeCompare(b.title||"");
    if (view === "suggested") {
      const aNew = isNew(a.createdAt), bNew = isNew(b.createdAt);
      if (aNew && !bNew) return -1;
      if (!aNew && bNew) return 1;
      if (aNew && bNew) return (b.createdAt||0) - (a.createdAt||0);
      const yA = MEMBERS.filter(m => a.votes && a.votes[m.id] === "yes").length;
      const yB = MEMBERS.filter(m => b.votes && b.votes[m.id] === "yes").length;
      if (yA !== yB) return yB - yA;
    }
    return (a.title||"").localeCompare(b.title||"");
  });
  const filtered = list.filter(s => songMatchesQuery(s, query));

  const updateSong = (id, data) => mutate(prev => Object.assign({}, prev, {songs: Object.assign({}, prev.songs||{}, {[id]: Object.assign({}, (prev.songs && prev.songs[id])||{}, data)})}));
  const setStatus = (id, status) => updateSong(id, {status});
  const createSong = (data) => { mutate(prev => Object.assign({}, prev, {songs: Object.assign({}, prev.songs||{}, {[newId("s")]: Object.assign({}, data, {votes:{}, practice:{}, createdAt: Date.now()})})})); setAdding(false); };
  const deleteSong = (id) => { mutate(prev => { const songs = Object.assign({}, prev.songs||{}); delete songs[id]; return Object.assign({}, prev, {songs}); }); setEditingId(null); };
  const voteSong = (id, mid, val) => mutate(prev => {
    const songs = Object.assign({}, prev.songs||{});
    const s = Object.assign({}, songs[id]||{});
    const v = Object.assign({}, s.votes||{});
    if (!val) delete v[mid]; else v[mid] = val;
    s.votes = v; songs[id] = s;
    return Object.assign({}, prev, {songs});
  });
  const setPractice = (id, mid, val) => mutate(prev => {
    const songs = Object.assign({}, prev.songs||{});
    const s = Object.assign({}, songs[id]||{});
    const p = Object.assign({}, s.practice||{});
    if (!val) delete p[mid]; else p[mid] = val;
    s.practice = p; songs[id] = s;
    return Object.assign({}, prev, {songs});
  });
  const promoteSong = (id) => mutate(prev => Object.assign({}, prev, {songs: Object.assign({}, prev.songs||{}, {[id]: Object.assign({}, (prev.songs && prev.songs[id])||{}, {status:"shortlist", votes:{}})})}));

  // ---- Bulk fill from Apple Music
  const startBulkFill = async () => {
    setBulkOpen(true);
    setBulkResult(null);
    bulkCancelRef.current = false;
    const candidates = bulkCandidates.slice();
    if (candidates.length === 0) {
      setBulkResult({filled:0, skipped:0, failed:0, total:0});
      return;
    }
    let filled = 0, skipped = 0, failed = 0;
    for (let i = 0; i < candidates.length; i++) {
      if (bulkCancelRef.current) break;
      const song = candidates[i];
      setBulkProgress({current: i+1, total: candidates.length, song: (song.title||"") + (song.artist ? (" · " + song.artist) : "")});
      try {
        const results = await itunesSearch((song.artist||"") + " " + (song.title||""), 1);
        const top = results[0];
        if (!top || !confidenceMatch(song, top)) { skipped++; continue; }
        const updates = {};
        if (!song.lengthSec && top.lengthSec) updates.lengthSec = top.lengthSec;
        if (!song.album && top.album) updates.album = top.album;
        if (!song.year && top.year) updates.year = top.year;
        if (!song.coverArtUrl && top.coverArtUrl) updates.coverArtUrl = top.coverArtUrl;
        if (!song.iTunesUrl && top.iTunesUrl) updates.iTunesUrl = top.iTunesUrl;
        if (Object.keys(updates).length > 0) { updateSong(song.id, updates); filled++; } else { skipped++; }
      } catch (e) { failed++; }
      await new Promise(r => setTimeout(r, 220));
    }
    setBulkProgress(null);
    setBulkResult({filled, skipped, failed, total: candidates.length, cancelled: bulkCancelRef.current});
  };
  const cancelBulk = () => { bulkCancelRef.current = true; };
  const closeBulk = () => { setBulkOpen(false); setBulkProgress(null); setBulkResult(null); };

  const allInSuggested = all.filter(c => c.status==="suggested" && MEMBERS.every(m => c.votes && c.votes[m.id]==="yes")).length;
  const newSuggested = all.filter(c => c.status==="suggested" && isNew(c.createdAt)).length;
  const currentStatus = SONG_STATUSES.find(s => s.id === view);

  return h("div",null,
    // Bulk fill modal
    bulkOpen && h("div",{className:"modal-bg",onClick: bulkProgress ? null : closeBulk},
      h("div",{className:"card p-5 max-w-md w-full",onClick:e=>e.stopPropagation()},
        h("h3",{className:"display text-2xl mb-2"},"Auto-fill from Apple Music"),
        bulkProgress && h(React.Fragment,null,
          h("p",{className:"text-sm text-[var(--ink-soft)]"}, "Looking up " + bulkProgress.current + " of " + bulkProgress.total),
          h("p",{className:"text-sm font-semibold mt-1 truncate"}, bulkProgress.song),
          h("div",{className:"mt-3 h-2 bg-[var(--line)]/10 rounded overflow-hidden"},
            h("div",{className:"h-full berry-bg",style:{width: Math.round((bulkProgress.current/bulkProgress.total)*100) + "%"}})
          ),
          h("div",{className:"mt-4"},
            h("button",{onClick:cancelBulk,className:"btn bg-white px-4 py-2 text-sm"},"Cancel")
          ),
          h("p",{className:"text-xs text-[var(--ink-soft)] italic mt-3"},"Existing fields are never overwritten. Only blank fields get filled.")
        ),
        !bulkProgress && bulkResult && h(React.Fragment,null,
          h("p",{className:"text-sm font-semibold"}, bulkResult.cancelled ? "Cancelled." : "Done."),
          h("div",{className:"mt-3 space-y-1 text-sm"},
            h("div",null, h("span",{className:"text-[var(--good)] font-semibold"},"✓ Filled: "), bulkResult.filled),
            h("div",null, h("span",{className:"text-[var(--ink-soft)] font-semibold"},"— Skipped: "), bulkResult.skipped, " ", h("span",{className:"text-xs text-[var(--ink-soft)] italic"},"(no confident match)")),
            bulkResult.failed > 0 && h("div",null, h("span",{className:"text-[var(--berry)] font-semibold"},"✗ Failed: "), bulkResult.failed, " ", h("span",{className:"text-xs text-[var(--ink-soft)] italic"},"(network/API error)"))
          ),
          h("p",{className:"text-xs text-[var(--ink-soft)] italic mt-3"},"Skipped songs need manual lookup — open each and tap the Apple Music search button."),
          h("div",{className:"mt-4 flex gap-2"},
            h("button",{onClick:closeBulk,className:"btn berry-bg px-4 py-2 text-sm font-semibold"},"Close")
          )
        ),
        !bulkProgress && !bulkResult && h(React.Fragment,null,
          h("p",{className:"text-sm text-[var(--ink-soft)]"},"Preparing…")
        )
      )
    ),

    // Status pills
    h("div",{className:"flex gap-2 overflow-x-auto pb-1 mb-3"},
      SONG_STATUSES.map(s => h("button",{key:s.id, onClick:()=>setView(s.id),
        className:"pill px-3 py-1.5 text-sm font-semibold whitespace-nowrap shrink-0 " + (view===s.id?"berry-bg text-white":"bg-white hover:bg-[var(--acid)]")},
        s.label, " ", h("span",{className:"opacity-70 ml-1"}, counts[s.id]),
        s.id==="suggested" && (allInSuggested + newSuggested > 0) && view!=="suggested" && h("span",{className:"ml-1 text-[10px] berry-bg text-white px-1 rounded-full"}, newSuggested>0 ? (newSuggested + " new") : (allInSuggested + "!"))
      ))
    ),
    // Search + add
    h("div",{className:"flex items-center justify-between gap-2 mb-3 flex-wrap"},
      h("input",{className:"input flex-1",value:query,onChange:e=>setQuery(e.target.value),placeholder:"Search " + (currentStatus ? currentStatus.label.toLowerCase() : "") + "…"}),
      h("button",{onClick:()=>{setAdding(true); setEditingId(null);},className:"btn berry-bg px-4 py-2 text-sm font-semibold whitespace-nowrap"},"+ Add song")
    ),
    // Description + sort + bulk fill
    h("div",{className:"card p-3 mb-4 text-sm"},
      h("div",{className:"flex items-baseline gap-2 flex-wrap"},
        h("span",{className:"ticker text-[var(--berry)]"}, currentStatus && currentStatus.label),
        h("span",{className:"text-[var(--ink-soft)]"}, currentStatus && currentStatus.desc)
      ),
      h("div",{className:"flex items-center gap-1.5 mt-2 flex-wrap"},
        h("span",{className:"ticker text-[var(--ink-soft)]"},"Sort"),
        [
          {id:"smart", label: view==="suggested" ? "New & popular" : "By title"},
          {id:"newest", label:"Newest"},
          {id:"title", label:"A–Z"}
        ].map(opt => h("button",{key:opt.id, onClick:()=>setSortMode(opt.id), className:"pill px-2 py-0.5 text-xs " + (sortMode===opt.id?"berry-bg text-white":"bg-white")}, opt.label))
      ),
      bulkCandidates.length > 0 && h("div",{className:"mt-2 pt-2 border-t border-[var(--line)]/15 flex items-center gap-2 flex-wrap"},
        h("span",{className:"text-xs text-[var(--ink-soft)]"}, bulkCandidates.length + " song" + (bulkCandidates.length===1?"":"s") + " missing details"),
        h("button",{onClick:startBulkFill,className:"btn bg-white px-2.5 py-1 text-xs font-semibold ml-auto"},"🔍 Auto-fill from Apple Music")
      )
    ),
    adding && h(SongForm,{onSave: createSong, onCancel: () => setAdding(false)}),
    filtered.length===0 && !adding && h("div",{className:"card p-6 text-center"}, h("p",{className:"display text-xl"}, query?"No matches.":"Nothing here yet.")),
    h("div",{className:"space-y-1.5"},
      filtered.map(s => editingId===s.id
        ? h(SongForm,{key:s.id, initial:s, onSave: f => { updateSong(s.id, f); setEditingId(null); }, onCancel: () => setEditingId(null), onDelete: () => deleteSong(s.id)})
        : h(SongCard,{key:s.id, song:s, member:member, onEdit: () => { setEditingId(s.id); setAdding(false); }, onVote: voteSong, onSetStatus: setStatus, onSetPractice: setPractice, onPromote: promoteSong})
      )
    )
  );
};

const SetlistDetail = ({setlist, songs, events, member, onBack, onUpdate, onDelete, onDuplicate}) => {
  const [editingName, setEditingName] = useState(false);
  const [name, setName] = useState(setlist.name);
  const [editingSetIdx, setEditingSetIdx] = useState(null);
  const [editingSetName, setEditingSetName] = useState("");
  const [picker, setPicker] = useState(null); // null | {kind:"set", index:n} | {kind:"soundcheck"}
  const [viewMode, setViewMode] = useState("detailed");
  const sets = setlist.sets || [];
  const soundcheckId = setlist.soundcheckSongId || null;
  const gigOptions = eventsList(events).filter(e => e.type === "gig");
  const totals = setlistTotals(setlist, songs);
  const totalSongs = setlistSongCount(setlist);
  const totalsLabel = (() => {
    const setLabel = sets.length + " set" + (sets.length===1?"":"s");
    if (totalSongs === 0) return "Empty · " + setLabel;
    const songLabel = totalSongs + " song" + (totalSongs===1?"":"s");
    if (totals.total === 0) return songLabel + " in " + setLabel + " · no durations yet";
    const dur = formatDuration(totals.total) + (totals.missing > 0 ? "+" : "");
    const missingLabel = totals.missing > 0 ? (" · " + totals.missing + " missing length") : "";
    return "Total " + dur + " · " + songLabel + " in " + setLabel + missingLabel;
  })();

  // Mutations on sets
  const updateSet = (setIdx, data) => onUpdate({sets: sets.map((s,i) => i===setIdx ? Object.assign({}, s, data) : s)});
  const renameSet = (setIdx, newName) => updateSet(setIdx, {name: newName.trim() || ("Set " + (setIdx+1))});
  const addSet = () => {
    const usedNumbers = sets.map(s => {
      const m = (s.name || "").match(/^Set\s+(\d+)$/i);
      return m ? parseInt(m[1],10) : 0;
    });
    const nextNum = Math.max(0, ...usedNumbers, sets.length) + 1;
    onUpdate({sets: sets.concat([{name: "Set " + nextNum, songIds: []}])});
  };
  const deleteSet = (setIdx) => {
    const set = sets[setIdx];
    const songCount = (set.songIds || []).length;
    if (songCount > 0 && !confirm("Delete \"" + (set.name||"set") + "\" with " + songCount + " song" + (songCount===1?"":"s") + "?")) return;
    if (songCount === 0 && !confirm("Delete \"" + (set.name||"set") + "\"?")) return;
    let newSets = sets.slice();
    newSets.splice(setIdx, 1);
    if (newSets.length === 0) newSets = [{name:"Set 1", songIds:[]}];
    onUpdate({sets: newSets});
  };
  const moveSongInSet = (setIdx, songIdx, dir) => {
    const set = sets[setIdx];
    const arr = (set.songIds || []).slice();
    const ni = songIdx + dir;
    if (ni < 0 || ni >= arr.length) return;
    const tmp = arr[songIdx]; arr[songIdx] = arr[ni]; arr[ni] = tmp;
    updateSet(setIdx, {songIds: arr});
  };
  const removeSongFromSet = (setIdx, songIdx) => {
    const arr = (sets[setIdx].songIds || []).slice();
    arr.splice(songIdx, 1);
    updateSet(setIdx, {songIds: arr});
  };
  const addSongToSet = (setIdx, songId) => {
    const cur = sets[setIdx].songIds || [];
    if (cur.includes(songId)) return;
    updateSet(setIdx, {songIds: cur.concat([songId])});
  };
  const setSoundcheck = id => onUpdate({soundcheckSongId: id});
  const clearSoundcheck = () => onUpdate({soundcheckSongId: null});

  // Picker handlers
  const handlePick = (songId) => {
    if (!picker) return;
    if (picker.kind === "soundcheck") setSoundcheck(songId);
    else if (picker.kind === "set") addSongToSet(picker.index, songId);
    setPicker(null);
  };
  const pickerExcludeIds = picker
    ? (picker.kind === "soundcheck" ? (soundcheckId ? [soundcheckId] : []) : setlistAllSongIds(setlist))
    : [];

  const renderSongRow = (sid, setIdx, songIdx, isLast) => {
    const s = songs && songs[sid];
    if (!s) return h("li",{key:sid+"-"+songIdx,className:"card-flat p-3 text-sm italic text-[var(--ink-soft)]"},
      "(deleted song) ",
      h("button",{onClick:()=>removeSongFromSet(setIdx, songIdx),className:"text-[var(--berry)] underline ml-2"},"remove")
    );
    return h("li",{key:sid+"-"+songIdx,className:"card-flat p-3"},
      h("div",{className:"flex items-start gap-3"},
        h("div",{className:"display text-xl text-[var(--berry)] shrink-0 w-8"}, (songIdx+1) + "."),
        s.coverArtUrl && h("img",{src:s.coverArtUrl, alt:"", className:"shrink-0 rounded border border-[var(--line)]/30", style:{width:40,height:40,objectFit:"cover"}, onError:e=>{e.target.style.display="none";}}),
        h("div",{className:"flex-1 min-w-0"},
          h("div",{className:"display text-base leading-tight"}, s.title),
          s.artist && h("div",{className:"text-xs text-[var(--ink-soft)] italic"}, s.artist),
          h("div",{className:"mt-1.5 flex items-center gap-1.5 flex-wrap"},
            h("span",{className:"ticker text-[var(--ink-soft)]"}, (SONG_STATUSES.find(x=>x.id===s.status)||{}).label),
            formatDuration(s.lengthSec) && h("span",{className:"ticker text-[var(--ink-soft)]"}, "· " + formatDuration(s.lengthSec)),
            h("span",{className:"ticker text-[var(--ink-soft)]"},"·"),
            MEMBERS.map(m => h(PracticeChip,{key:m.id, initial:m.name[0], state: s.practice && s.practice[m.id], isMe: false}))
          )
        ),
        h("div",{className:"flex flex-col gap-1 shrink-0"},
          h("button",{onClick:()=>moveSongInSet(setIdx, songIdx, -1),disabled:songIdx===0,className:"pill px-2 py-0.5 text-xs bg-white disabled:opacity-30"},"↑"),
          h("button",{onClick:()=>moveSongInSet(setIdx, songIdx, 1),disabled:isLast,className:"pill px-2 py-0.5 text-xs bg-white disabled:opacity-30"},"↓"),
          h("button",{onClick:()=>removeSongFromSet(setIdx, songIdx),className:"pill px-2 py-0.5 text-xs bg-white text-[var(--berry)]"},"×")
        )
      )
    );
  };

  return h("div",null,
    h("button",{onClick:onBack,className:"ticker text-[var(--berry)] mb-3"},"← Back to setlists"),
    h("div",{className:"card p-3 sm:p-4 mb-4"},
      editingName
        ? h("div",{className:"flex gap-2"},
            h("input",{className:"input flex-1",value:name,onChange:e=>setName(e.target.value),autoFocus:true}),
            h("button",{onClick:()=>{ onUpdate({name: name.trim() || setlist.name}); setEditingName(false); },className:"btn berry-bg px-3 py-1.5 text-sm font-semibold"},"Save"))
        : h("div",{className:"flex items-start justify-between gap-3"},
            h("h2",{className:"display text-xl sm:text-2xl md:text-3xl leading-tight break-words flex-1 min-w-0"}, setlist.name),
            h("button",{onClick:()=>setEditingName(true),className:"ticker text-[var(--ink-soft)] hover:text-[var(--berry)] shrink-0 mt-1"},"Rename ▸")),
      h("div",{className:"mt-1.5 text-sm text-[var(--ink-soft)]"}, totalsLabel),
      h("div",{className:"mt-3 flex items-center gap-2 flex-wrap"},
        h("span",{className:"ticker text-[var(--ink-soft)]"},"Pin to gig"),
        h("select",{className:"input text-sm flex-1 min-w-0",value: setlist.gigEventId || "",onChange:e=>onUpdate({gigEventId: e.target.value || null})},
          h("option",{value:""},"— none —"),
          gigOptions.map(g => h("option",{key:g.id,value:g.id}, fmtDate(g.date) + " · " + (g.title || "Gig"))))
      ),
      h("details",{className:"block mt-3"},
        h("summary",{className:"ticker text-[var(--ink-soft)] hover:text-[var(--berry)]"},"Notes ▾"),
        h("textarea",{className:"input text-sm mt-2",rows:"2",value:setlist.notes||"",onChange:e=>onUpdate({notes:e.target.value}),placeholder:"e.g. running order tweaks, key changes…"})
      ),
      h("div",{className:"mt-3 sm:mt-4 flex gap-2 flex-wrap items-center"},
        h("div",{className:"flex gap-1"},
          h("button",{onClick:()=>setViewMode("detailed"),className:"pill px-2.5 py-1 text-xs font-semibold " + (viewMode==="detailed"?"berry-bg text-white":"bg-white")},"Detailed"),
          h("button",{onClick:()=>setViewMode("summary"),className:"pill px-2.5 py-1 text-xs font-semibold " + (viewMode==="summary"?"berry-bg text-white":"bg-white")},"Summary")),
        onDuplicate && h("button",{onClick:onDuplicate,className:"btn bg-white px-3 py-2 text-sm sm:ml-auto"},"Duplicate"),
        h("button",{onClick:()=>{ if (confirm("Delete setlist \"" + setlist.name + "\"?")) onDelete(); },className:"btn bg-white px-3 py-2 text-sm text-[var(--berry)]"},"Delete")
      )
    ),

    // Picker modal
    picker && h(SongPicker,{songs:songs, excludeIds: pickerExcludeIds, onPick: handlePick, onClose: () => setPicker(null)}),

    // SUMMARY VIEW
    viewMode === "summary" && h("div",{className:"card p-5 space-y-5"},
      h("h3",{className:"display text-2xl"}, setlist.name),

      sets.map((set, si) => {

        const setLenLabel = setLen.total > 0 ? (formatDuration(setLen.total) + (setLen.missing > 0 ? "+" : "")) : "";
        return h("div",{key:si},

            setLenLabel && h("span",{className:"ticker text-[var(--ink-soft)]"}, setIds.length + " songs · " + setLenLabel)
          ),
          setIds.length === 0
            ? h("p",{className:"text-sm italic text-[var(--ink-soft)]"},"(empty)")
            : h("ol",{className:"space-y-1 text-sm"},
                setIds.map((sid, i) => {
                  const s = songs && songs[sid];
                  if (!s) return h("li",{key:sid+"-"+i,className:"text-[var(--ink-soft)] italic"}, (i+1) + ". (deleted song)");
                  const sLen = formatDuration(s.lengthSec);
                  return h("li",{key:sid+"-"+i,className:"flex gap-2 items-baseline"},
                    h("span",{className:"text-[var(--berry)] font-semibold w-6 shrink-0"}, (i+1) + "."),
                    h("span",{className:"font-semibold"}, s.title),
                    s.artist && h("span",{className:"text-[var(--ink-soft)] italic"},"— " + s.artist),

    ),

    // DETAILED VIEW
    viewMode === "detailed" && h("div",{className:"space-y-5"},
      // Soundcheck section
      h("section",null,
        h("div",{className:"flex items-center justify-between gap-2 mb-2 flex-wrap"},

        ),
        soundcheckId && (() => {

          if (!s) return h("div",{className:"card-flat p-3 text-sm italic text-[var(--ink-soft)]"},
            "(deleted song) ",

          );
          return h("div",{className:"card-flat p-3"},

              h("div",{className:"flex-1 min-w-0"},

                  h("button",{onClick:()=>setEditingSetIdx(null),className:"btn bg-white px-2 py-1 text-xs"},"Cancel")
                )
              : h("div",{className:"flex items-baseline gap-2 flex-wrap"},
                  h("h3",{className:"display text-xl text-[var(--berry)]"}, set.name || ("Set " + (si+1))),
                  h("button",{onClick:()=>{ setEditingSetIdx(si); setEditingSetName(set.name || ""); },className:"ticker text-[var(--ink-soft)] hover:text-[var(--berry)]"},"rename ▸"),

                ),
            !isEditingThis && h("div",{className:"flex gap-1 shrink-0"},

            )
          ),
          // Songs
          setIds.length === 0
            ? h("div",{className:"card-flat p-4 text-center text-sm italic text-[var(--ink-soft)]"},"No songs in this set yet.")
            : h("ol",{className:"space-y-2"}, setIds.map((sid, i) => renderSongRow(sid, si, i, i === setIds.length - 1)))
        );

};

const SetlistsView = ({setlists, songs, events, member, mutate}) => {
  const [openId, setOpenId] = useState(null);
  const [creating, setCreating] = useState(false);
  const [newName, setNewName] = useState("");
  const all = setlistsList(setlists).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  const createSetlist = name => {
    const id = newId("sl");
    mutate(prev => Object.assign({}, prev, {setlists: Object.assign({}, prev.setlists||{}, {[id]: {name, sets:[{name:"Set 1",songIds:[]}], soundcheckSongId:null, gigEventId:null, notes:"", createdAt: Date.now()}})}));
    setOpenId(id); setCreating(false); setNewName("");
  };
  const updateSetlist = (id, data) => mutate(prev => Object.assign({}, prev, {setlists: Object.assign({}, prev.setlists||{}, {[id]: Object.assign({}, (prev.setlists && prev.setlists[id])||{}, data)})}));
  const deleteSetlist = id => { mutate(prev => { const sl = Object.assign({}, prev.setlists||{}); delete sl[id]; return Object.assign({}, prev, {setlists: sl}); }); setOpenId(null); };
  const duplicateSetlist = id => {
    const src = setlists && setlists[id];
    if (!src) return;
    const newSlId = newId("sl");
    const clonedSets = (src.sets || []).map(s => ({name: s.name, songIds: (s.songIds || []).slice()}));
    if (clonedSets.length === 0) clonedSets.push({name:"Set 1",songIds:[]});
    mutate(prev => Object.assign({}, prev, {setlists: Object.assign({}, prev.setlists||{}, {[newSlId]: {name: (src.name || "Setlist") + " (copy)", sets: clonedSets, soundcheckSongId: src.soundcheckSongId || null, gigEventId: null, notes: src.notes || "", createdAt: Date.now()}})}));
    setOpenId(newSlId);
  };
  if (openId && setlists && setlists[openId]) {
    return h(SetlistDetail,{setlist: Object.assign({id:openId}, setlists[openId]), songs:songs, events:events, member:member, onBack:()=>setOpenId(null), onUpdate: data => updateSetlist(openId, data), onDelete: () => deleteSetlist(openId), onDuplicate: () => duplicateSetlist(openId)});
  }
  return h("div",null,
    h("div",{className:"flex items-center justify-between mb-4 flex-wrap gap-2"},
      h("p",{className:"text-sm text-[var(--ink-soft)]"},"Build a named setlist from your library, optionally pinned to a gig."),
      h("button",{onClick:()=>setCreating(true),className:"btn berry-bg px-4 py-2 text-sm font-semibold"},"+ New setlist")
    ),
    creating && h("div",{className:"card p-4 mb-4"},
      h("label",{className:"text-sm block"}, h("div",{className:"ticker mb-1"},"Name"), h("input",{autoFocus:true,className:"input",value:newName,onChange:e=>setNewName(e.target.value),placeholder:"e.g. Dec 2026 — provisional"})),
      h("div",{className:"flex gap-2 mt-3"},
        h("button",{onClick:()=> newName.trim() && createSetlist(newName.trim()),className:"btn berry-bg px-4 py-2 font-semibold",disabled:!newName.trim()},"Create"),
        h("button",{onClick:()=>{ setCreating(false); setNewName(""); },className:"btn bg-white px-4 py-2"},"Cancel")
      )
    ),
    all.length===0 && !creating && h("div",{className:"card p-6 text-center"}, h("p",{className:"display text-xl"},"No setlists yet.")),
    h("div",{className:"space-y-3"},
      all.map(sl => {
        const songCount = setlistSongCount(sl);
        const slLen = setlistTotals(sl, songs);
        const setCount = (sl.sets || []).length;
        const lenLabel = slLen.total > 0 ? (formatDuration(slLen.total) + (slLen.missing > 0 ? "+" : "")) : "";
        const gig = sl.gigEventId && events && events[sl.gigEventId];
        return h("button",{key:sl.id,onClick:()=>setOpenId(sl.id),className:"card-flat p-4 w-full text-left hover:bg-[var(--acid)]/20 transition"},
          h("div",{className:"flex items-center justify-between gap-3 flex-wrap"},
            h("div",{className:"flex-1 min-w-0"},
              h("div",{className:"display text-xl leading-tight"}, sl.name),
              h("div",{className:"text-sm text-[var(--ink-soft)] mt-1"}, songCount + " song" + (songCount===1?"":"s") + " in " + setCount + " set" + (setCount===1?"":"s") + (lenLabel ? (" · " + lenLabel) : "") + (gig ? (" · pinned to " + (gig.title||"gig") + " on " + fmtDate(gig.date)) : ""))
            ),
            h("span",{className:"ticker text-[var(--berry)]"},"Open ▸")
          )
        );
      })
    )
  );
};

const isWeekend = date => { const d = date.getDay(); return d === 0 || d === 6; };
const slotLabelForDate = date => isWeekend(date) ? "Day" : "Eve";
const slotDescForDate = date => isWeekend(date) ? "Daytime" : "Evening (after 6pm)";
const defaultTimeForDate = date => isWeekend(date) ? {startTime:"15:00",endTime:"18:00"} : {startTime:"18:00",endTime:"21:00"};
const localISO = date => {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return y + "-" + m + "-" + d;
};
const dayCellColor = (yesCount, totalMembers) => {
  if (yesCount === totalMembers && totalMembers > 0) return {bg:"rgba(31,143,74,0.35)",border:"var(--good)"};
  if (yesCount === totalMembers - 1 && totalMembers > 1) return {bg:"rgba(31,143,74,0.15)",border:"rgba(31,143,74,0.5)"};
  if (yesCount >= 2) return {bg:"rgba(214,240,74,0.35)",border:"rgba(26,10,20,0.2)"};
  if (yesCount >= 1) return {bg:"transparent",border:"rgba(26,10,20,0.2)"};
  return {bg:"transparent",border:"rgba(26,10,20,0.15)"};
};

// v8: month-by-month calendar, compact intro
const PracticeView = ({practiceAvail, events, member, mutate, onGoToSchedule}) => {
  const [monthOffset, setMonthOffset] = useState(0); // 0 = current month
  const [openDate, setOpenDate] = useState(null);
  const [showBulk, setShowBulk] = useState(false);
  const [isCompact, setIsCompact] = useState(() => typeof window !== "undefined" && window.innerWidth < 640);
  useEffect(() => {
    const onResize = () => setIsCompact(window.innerWidth < 640);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  // Anchor: 1st of displayed month
  const displayedMonth = useMemo(() => {
    const d = new Date();
    d.setHours(0,0,0,0);
    d.setDate(1);
    d.setMonth(d.getMonth() + monthOffset);
    return d;
  }, [monthOffset]);

  // Find Monday of week containing the 1st (week starts Mon)
  const calendarStart = useMemo(() => {
    const d = new Date(displayedMonth);
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d;
  }, [displayedMonth]);

  // Build 6 weeks × 7 days grid, mark in/out of current month
  const weeks = useMemo(() => {
    const result = [];
    const monthIdx = displayedMonth.getMonth();
    for (let w = 0; w < 6; w++) {
      const week = [];
      for (let d = 0; d < 7; d++) {
        const date = new Date(calendarStart);
        date.setDate(calendarStart.getDate() + w*7 + d);
        week.push({date, iso: localISO(date), inCurrentMonth: date.getMonth() === monthIdx});
      }
      result.push(week);
    }
    return result;
  }, [calendarStart, displayedMonth]);

  // Only the days in the current month are subject to bulk operations / clearing
  const inMonthDates = useMemo(() => weeks.flat().filter(c => c.inCurrentMonth), [weeks]);

  const setMyAvail = (iso, val) => {
    if (!member) return;
    mutate(prev => {
      const pa = Object.assign({}, prev.practiceAvail||{});
      const day = Object.assign({}, pa[iso]||{});
      if (!val) delete day[member.id]; else day[member.id] = val;
      if (Object.keys(day).length === 0) delete pa[iso]; else pa[iso] = day;
      return Object.assign({}, prev, {practiceAvail: pa});
    });
  };

  const bulkApply = (predicate, val) => {
    if (!member) return;
    mutate(prev => {
      const pa = Object.assign({}, prev.practiceAvail||{});
      inMonthDates.forEach(({date, iso}) => {
        if (predicate(date)) {
          const day = Object.assign({}, pa[iso]||{});
          if (!val) delete day[member.id]; else day[member.id] = val;
          if (Object.keys(day).length === 0) delete pa[iso]; else pa[iso] = day;
        }
      });
      return Object.assign({}, prev, {practiceAvail: pa});
    });
  };

  const clearAllMyMarks = () => {
    if (!member) return;
    if (!confirm("Clear all your availability marks for " + monthLabel + "?")) return;
    bulkApply(() => true, null);
  };

  const bookRehearsalOn = iso => {
    const date = new Date(iso + "T00:00:00");
    const t = defaultTimeForDate(date);
    const eId = newId("e");
    const sourceAvail = (practiceAvail && practiceAvail[iso]) || {};
    mutate(prev => {
      const events = Object.assign({}, prev.events||{});
      events[eId] = {date: iso, startTime: t.startTime, endTime: t.endTime, type:"rehearsal", venueType:"in-person-studio", location:"", bookingOwner:"", confirmed:false, status:"proposed", title:"", comments:"", availability: Object.assign({}, sourceAvail), createdAt: Date.now()};
      return Object.assign({}, prev, {events});
    });
    setOpenDate(null);
    if (onGoToSchedule) onGoToSchedule();
  };

  const monthLabel = displayedMonth.toLocaleDateString(undefined, {month:"long", year:"numeric"});
  const todayIsoStr = todayISO();

  return h("div",null,
    // v8: compact one-line intro (no big "When can we all jam?" headline)

const OwnedEquipmentView = ({equipment, member, mutate}) => {
  const [editingId, setEditingId] = useState(null);
  const [adding, setAdding] = useState(false);
  const [groupBy, setGroupBy] = useState("category");
  const all = equipmentList(equipment);
  const holders = Array.from(new Set(all.map(e => e.heldBy).filter(Boolean))).sort();
  const update = (id, data) => { mutate(prev => Object.assign({}, prev, {equipment: Object.assign({}, prev.equipment||{}, {[id]: Object.assign({}, (prev.equipment && prev.equipment[id])||{}, data)})})); setEditingId(null); };
  const create = data => { mutate(prev => Object.assign({}, prev, {equipment: Object.assign({}, prev.equipment||{}, {[newId("eq")]: Object.assign({}, data, {createdAt: Date.now()})})})); setAdding(false); };
  const remove = id => { mutate(prev => { const eq = Object.assign({}, prev.equipment||{}); delete eq[id]; return Object.assign({}, prev, {equipment: eq}); }); setEditingId(null); };
  const assignHolder = (id, name) => mutate(prev => Object.assign({}, prev, {equipment: Object.assign({}, prev.equipment||{}, {[id]: Object.assign({}, (prev.equipment && prev.equipment[id])||{}, {heldBy: name})})}));

  let groups = [];
  if (groupBy === "category") {
    groups = EQUIPMENT_CATEGORIES.map(c => ({key:c.id, label:c.label, items: all.filter(e => e.category === c.id).sort((a,b)=>a.name.localeCompare(b.name))})).filter(g => g.items.length>0);
  } else if (groupBy === "holder") {
    const map = {};
    all.forEach(e => { const ht = e.heldBy || "Unassigned"; if (!map[ht]) map[ht]=[]; map[ht].push(e); });
    groups = Object.keys(map).sort().map(ht => ({key:ht, label:ht, items: map[ht].sort((a,b)=>a.name.localeCompare(b.name))}));
  } else if (groupBy === "status") {
    groups = EQUIPMENT_STATUSES.map(s => ({key:s.id, label:s.label, items: all.filter(e => e.status === s.id).sort((a,b)=>a.name.localeCompare(b.name))})).filter(g => g.items.length>0);
  }
  const total = all.length;
  const issues = all.filter(e => e.status === "missing" || e.status === "broken").length;

  return h("div",null,
    h("div",{className:"card p-4 mb-4"},
      h("div",{className:"ticker text-[var(--berry)]"},"Kit list"),
      h("p",{className:"display text-2xl leading-tight mt-1"},"Who has what."),
      h("p",{className:"text-sm text-[var(--ink-soft)] mt-1"}, total + " item" + (total===1?"":"s") + " tracked" + (issues>0 ? (" · " + issues + " need attention") : "") + (member ? "" : " · pick who you are above to mark items as yours"))
    ),
    h("div",{className:"flex items-center justify-between mb-3 gap-2 flex-wrap"},
      h("div",{className:"flex gap-1.5 items-center overflow-x-auto pb-1"},
        h("span",{className:"ticker text-[var(--ink-soft)] shrink-0"},"Group by"),
        [{id:"category",label:"Category"},{id:"holder",label:"Who has it"},{id:"status",label:"Status"}].map(g => h("button",{key:g.id,onClick:()=>setGroupBy(g.id),className:"pill px-2.5 py-1 text-xs font-semibold whitespace-nowrap shrink-0 " + (groupBy===g.id?"berry-bg text-white":"bg-white")}, g.label))
      ),
      h("button",{onClick:()=>{setAdding(true); setEditingId(null);},className:"btn berry-bg px-3 py-2 text-sm font-semibold whitespace-nowrap shrink-0"},"+ Add item")
    ),
    adding && h(EquipmentForm,{onSave:create,onCancel:()=>setAdding(false),holderSuggestions:holders}),
    groups.length===0 && !adding && h("div",{className:"card p-6 text-center"}, h("p",{className:"display text-xl"},"No equipment tracked yet.")),
    h("div",{className:"space-y-6"},
      groups.map(g => h("section",{key:g.key},
        h("h2",{className:"display text-2xl mb-3"}, g.label, " ", h("span",{className:"text-[var(--ink-soft)] text-base"},"(" + g.items.length + ")")),
        h("div",{className:"space-y-2.5"},
          g.items.map(item => editingId===item.id
            ? h(EquipmentForm,{key:item.id,initial:item,onSave: f=>update(item.id, f),onCancel:()=>setEditingId(null),onDelete:()=>remove(item.id),holderSuggestions:holders})
            : h(EquipmentCard,{key:item.id,item:item,member:member,onEdit:()=>{setEditingId(item.id); setAdding(false);},onAssign:assignHolder})
          )
        )
      ))
    )
  );
};
